# Tilt overlay for otel-navigator Deployment
# Derived from zarf/manifests/panel-viz.yaml with:
#   - --autoreload added to Panel serve command
#   - Image ref uses Tilt-managed tag via Zarf registry
#   - imagePullPolicy: Always
#   - Zarf template variables removed (uses existing ConfigMap/Secret)
#
# NOTE: Namespace, ConfigMap, Secret, and Service are NOT included here.
# They persist from the original Zarf deployment with correct values.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-navigator
  namespace: panel-viz
  labels:
    app: otel-navigator
    app.kubernetes.io/name: otel-navigator
    app.kubernetes.io/component: visualization
    app.kubernetes.io/managed-by: tilt
    app.kubernetes.io/part-of: cybersec
spec:
  replicas: 1
  # Recreate (not RollingUpdate): on a tight laptop VM, surging a second pod
  # before killing the old one overcommits memory and deadlocks the rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: otel-navigator
  template:
    metadata:
      labels:
        app: otel-navigator
        app.kubernetes.io/name: otel-navigator
    spec:
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    dask.org/component: worker
                topologyKey: kubernetes.io/hostname
      containers:
        - name: otel-navigator
          image: cybersec-dask
          imagePullPolicy: IfNotPresent
          command:
            - panel
            - serve
            - /app/otel-navigator.py
            - --port=5006
            - --address=0.0.0.0
            - --allow-websocket-origin=*
            - --static-dirs
            - ghostty=/app/static/ghostty
            - --autoreload
          ports:
            - containerPort: 5006
              name: http
              protocol: TCP
          env:
            - name: DASK_SCHEDULER
              value: "tcp://cybersec-dask-scheduler.dask.svc.cluster.local:8786"
            # k3d dev has no ingress, and the browser hits Panel via :15006/:30506
            # (not :5006), so the app's auto-detect can't find the terminal WS.
            # Point it at the pty-proxy NodePort host-map (absolute, always mapped).
            - name: PTY_PROXY_WS
              value: "ws://localhost:30765"
          envFrom:
            - configMapRef:
                name: otel-navigator-config
            - secretRef:
                name: otel-navigator-credentials
          resources:
            # Laptop dev profile (fits an 8 GiB podman VM); production sizing
            # lives in zarf/manifests/panel-viz.yaml, not here.
            requests:
              cpu: 250m
              memory: 1536Mi
            limits:
              cpu: 2
              memory: 3Gi
          readinessProbe:
            tcpSocket:
              port: 5006
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 5006
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
        # PTY proxy sidecar: bridges terminal WebSocket to gRPC engine
        - name: pty-proxy
          image: cybersec-dask
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - cybersec.pty_proxy.server
            - --ws-port=8765
            - --engine-host=navigator-engine.panel-viz.svc.cluster.local
            - --engine-port=50051
          ports:
            - containerPort: 8765
              name: ws
              protocol: TCP
          env:
            - name: PYTHONPATH
              value: /app
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 8765
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8765
            initialDelaySeconds: 10
            periodSeconds: 30
