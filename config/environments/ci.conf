# CI/CD Environment Configuration
#
# Overrides for CI/CD pipelines.
# Assumes services run in containers with different ports/hosts.

include "../reference.conf"

cybersec {
  services {
    postgres {
      host = "postgres"
      host = ${?POSTGRES_HOST}
      port = 5432
    }

    minio {
      endpoint = "http://minio:9000"
      endpoint = ${?S3_ENDPOINT}
    }

    polaris {
      api_url = "http://polaris:8181"
      api_url = ${?POLARIS_API_URL}
      admin_url = "http://polaris:8182"
    }

    flink {
      jobmanager {
        host = "flink-jobmanager"
        host = ${?FLINK_JOBMANAGER_HOST}
      }
    }

    kafka {
      bootstrap_servers = "kafka:9092"
      bootstrap_servers = ${?KAFKA_BOOTSTRAP_SERVERS}
    }
  }

  # Stricter health check settings for CI
  health {
    thresholds {
      stale_data_minutes = 5  # Fail fast in CI
    }
  }

  jobs {
    cloudtrail_datagen {
      # Higher rate for faster CI tests
      events_per_second = 50
    }
  }
}
