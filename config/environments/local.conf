# Local Development Environment Configuration
#
# Overrides for local development with devenv.
# Include this after reference.conf:
#   include "reference.conf"
#   include "environments/local.conf"

include "../reference.conf"

cybersec {
  # Local development uses default ports and localhost
  # Most settings inherit from reference.conf

  # Override for local debugging if needed
  health {
    # More lenient thresholds for local dev
    thresholds {
      stale_data_minutes = 60  # Allow longer staleness locally
    }
  }

  # Local job settings
  jobs {
    cloudtrail_datagen {
      # Slower rate for local testing
      events_per_second = 5
    }
  }
}
