# Cybersec Toolkit Reference Configuration
#
# This is the complete configuration surface for the cybersec toolkit.
# All settings have defaults that work for local development.
#
# Environment variables can override any setting using ${?VAR} syntax.
# Environment-specific overrides go in config/environments/<env>.conf

cybersec {
  # ==========================================================================
  # Platform Detection
  # ==========================================================================
  platform {
    # Detected at runtime - these are informational
    system = "unknown"      # Linux, Darwin, Windows
    machine = "unknown"     # x86_64, arm64
    is_macos = false
    is_linux = false
  }

  # ==========================================================================
  # Paths and Directories
  # ==========================================================================
  paths {
    # Project root - usually detected from DEVENV_ROOT or PWD
    root = ${?DEVENV_ROOT}
    root = ${?PWD}

    # Flink installation
    flink_home = ${cybersec.paths.root}/thirdparty/flink/flink-dist/target/flink-1.20.1-bin/flink-1.20.1
    flink_home = ${?FLINK_HOME}

    # Python paths
    python_executable = ${cybersec.paths.root}/.devenv/state/venv/bin/python3
    devenv_python = ${cybersec.paths.root}/.devenv/profile/bin/python3

    # Data directories
    minio_data_dir = ${cybersec.paths.root}/.devenv/state/minio
    minio_data_dir = ${?MINIO_DATA_DIR}

    checkpoint_dir = "s3://cybersec/checkpoints"
    warehouse_dir = "s3://cybersec/iceberg/warehouse"

    # Log directories
    flink_log_dir = ${cybersec.paths.flink_home}/log
    submit_log = "/tmp/cloudtrail_submit.log"

    # Config files
    flink_conf = ${cybersec.paths.flink_home}/conf/flink-conf.yaml
  }

  # ==========================================================================
  # Python Environment
  # ==========================================================================
  python {
    version = "3.12"

    # Required packages
    required_packages = [
      "apache-flink",
      "pyiceberg",
      "httpx"
    ]

    # PyFlink settings that must be in flink-conf.yaml
    flink_python_executable = ${cybersec.paths.devenv_python}
    flink_python_client_executable = ${cybersec.paths.devenv_python}
  }

  # ==========================================================================
  # Services - PostgreSQL
  # ==========================================================================
  services {
    postgres {
      host = "localhost"
      host = ${?POSTGRES_HOST}
      port = 5438
      port = ${?POSTGRES_PORT}
      database = "cybersec"
      database = ${?POSTGRES_DATABASE}
      user = "postgres"
      user = ${?POSTGRES_USER}

      # Health check
      health_check {
        enabled = true
        timeout_seconds = 5
      }
    }

    # ==========================================================================
    # Services - MinIO (S3-compatible storage)
    # ==========================================================================
    minio {
      endpoint = "http://localhost:9010"
      endpoint = ${?S3_ENDPOINT}
      console_port = 9011

      access_key = "minioadmin"
      access_key = ${?AWS_ACCESS_KEY_ID}
      secret_key = "minioadmin"
      secret_key = ${?AWS_SECRET_ACCESS_KEY}

      region = "us-east-1"

      buckets = ["cybersec"]

      health_check {
        enabled = true
        path = "/minio/health/live"
        timeout_seconds = 5
      }
    }

    # ==========================================================================
    # Services - Apache Polaris (Iceberg Catalog)
    # ==========================================================================
    polaris {
      api_url = "http://localhost:8181"
      api_url = ${?POLARIS_API_URL}
      admin_url = "http://localhost:8182"
      admin_url = ${?POLARIS_ADMIN_URL}

      # Bootstrap credentials
      realm = "POLARIS"
      admin_client_id = "admin"
      admin_client_secret = "admin"

      # Catalog configuration
      catalog {
        name = "cybersec"
        type = "internal"
        default_namespace = "cloudtrail"

        properties {
          "s3.endpoint" = ${cybersec.services.minio.endpoint}
          "s3.access-key-id" = ${cybersec.services.minio.access_key}
          "s3.secret-access-key" = ${cybersec.services.minio.secret_key}
          "s3.path-style-access" = "true"
          "s3.region" = ${cybersec.services.minio.region}
        }
      }

      health_check {
        enabled = true
        path = "/q/health/ready"
        timeout_seconds = 5
      }
    }

    # ==========================================================================
    # Services - Apache Flink
    # ==========================================================================
    flink {
      jobmanager {
        host = "localhost"
        port = 8081
        port = ${?FLINK_JOBMANAGER_PORT}
        rpc_port = 6123

        memory {
          process_size = "1600m"
          jvm_heap_size = "1024m"
        }
      }

      taskmanager {
        slots = 4

        memory {
          process_size = "1728m"
          managed_size = "256m"
        }
      }

      # Checkpoint configuration
      checkpointing {
        interval_ms = 60000
        mode = "EXACTLY_ONCE"
        storage = ${cybersec.paths.checkpoint_dir}
      }

      # Python configuration (critical for PyFlink on macOS)
      python {
        executable = ${cybersec.python.flink_python_executable}
        client_executable = ${cybersec.python.flink_python_client_executable}
      }

      # JVM options for module access (required for checkpoint serialization)
      jvm_options = [
        "--add-opens=java.base/java.util=ALL-UNNAMED",
        "--add-opens=java.base/java.lang=ALL-UNNAMED",
        "--add-opens=java.base/java.io=ALL-UNNAMED",
        "--add-opens=java.base/java.lang.reflect=ALL-UNNAMED",
        "--add-opens=java.base/java.text=ALL-UNNAMED",
        "--add-opens=java.base/java.nio=ALL-UNNAMED",
        "--add-opens=java.base/java.net=ALL-UNNAMED",
        "--add-opens=java.base/java.util.concurrent=ALL-UNNAMED",
        "--add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED",
        "--add-opens=java.base/sun.nio.ch=ALL-UNNAMED",
        "--add-opens=java.base/sun.security.action=ALL-UNNAMED"
      ]

      health_check {
        enabled = true
        path = "/overview"
        timeout_seconds = 5
        min_taskmanagers = 1
      }
    }

    # ==========================================================================
    # Services - Iceberg Browser
    # ==========================================================================
    iceberg_browser {
      host = "localhost"
      port = 5050
      port = ${?ICEBERG_BROWSER_PORT}

      # Query limits
      max_scan_rows = 1000
      default_limit = 100

      health_check {
        enabled = true
        path = "/health"
        timeout_seconds = 5
      }
    }

    # ==========================================================================
    # Services - OpenTelemetry
    # ==========================================================================
    otel {
      collector {
        grpc_port = 4317
        http_port = 4318
        prometheus_port = 8889
      }

      # Trace export to NiFi
      nifi_otlp_port = 4319
    }

    # ==========================================================================
    # Services - Prometheus
    # ==========================================================================
    prometheus {
      port = 9090
      port = ${?PROMETHEUS_PORT}

      scrape_interval = "1s"
      retention = "15d"
    }

    # ==========================================================================
    # Services - Apache NiFi
    # ==========================================================================
    nifi {
      web_port = 8450
      web_port = ${?NIFI_WEB_PORT}

      otlp_receiver_port = 4319

      health_check {
        enabled = true
        path = "/nifi-api/system-diagnostics"
        timeout_seconds = 10
      }
    }

    # ==========================================================================
    # Services - ngrok (Tunnel for AWS deployments)
    # ==========================================================================
    # Required for AWS deployments to expose services externally.
    # All three credentials are required for ngrok functionality.
    ngrok {
      # ngrok authentication token (from ngrok.com dashboard)
      auth_token = ""
      auth_token = ${?NGROK_AUTH_TOKEN}
      auth_token = ${?NGROK_AUTHTOKEN}

      # ngrok API key (for operator functionality)
      api_key = ""
      api_key = ${?NGROK_API_KEY}

      # Operator Helm chart version
      operator_version = "0.21.1"

      # Custom domains (requires ngrok paid plan)
      domains {
        dask = "dask.zndx.org"
        dask = ${?NGROK_DASK_DOMAIN}
        jupyterhub = "jupyter.zndx.org"
        jupyterhub = ${?NGROK_JUPYTERHUB_DOMAIN}
        k8s_dashboard = "k8s.zndx.org"
        k8s_dashboard = ${?NGROK_K8S_DOMAIN}
      }
    }

    # ==========================================================================
    # Services - Cloudflare (DNS for custom domains)
    # ==========================================================================
    # Required when using custom domains with ngrok.
    cloudflare {
      api_token = ""
      api_token = ${?CLOUDFLARE_API_TOKEN}

      zone_id = ""
      zone_id = ${?CLOUDFLARE_ZONE_ID}
    }
  }

  # ==========================================================================
  # AWS Configuration
  # ==========================================================================
  # AWS credentials and configuration for cloud deployments.
  # Uses standard AWS credential chain (env vars, ~/.aws/credentials, IAM role).
  aws {
    # AWS region for deployments
    region = "us-east-1"
    region = ${?AWS_REGION}
    region = ${?AWS_DEFAULT_REGION}

    # Required IAM permissions for AWS deployments:
    # - S3: s3:CreateBucket, s3:PutObject, s3:GetObject, s3:ListBucket
    # - EC2: ec2:RunInstances, ec2:DescribeInstances, ec2:CreateSecurityGroup
    # - IAM: iam:CreateRole, iam:AttachRolePolicy, iam:PassRole
    # - ELB: elasticloadbalancing:CreateLoadBalancer, etc.
    #
    # These are validated at runtime via aws sts get-caller-identity
    # and specific permission probes.

    # S3 bucket for deployment artifacts
    artifacts_bucket = ""
    artifacts_bucket = ${?AWS_ARTIFACTS_BUCKET}
  }

  # ==========================================================================
  # Flink Jobs Configuration
  # ==========================================================================
  jobs {
    cloudtrail_datagen {
      class = "flink_jobs.cloudtrail_datagen"
      parallelism = 1

      # Data generation settings
      events_per_second = 10

      # Sink configuration - writes directly to Iceberg
      sink {
        type = "iceberg"
        table = ${cybersec.iceberg.tables.cloudtrail_events.namespace}"."${cybersec.iceberg.tables.cloudtrail_events.name}
      }
    }
  }

  # ==========================================================================
  # Iceberg Tables
  # ==========================================================================
  iceberg {
    catalog_name = ${cybersec.services.polaris.catalog.name}
    warehouse = ${cybersec.paths.warehouse_dir}

    tables {
      cloudtrail_events {
        namespace = "cloudtrail"
        name = "events"

        partition_spec = ["day(eventTime)"]

        write_options {
          target_file_size_bytes = 134217728  # 128MB
        }
      }
    }
  }

  # ==========================================================================
  # Health Check / FMEA Configuration
  # ==========================================================================
  health {
    # Thresholds for FMEA-based health checks
    thresholds {
      memory_warning_mb = 2048
      memory_critical_mb = 4096
      stale_data_minutes = 30
      snapshot_count_warning = 100
    }

    # Which checks to run
    enabled_categories = ["infra", "flink", "pyflink", "iceberg", "data"]

    # Quick check mode - only critical infrastructure
    quick_check_ids = ["INFRA_001", "INFRA_002", "FLINK_001", "ICE_002"]
  }

  # ==========================================================================
  # Kubernetes Configuration
  # ==========================================================================
  # K8s-dependent processes (Dask, JupyterHub) are disabled by default.
  # Set ENABLE_K8S=true to enable them. The target (k3d vs rke2) is auto-detected
  # from KUBECONFIG, or can be explicitly set via CYBERSEC_K8S_TARGET.
  #
  # Usage patterns:
  #   ENABLE_K8S=true devenv up                    # Auto-detect or use k3d
  #   KUBECONFIG=/path/to/rke2.yaml ENABLE_K8S=true devenv up  # Use RKE2
  #   CYBERSEC_K8S_TARGET=rke2 ENABLE_K8S=true devenv up       # Explicit target
  #
  # AWS deployments use aws:* tasks and are unaffected by this setting.
  kubernetes {
    # Master switch for K8s-dependent processes
    enabled = false
    enabled = ${?ENABLE_K8S}

    # Target cluster type: "none", "k3d", "rke2", or "auto"
    # "auto" detects from KUBECONFIG contents or defaults to k3d
    # Detected/set at runtime via CYBERSEC_K8S_TARGET
    target = "auto"
    target = ${?CYBERSEC_K8S_TARGET}

    # Optional: explicit kubeconfig path (overrides KUBECONFIG env var)
    # kubeconfig = "/path/to/kubeconfig"

    # Local k3d cluster configuration (only used when target=k3d)
    k3d {
      cluster_name = "cybersec"
      cluster_name = ${?K3D_CLUSTER_NAME}
      api_port = 6550
      # Auto-provision k3d cluster when target=k3d
      auto_provision = true
    }

    # RKE2 configuration (only used when target=rke2)
    rke2 {
      # RKE2 is managed externally; we just connect to it
      # kubeconfig typically at /etc/rancher/rke2/rke2.yaml or ~/.kube/config
    }

    # Dask distributed computing configuration
    dask {
      scheduler_port = 8786
      dashboard_port = 8787
      namespace = "dask"
      cluster_name = "cybersec-dask"
    }

    # JupyterHub configuration
    jupyterhub {
      namespace = "jupyterhub"
      port = 8000
    }

    # Kubernetes Dashboard configuration
    dashboard {
      namespace = "kubernetes-dashboard"
      port = 10443
    }
  }
}
