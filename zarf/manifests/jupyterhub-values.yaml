# Helm values for JupyterHub deployment in air-gap environment
# https://z2jh.jupyter.org/en/stable/
#
# Key features:
# - Uses custom cybersec-dask image with pre-installed dependencies
# - Configures Dask Gateway integration
# - Sets up persistent storage for user notebooks
#
# Zarf template variables:
#   ###ZARF_VAR_S3_ENDPOINT### - S3-compatible endpoint
#   ###ZARF_VAR_S3_ACCESS_KEY### - S3 access key
#   ###ZARF_VAR_S3_SECRET_KEY### - S3 secret key
#   ###ZARF_VAR_INGRESS_DOMAIN### - Base domain for ingress

# Hub configuration
hub:
  # Note: Image will be rewritten by Zarf
  image:
    name: quay.io/jupyterhub/k8s-hub
    tag: "4.0.0"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi
  # Configure Dask integration
  extraConfig:
    dask-config: |
      c.JupyterHub.allow_named_servers = True
      c.Spawner.default_url = '/lab'

# Proxy configuration
proxy:
  # Note: Image will be rewritten by Zarf
  chp:
    image:
      name: quay.io/jupyterhub/configurable-http-proxy
      tag: "4.5.5"
  service:
    type: NodePort
    nodePorts:
      http: 30080

# Single-user server configuration
singleuser:
  # Use custom cybersec-dask image with pre-installed dependencies
  # Note: Image will be rewritten by Zarf
  image:
    name: cybersec-dask
    tag: "2024.8.0"
  # Resource allocation per user
  cpu:
    limit: 2
    guarantee: 0.5
  memory:
    limit: 4G
    guarantee: 1G
  # Storage for notebooks
  storage:
    type: dynamic
    capacity: 10Gi
    # Use default StorageClass
    dynamic:
      storageClass: ""
  # Environment variables for S3 access
  extraEnv:
    S3_ENDPOINT: "###ZARF_VAR_S3_ENDPOINT###"
    AWS_ACCESS_KEY_ID: "###ZARF_VAR_S3_ACCESS_KEY###"
    AWS_SECRET_ACCESS_KEY: "###ZARF_VAR_S3_SECRET_KEY###"
    # Dask scheduler address in same cluster
    DASK_SCHEDULER_ADDRESS: "tcp://cybersec-dask-scheduler.dask.svc.cluster.local:8786"
  # Default packages already installed in image - no pip install needed
  # This is critical for air-gap: no runtime package installation

# Authentication - simple dummy auth for testing
# In production, configure LDAP, OAuth, etc.
hub:
  config:
    Authenticator:
      admin_users:
        - admin
    DummyAuthenticator:
      password: "changeme"
    JupyterHub:
      authenticator_class: dummy

# Scheduling - allow users on any node
scheduling:
  userScheduler:
    enabled: false
  userPlaceholder:
    enabled: false

# Culling - shut down idle servers
cull:
  enabled: true
  timeout: 3600  # 1 hour
  every: 600     # Check every 10 minutes

# Disable user pulling of images (air-gap)
prePuller:
  hook:
    enabled: false
  continuous:
    enabled: false
