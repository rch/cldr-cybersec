# Ingress resources for external access
# Uses RKE2's bundled ingress-nginx by default (class "nginx" — Traefik is K3s, not
# RKE2; the traefik default silently unbound every Ingress on real RKE2)
#
# Zarf template variables:
#   ###ZARF_VAR_INGRESS_CLASS### - Ingress controller class (traefik, nginx)
#   ###ZARF_VAR_INGRESS_DOMAIN### - Base domain for hostnames
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dask-dashboard
  namespace: dask
  labels:
    app.kubernetes.io/name: dask-dashboard
    app.kubernetes.io/managed-by: zarf
  annotations:
    # long-lived dashboard websockets survive nginx's 60s default proxy timeout
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: "###ZARF_VAR_INGRESS_CLASS###"
  rules:
    - host: dask.###ZARF_VAR_INGRESS_DOMAIN###
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cybersec-dask-scheduler
                port:
                  number: 8787
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jupyterhub
  namespace: jupyterhub
  labels:
    app.kubernetes.io/name: jupyterhub
    app.kubernetes.io/managed-by: zarf
  annotations:
    # WebSocket keep-alive for JupyterHub kernels
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/affinity: cookie
spec:
  ingressClassName: "###ZARF_VAR_INGRESS_CLASS###"
  rules:
    - host: jupyter.###ZARF_VAR_INGRESS_DOMAIN###
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: proxy-public
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: panel-viz
  namespace: panel-viz
  labels:
    app.kubernetes.io/name: panel-viz
    app.kubernetes.io/managed-by: zarf
  annotations:
    # WebSocket keep-alive for Panel/Bokeh AND the embedded terminal (/ws) — without
    # these, nginx drops idle websockets at its 60s default and the REPL disconnects
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/affinity: cookie
spec:
  ingressClassName: "###ZARF_VAR_INGRESS_CLASS###"
  rules:
    - host: panel.###ZARF_VAR_INGRESS_DOMAIN###
      http:
        paths:
          # Terminal WebSocket -> the pty-proxy sidecar. The app's browser JS falls
          # back to same-origin /ws when the page isn't on :5006 — without this rule
          # the embedded terminal (and the `switch` REPL command) never connects
          # through the ingress. Longest-prefix wins, so /ws is carved out of /.
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: otel-navigator
                port:
                  number: 8765
          - path: /
            pathType: Prefix
            backend:
              service:
                name: otel-navigator
                port:
                  number: 5006
