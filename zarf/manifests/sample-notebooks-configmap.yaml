    {"cells":[{"cell_type":"markdown","metadata":{},"source":"# OTEL Synthetic Data Generator\n\nGenerate synthetic OpenTelemetry span data for the air-gap Dask/Panel-Viz stack.\n\n**Methodology**: Same vectorized NumPy generation as the production 1TB+ dataset\n(K8s Indexed Job with 8 parallel pods). Adapted for single-node JupyterHub execution.\n\n**Output**: Hive-partitioned Parquet files in S3, compatible with OTEL Navigator (Panel-Viz).\n\n| Parameter | Default | Description |\n|-----------|---------|-------------|\n| `TOTAL_SPANS` | 500,000 | Total spans to generate (50K quick test, 5M+ stress) |\n| `CHUNK_SIZE` | 200,000 | Spans per chunk (controls peak memory) |\n| `DURATION_DAYS` | 2 | Time range for generated spans |\n| `PREFIX` | `otel-notebook` | S3 prefix (distinct from production `otel-minimal`) |\n\n**Note**: This notebook is read-only from ConfigMap. To edit:\n```bash\ncp ~/sample-notebooks/OTEL_Data_Generator.ipynb ~/\n```"},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":"# --- User Configuration ---\nTOTAL_SPANS = 500_000       # 500K default (50K for quick test, 5M+ for stress)\nCHUNK_SIZE = 200_000        # Spans per chunk (controls peak memory ~300 MB)\nDURATION_DAYS = 2           # Time range for generated spans\nCOMPRESSION = \"ZSTD\"\nCOMPRESSION_LEVEL = 3\nROW_GROUP_SIZE = 100_000\n\n# S3 target (reads from JupyterHub env vars, override as needed)\nimport os\nBUCKET = os.getenv('S3_BUCKET', 'cybersec-dask-data')\nPREFIX = \"otel-notebook\"    # Distinct prefix to avoid overwriting production data\nS3_ENDPOINT = os.getenv('S3_ENDPOINT', '')\nS3_REGION = os.getenv('AWS_REGION', os.getenv('S3_REGION', 'us-east-1'))\n\nprint(f\"Target: s3://{BUCKET}/{PREFIX}/spans/\")\nprint(f\"Spans:  {TOTAL_SPANS:,} in chunks of {CHUNK_SIZE:,}\")\nprint(f\"Days:   {DURATION_DAYS}\")\nprint(f\"S3:     {S3_ENDPOINT or 'AWS S3 (default)'}\")"},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":"import json\nimport random\nimport sys\nimport time\nfrom datetime import datetime, timedelta, timezone\n\nimport numpy as np\nimport pyarrow as pa\nimport pyarrow.parquet as pq\nimport pyarrow.compute as pc\nimport pyarrow.fs as pafs\n\n# Schema (30 columns — identical to production 1TB dataset)\n_span_kind_dict = pa.dictionary(pa.int8(), pa.string())\n_status_code_dict = pa.dictionary(pa.int8(), pa.string())\n\nSPANS_SCHEMA = pa.schema([\n    pa.field(\"trace_id\", pa.string(), nullable=False),\n    pa.field(\"span_id\", pa.string(), nullable=False),\n    pa.field(\"parent_span_id\", pa.string(), nullable=True),\n    pa.field(\"start_time_unix_nano\", pa.int64(), nullable=False),\n    pa.field(\"end_time_unix_nano\", pa.int64(), nullable=False),\n    pa.field(\"duration_ns\", pa.int64(), nullable=False),\n    pa.field(\"name\", pa.string(), nullable=False),\n    pa.field(\"kind\", _span_kind_dict, nullable=False),\n    pa.field(\"status_code\", _status_code_dict, nullable=False),\n    pa.field(\"status_message\", pa.string(), nullable=True),\n    pa.field(\"service_name\", pa.string(), nullable=False),\n    pa.field(\"service_namespace\", pa.string(), nullable=True),\n    pa.field(\"service_version\", pa.string(), nullable=True),\n    pa.field(\"host_name\", pa.string(), nullable=True),\n    pa.field(\"host_ip\", pa.string(), nullable=True),\n    pa.field(\"attributes_json\", pa.string(), nullable=True),\n    pa.field(\"resource_attributes_json\", pa.string(), nullable=True),\n    pa.field(\"http_method\", pa.string(), nullable=True),\n    pa.field(\"http_status_code\", pa.int16(), nullable=True),\n    pa.field(\"http_url\", pa.string(), nullable=True),\n    pa.field(\"http_route\", pa.string(), nullable=True),\n    pa.field(\"http_target\", pa.string(), nullable=True),\n    pa.field(\"db_system\", pa.string(), nullable=True),\n    pa.field(\"db_name\", pa.string(), nullable=True),\n    pa.field(\"db_operation\", pa.string(), nullable=True),\n    pa.field(\"db_statement\", pa.string(), nullable=True),\n    pa.field(\"rpc_system\", pa.string(), nullable=True),\n    pa.field(\"rpc_service\", pa.string(), nullable=True),\n    pa.field(\"rpc_method\", pa.string(), nullable=True),\n    pa.field(\"messaging_system\", pa.string(), nullable=True),\n    pa.field(\"messaging_destination\", pa.string(), nullable=True),\n    pa.field(\"messaging_operation\", pa.string(), nullable=True),\n    pa.field(\"exception_type\", pa.string(), nullable=True),\n    pa.field(\"exception_message\", pa.string(), nullable=True),\n    pa.field(\"events_count\", pa.int32(), nullable=True),\n    pa.field(\"links_count\", pa.int32(), nullable=True),\n])\n\n# 12 service templates (identical to production)\nSERVICE_TEMPLATES = [\n    {\"name\": \"api-gateway\",          \"kind\": \"SERVER\",   \"operations\": [\"HTTP request\", \"route\", \"rate-limit\"]},\n    {\"name\": \"auth-service\",         \"kind\": \"SERVER\",   \"operations\": [\"validate_token\", \"refresh_token\", \"login\", \"logout\"]},\n    {\"name\": \"user-service\",         \"kind\": \"SERVER\",   \"operations\": [\"get_user\", \"update_user\", \"list_users\", \"delete_user\"]},\n    {\"name\": \"order-service\",        \"kind\": \"SERVER\",   \"operations\": [\"create_order\", \"get_order\", \"process_order\", \"cancel_order\"]},\n    {\"name\": \"inventory-service\",    \"kind\": \"SERVER\",   \"operations\": [\"check_stock\", \"reserve_item\", \"release_item\"]},\n    {\"name\": \"payment-service\",      \"kind\": \"SERVER\",   \"operations\": [\"process_payment\", \"refund\", \"validate_card\"]},\n    {\"name\": \"notification-service\", \"kind\": \"PRODUCER\", \"operations\": [\"send_email\", \"send_sms\", \"send_push\"]},\n    {\"name\": \"shipping-service\",     \"kind\": \"SERVER\",   \"operations\": [\"calculate_shipping\", \"create_shipment\", \"track\"]},\n    {\"name\": \"analytics-service\",    \"kind\": \"CONSUMER\", \"operations\": [\"process_event\", \"aggregate\", \"report\"]},\n    {\"name\": \"database\",             \"kind\": \"CLIENT\",   \"operations\": [\"SELECT\", \"INSERT\", \"UPDATE\", \"DELETE\"]},\n    {\"name\": \"cache\",                \"kind\": \"CLIENT\",   \"operations\": [\"GET\", \"SET\", \"DEL\", \"MGET\", \"SCAN\"]},\n    {\"name\": \"message-queue\",        \"kind\": \"PRODUCER\", \"operations\": [\"publish\", \"consume\", \"ack\", \"nack\"]},\n]\n\n# Pre-compute flat arrays for vectorized lookups\nSVC_NAMES = [s[\"name\"] for s in SERVICE_TEMPLATES]\nSVC_KINDS = [s[\"kind\"] for s in SERVICE_TEMPLATES]\nSVC_OPS, SVC_OP_IDX = [], []\nfor si, s in enumerate(SERVICE_TEMPLATES):\n    for op in s[\"operations\"]:\n        SVC_OPS.append(op)\n        SVC_OP_IDX.append(si)\nSVC_OPS = np.array(SVC_OPS)\nSVC_OP_IDX = np.array(SVC_OP_IDX)\n\nHTTP_METHODS = np.array([\"GET\", \"POST\", \"PUT\", \"DELETE\", \"PATCH\"])\nHTTP_ROUTES = np.array([\n    \"/api/users\", \"/api/users/{id}\", \"/api/orders\", \"/api/orders/{id}\",\n    \"/api/products\", \"/api/products/{id}\", \"/api/auth/login\", \"/api/auth/logout\",\n    \"/api/health\", \"/api/metrics\", \"/api/cart\", \"/api/checkout\",\n])\nHTTP_STATUS_CODES = np.array([200, 200, 200, 200, 201, 204, 400, 401, 403, 404, 500, 502, 503], dtype=np.int16)\n\nservice_count = len(SERVICE_TEMPLATES)\nprint(f\"Schema: {len(SPANS_SCHEMA)} columns\")\nprint(f\"Services: {service_count} templates, {len(SVC_OPS)} total operations\")"},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":"def generate_batch_vectorized(n, rng, start_ns, time_range_ns):\n    \"\"\"Generate n spans using vectorized numpy operations.\n\n    Same methodology as the production 1TB K8s Indexed Job:\n    - Exponential duration distribution (median ~50ms)\n    - 5% error rate\n    - Rejection sampling for service-operation matching\n    - Full 30-column OTEL schema\n    \"\"\"\n    # Timing: uniform start offset, exponential duration\n    offsets_ns = rng.integers(0, time_range_ns, size=n, dtype=np.int64)\n    span_starts = start_ns + offsets_ns\n    durations = np.clip(\n        rng.exponential(50_000_000, size=n).astype(np.int64),  # median ~50ms\n        1_000_000, 30_000_000_000,  # 1ms to 30s\n    )\n    span_ends = span_starts + durations\n\n    # Service assignment\n    svc_indices = rng.integers(0, service_count, size=n)\n    is_error = rng.random(size=n) < 0.05\n\n    # Vectorized rejection sampling for service-operation matching\n    op_global_indices = rng.integers(0, len(SVC_OPS), size=n)\n    mismatched = SVC_OP_IDX[op_global_indices] != svc_indices\n    retries = 0\n    while mismatched.any() and retries < 20:\n        new_indices = rng.integers(0, len(SVC_OPS), size=mismatched.sum())\n        op_global_indices[mismatched] = new_indices\n        mismatched = SVC_OP_IDX[op_global_indices] != svc_indices\n        retries += 1\n    if mismatched.any():\n        for idx in np.where(mismatched)[0]:\n            si = svc_indices[idx]\n            candidates = np.where(SVC_OP_IDX == si)[0]\n            op_global_indices[idx] = rng.choice(candidates)\n\n    names = SVC_OPS[op_global_indices]\n    kinds_arr = np.array(SVC_KINDS)[svc_indices]\n    svc_names_arr = np.array(SVC_NAMES)[svc_indices]\n\n    # Boolean masks for conditional fields\n    is_server = kinds_arr == \"SERVER\"\n    is_client = kinds_arr == \"CLIENT\"\n    is_producer = kinds_arr == \"PRODUCER\"\n    is_consumer = kinds_arr == \"CONSUMER\"\n    is_msg = is_producer | is_consumer\n\n    # HTTP fields (SERVER spans only)\n    http_method_idx = rng.integers(0, len(HTTP_METHODS), size=n)\n    http_route_idx = rng.integers(0, len(HTTP_ROUTES), size=n)\n    http_status_idx = rng.integers(0, len(HTTP_STATUS_CODES), size=n)\n\n    # Host fields\n    host_nums = rng.integers(1, 11, size=n)\n    ip_b = rng.integers(1, 256, size=n)\n    ip_c = rng.integers(1, 256, size=n)\n\n    # Trace/span IDs via numpy random bytes\n    trace_raw = rng.bytes(n * 16)\n    trace_ids = [trace_raw[i*16:(i+1)*16].hex() for i in range(n)]\n    span_raw = rng.bytes(n * 8)\n    span_ids = [span_raw[i*8:(i+1)*8].hex() for i in range(n)]\n\n    events_count = rng.integers(0, 4, size=n, dtype=np.int32)\n    links_count = np.zeros(n, dtype=np.int32)\n\n    # Vectorized column construction\n    svc_names_list = svc_names_arr.tolist()\n    names_list = names.tolist()\n    status_codes = np.where(is_error, \"ERROR\", \"OK\").tolist()\n    status_msgs = np.where(is_error, \"Error occurred\", None).tolist()\n\n    host_names_list = np.char.add(\n        np.char.add(svc_names_arr.astype(str), \"-\"),\n        np.char.add(host_nums.astype(str), \".example.com\")\n    ).tolist()\n    host_ips = np.char.add(\n        \"10.0.\",\n        np.char.add(np.char.add(ip_b.astype(str), \".\"), ip_c.astype(str))\n    ).tolist()\n\n    http_method_vals = HTTP_METHODS[http_method_idx]\n    http_route_vals = HTTP_ROUTES[http_route_idx]\n    http_status_vals = HTTP_STATUS_CODES[http_status_idx]\n\n    http_methods = np.where(is_server, http_method_vals, None).tolist()\n    http_routes_list = np.where(is_server, http_route_vals, None).tolist()\n    http_statuses = np.where(is_server, http_status_vals, None).tolist()\n    http_urls = np.where(is_server, np.char.add(\"https://api.example.com\", http_route_vals), None).tolist()\n\n    attrs = np.char.add(np.char.add('{\"service.name\": \"', svc_names_arr.astype(str)), '\"}').tolist()\n    res_attrs = ['{}'] * n\n\n    db_systems = np.where(is_client, \"postgresql\", None).tolist()\n    db_names_list = np.where(is_client, \"production\", None).tolist()\n    db_ops = np.where(is_client, names, None).tolist()\n\n    msg_systems = np.where(is_msg, \"kafka\", None).tolist()\n    msg_dests = np.where(is_msg, \"events\", None).tolist()\n    msg_ops = np.where(is_producer, \"publish\", np.where(is_consumer, \"consume\", None)).tolist()\n\n    exc_types = np.where(is_error, \"RuntimeError\", None).tolist()\n    exc_msgs = np.where(is_error, \"Something went wrong\", None).tolist()\n\n    # Compute date partition column\n    timestamps_s = span_starts // 1_000_000_000\n    days_since_epoch = (timestamps_s // 86400).astype(np.int32)\n    hours_of_day = ((timestamps_s % 86400) // 3600).astype(np.int8)\n    unique_days = np.unique(days_since_epoch)\n    day_to_str = {}\n    for d in unique_days:\n        dt = datetime.fromtimestamp(int(d) * 86400, tz=timezone.utc)\n        day_to_str[int(d)] = dt.strftime(\"%Y-%m-%d\")\n    date_col = pa.array([day_to_str[int(d)] for d in days_since_epoch], type=pa.string())\n    hour_col = pa.array(hours_of_day, type=pa.int8())\n\n    table = pa.table({\n        \"trace_id\": pa.array(trace_ids, type=pa.string()),\n        \"span_id\": pa.array(span_ids, type=pa.string()),\n        \"parent_span_id\": pa.nulls(n, type=pa.string()),\n        \"start_time_unix_nano\": pa.array(span_starts),\n        \"end_time_unix_nano\": pa.array(span_ends),\n        \"duration_ns\": pa.array(durations),\n        \"name\": pa.array(names_list, type=pa.string()),\n        \"kind\": pa.array(kinds_arr.tolist()).dictionary_encode().cast(_span_kind_dict),\n        \"status_code\": pa.array(status_codes).dictionary_encode().cast(_status_code_dict),\n        \"status_message\": pa.array(status_msgs, type=pa.string()),\n        \"service_name\": pa.array(svc_names_list, type=pa.string()),\n        \"service_namespace\": pa.array([\"production\"] * n, type=pa.string()),\n        \"service_version\": pa.array([\"1.0.0\"] * n, type=pa.string()),\n        \"host_name\": pa.array(host_names_list, type=pa.string()),\n        \"host_ip\": pa.array(host_ips, type=pa.string()),\n        \"attributes_json\": pa.array(attrs, type=pa.string()),\n        \"resource_attributes_json\": pa.array(res_attrs, type=pa.string()),\n        \"http_method\": pa.array(http_methods, type=pa.string()),\n        \"http_status_code\": pa.array(http_statuses, type=pa.int16()),\n        \"http_url\": pa.array(http_urls, type=pa.string()),\n        \"http_route\": pa.array(http_routes_list, type=pa.string()),\n        \"http_target\": pa.nulls(n, type=pa.string()),\n        \"db_system\": pa.array(db_systems, type=pa.string()),\n        \"db_name\": pa.array(db_names_list, type=pa.string()),\n        \"db_operation\": pa.array(db_ops, type=pa.string()),\n        \"db_statement\": pa.nulls(n, type=pa.string()),\n        \"rpc_system\": pa.nulls(n, type=pa.string()),\n        \"rpc_service\": pa.nulls(n, type=pa.string()),\n        \"rpc_method\": pa.nulls(n, type=pa.string()),\n        \"messaging_system\": pa.array(msg_systems, type=pa.string()),\n        \"messaging_destination\": pa.array(msg_dests, type=pa.string()),\n        \"messaging_operation\": pa.array(msg_ops, type=pa.string()),\n        \"exception_type\": pa.array(exc_types, type=pa.string()),\n        \"exception_message\": pa.array(exc_msgs, type=pa.string()),\n        \"events_count\": pa.array(events_count),\n        \"links_count\": pa.array(links_count),\n        \"date\": date_col,\n        \"hour\": hour_col,\n    })\n\n    return table\n\nprint(\"generate_batch_vectorized() defined\")\nprint(\"  - Exponential duration (median ~50ms, clipped 1ms-30s)\")\nprint(\"  - 5% error rate\")\nprint(\"  - Rejection sampling for service-operation matching\")"},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":"# Connect to S3\ns3_kwargs = dict(\n    access_key=os.environ.get('AWS_ACCESS_KEY_ID', ''),\n    secret_key=os.environ.get('AWS_SECRET_ACCESS_KEY', ''),\n    region=S3_REGION,\n)\nsession_token = os.environ.get('AWS_SESSION_TOKEN', '')\nif session_token:\n    s3_kwargs['session_token'] = session_token\nif S3_ENDPOINT:\n    s3_kwargs['endpoint_override'] = S3_ENDPOINT\n    s3_kwargs['scheme'] = 'https' if 'https' in S3_ENDPOINT else 'http'\n\ns3 = pafs.S3FileSystem(**s3_kwargs)\nbase_path = f\"{BUCKET}/{PREFIX}/spans\"\nprint(f\"Connected to S3\")\nprint(f\"Base path: {base_path}\")\n\ndef write_partitioned(table, root_path, batch_id, chunk_idx=None, max_retries=5):\n    \"\"\"Write date-partitioned parquet — sorted, ZSTD compressed.\n\n    Layout: root_path/date=YYYY-MM-DD/batch_NNNN_chunk_CC.parquet\n\n    Sorting by start_time_unix_nano enables predicate pushdown via\n    row-group statistics (hour-level filtering without Hive partition).\n    \"\"\"\n    sort_indices = pc.sort_indices(table, sort_keys=[(\"start_time_unix_nano\", \"ascending\")])\n    table = table.take(sort_indices)\n\n    date_col = table.column(\"date\")\n    data_cols = [c for c in table.column_names if c not in (\"date\", \"hour\")]\n    unique_dates = pc.unique(date_col).to_pylist()\n\n    for date_val in unique_dates:\n        date_mask = pc.equal(date_col, date_val)\n        partition = table.filter(date_mask).select(data_cols)\n\n        sort_idx = pc.sort_indices(partition, sort_keys=[(\"start_time_unix_nano\", \"ascending\")])\n        partition = partition.take(sort_idx)\n\n        if chunk_idx is not None:\n            part_path = f\"{root_path}/date={date_val}/batch_{batch_id:04d}_chunk_{chunk_idx:02d}.parquet\"\n        else:\n            part_path = f\"{root_path}/date={date_val}/batch_{batch_id:04d}.parquet\"\n\n        for attempt in range(max_retries):\n            try:\n                pq.write_table(\n                    partition, part_path, filesystem=s3,\n                    row_group_size=ROW_GROUP_SIZE,\n                    compression=COMPRESSION,\n                    compression_level=COMPRESSION_LEVEL,\n                    write_statistics=True,\n                    write_page_index=True,\n                )\n                break\n            except OSError as e:\n                if \"SLOW_DOWN\" in str(e) and attempt < max_retries - 1:\n                    wait = (2 ** attempt) + random.uniform(0, 2)\n                    print(f\"  S3 SLOW_DOWN, retry {attempt+1}/{max_retries} after {wait:.1f}s\")\n                    time.sleep(wait)\n                else:\n                    raise\n        del partition\n\nprint(\"write_partitioned() defined\")"},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":"# Time range\nend_time = datetime.now(timezone.utc)\nstart_time = end_time - timedelta(days=DURATION_DAYS)\ntime_range_ns = DURATION_DAYS * 24 * 3600 * 1_000_000_000\nstart_ns = int(start_time.timestamp() * 1_000_000_000)\n\nnum_batches = (TOTAL_SPANS + CHUNK_SIZE - 1) // CHUNK_SIZE\n\nprint(\"=\" * 60)\nprint(\"OTEL Data Generator\")\nprint(\"=\" * 60)\nprint(f\"Total spans:  {TOTAL_SPANS:,}\")\nprint(f\"Chunks:       {num_batches} x {CHUNK_SIZE:,}\")\nprint(f\"Time range:   {start_time:%Y-%m-%d %H:%M} to {end_time:%Y-%m-%d %H:%M}\")\nprint(f\"Compression:  {COMPRESSION} (level {COMPRESSION_LEVEL})\")\nprint(f\"Destination:  s3://{base_path}/\")\nprint(\"=\" * 60)\nsys.stdout.flush()\n\noverall_start = time.time()\ntotal_bytes = 0\ntotal_spans_written = 0\nremaining = TOTAL_SPANS\n\nfor batch_id in range(num_batches):\n    chunk_size = min(CHUNK_SIZE, remaining)\n    remaining -= chunk_size\n\n    rng = np.random.default_rng(seed=batch_id * 10000)\n    t0 = time.time()\n\n    table = generate_batch_vectorized(chunk_size, rng, start_ns, time_range_ns)\n    gen_time = time.time() - t0\n\n    t1 = time.time()\n    write_partitioned(table, base_path, batch_id, chunk_idx=0)\n    write_time = time.time() - t1\n\n    batch_bytes = table.nbytes // 4  # rough ZSTD ratio\n    total_bytes += batch_bytes\n    total_spans_written += chunk_size\n    del table\n\n    pct = total_spans_written / TOTAL_SPANS * 100\n    rate = chunk_size / (gen_time + write_time)\n    print(f\"  [{batch_id+1}/{num_batches}] {chunk_size:,} spans | \"\n          f\"gen {gen_time:.1f}s + write {write_time:.1f}s | \"\n          f\"{rate:,.0f} spans/s | {pct:.0f}%\")\n    sys.stdout.flush()\n\n# Write _active_dataset.json marker\nmarker = {\n    \"dataset\": PREFIX,\n    \"updated_at\": datetime.now(timezone.utc).isoformat(),\n    \"phase\": \"notebook\",\n    \"total_spans\": total_spans_written,\n    \"total_bytes\": total_bytes,\n}\nmarker_key = f\"{BUCKET}/_active_dataset.json\"\nwith s3.open_output_stream(marker_key) as f:\n    f.write(json.dumps(marker).encode())\n\nelapsed = time.time() - overall_start\nprint(\"=\" * 60)\nprint(\"Generation Complete!\")\nprint(\"=\" * 60)\nprint(f\"Spans:    {total_spans_written:,}\")\nprint(f\"Size:     ~{total_bytes / (1024**2):.0f} MiB (compressed)\")\nprint(f\"Time:     {elapsed:.1f}s\")\nprint(f\"Rate:     {total_spans_written / elapsed:,.0f} spans/s\")\nprint(f\"Marker:   s3://{marker_key}\")\nprint(f\"Panel-Viz will auto-detect this dataset on next poll (60s)\")"},{"cell_type":"markdown","metadata":{},"source":"## Verify Generated Data\n\nConnect to the Dask cluster and verify the data reads correctly.\nThe heatmap below uses the same format as OTEL Navigator (Panel-Viz):\n`timestamp_s` vs `duration_ms` with datashader."},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["import s3fs\n","import dask.dataframe as dd\n","from dask.distributed import Client\n","os.environ.setdefault('BOKEH_RESOURCES', 'inline')\n","import holoviews as hv\n","from holoviews.operation.datashader import datashade, dynspread\n","hv.extension('bokeh', inline=True)  # inline: air-gap safe, no CDN fetch\n","\n","# Connect to Dask cluster\n","scheduler_addr = os.getenv('DASK_SCHEDULER_ADDRESS',\n","                           'tcp://cybersec-dask-scheduler.dask.svc.cluster.local:8786')\n","print(f\"Connecting to Dask: {scheduler_addr}\")\n","client = Client(scheduler_addr)\n","print(f\"Dashboard: {client.dashboard_link}\")\n","print(f\"Workers: {len(client.scheduler_info()['workers'])}\")\n","\n","# Read generated data\n","s3fs_kwargs = {'anon': False}\n","if S3_ENDPOINT:\n","    s3fs_kwargs['client_kwargs'] = {'endpoint_url': S3_ENDPOINT}\n","\n","data_path = f\"s3://{BUCKET}/{PREFIX}/spans/date=*/*.parquet\"\n","print(f\"\\nReading: {data_path}\")\n","\n","ddf = dd.read_parquet(\n","    data_path,\n","    columns=['start_time_unix_nano', 'duration_ns', 'service_name', 'status_code'],\n","    storage_options=s3fs_kwargs,\n",")\n","\n","total = len(ddf)\n","print(f\"Total spans: {total:,}\")\n","print(f\"Partitions:  {ddf.npartitions}\")\n","\n","# Quick stats\n","sample = ddf.head(5)\n","print(f\"\\nSample:\")\n","print(sample)\n","\n","# Build heatmap (same as otel-navigator)\n","print(\"\\nBuilding datashader heatmap (timestamp_s vs duration_ms)...\")\n","viz_df = ddf[['start_time_unix_nano', 'duration_ns']].compute()\n","viz_df['timestamp_s'] = viz_df['start_time_unix_nano'] / 1_000_000_000\n","viz_df['duration_ms'] = viz_df['duration_ns'] / 1_000_000\n","\n","points = hv.Points(viz_df, kdims=['timestamp_s', 'duration_ms'])\n","heatmap = datashade(points, cmap='fire').opts(\n","    width=900, height=400,\n","    title=f'OTEL Span Heatmap ({len(viz_df):,} spans) — same view as Panel-Viz',\n","    xlabel='Timestamp (unix seconds)',\n","    ylabel='Duration (ms)',\n","    tools=['wheel_zoom', 'box_zoom', 'reset'],\n",")\n","dynspread(heatmap, threshold=0.5, max_px=5)"]}],"metadata":{"kernelspec":{"display_name":"Python 3 (ipykernel)","language":"python","name":"python3"},"language_info":{"name":"python","version":"3.10.12"}},"nbformat":4,"nbformat_minor":5}
  Dask_S3_Validation.ipynb: |
    {"cells":[{"cell_type":"markdown","metadata":{},"source":"<cell_type>markdown</cell_type># Dask Out-of-Core S3 Validation (30 GB)\n\nThis notebook validates Dask out-of-core processing with a **30 GB dataset** stored in S3.\n\n**Key demonstration**: Processing 60 million spans (30 GB expanded) with a cluster that has\nonly 2-8 GB of memory, proving true out-of-core streaming capabilities.\n\n**Note**: This notebook is read-only from ConfigMap. To edit:\n```python\nimport shutil\nshutil.copy('/home/jovyan/sample-notebooks/Dask_S3_Validation.ipynb', '/home/jovyan/')\n```"},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Imports\n","import os\n","import uuid\n","from datetime import datetime, timezone\n","\n","import numpy as np\n","import pandas as pd\n","import pyarrow as pa\n","import pyarrow.parquet as pq\n","import s3fs\n","import dask.dataframe as dd\n","from dask.distributed import Client\n","\n","os.environ.setdefault('BOKEH_RESOURCES', 'inline')\n","import holoviews as hv\n","hv.extension('bokeh', inline=True)  # inline: air-gap safe, no CDN fetch\n","\n","# S3 access works in BOTH deploy modalities with no notebook edits:\n","# - AWS: the S3_* pod env is empty -> boto3's default credential chain\n","#   (EC2 instance role via IMDS). No static keys; nothing expires.\n","# - Air gap: no IMDS exists, so the deploy injects S3_ENDPOINT and\n","#   AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY into every pod (notebook,\n","#   scheduler, workers). Section 2 builds STORAGE_OPTIONS from that env --\n","#   s3fs/pyarrow do NOT read S3_ENDPOINT on their own.\n","# Never hardcode credentials here; never print them.\n","print(\"S3 auth: pod env (explicit endpoint if air-gapped, else AWS credential chain)\")"]},{"cell_type":"markdown","metadata":{},"source":["## 1. Connect to Dask Cluster"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Connect to remote scheduler or create local\n","scheduler_address = os.getenv('DASK_SCHEDULER_ADDRESS')\n","if scheduler_address:\n","    print(f\"Connecting to: {scheduler_address}\")\n","    client = Client(scheduler_address)\n","else:\n","    print(\"Creating local cluster\")\n","    client = Client(n_workers=2)\n","\n","print(f\"Dashboard: {client.dashboard_link}\")\n","client"]},{"cell_type":"markdown","metadata":{},"source":["## 2. Configure S3 Access"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# S3 configuration -- built from the pod env, works on AWS and air-gapped.\n","def s3_storage_options():\n","    \"\"\"S3 auth kwargs for s3fs AND dd.read_parquet/to_parquet(storage_options=...).\n","\n","    Empty AWS_* env -> None -> boto3 default chain (instance role via IMDS on AWS).\n","    S3_ENDPOINT set (air-gap gateway) -> explicit endpoint + path-style + sigv4.\n","    Dask serializes this dict into the task graph; each worker rebuilds its own\n","    filesystem from it, so notebook and workers agree by construction.\n","    \"\"\"\n","    opts = {\n","        'key':    os.environ.get('AWS_ACCESS_KEY_ID') or None,\n","        'secret': os.environ.get('AWS_SECRET_ACCESS_KEY') or None,\n","        'token':  os.environ.get('AWS_SESSION_TOKEN') or None,\n","    }\n","    endpoint = os.environ.get('S3_ENDPOINT')\n","    if endpoint:\n","        opts['client_kwargs'] = {\n","            'endpoint_url': endpoint,\n","            'region_name': os.environ.get('AWS_REGION') or 'us-east-1',\n","        }\n","        opts['config_kwargs'] = {\n","            's3': {'addressing_style': 'path'},   # MinIO/local gateways need path-style\n","            'signature_version': 's3v4',\n","        }\n","    return opts\n","\n","STORAGE_OPTIONS = s3_storage_options()\n","s3 = s3fs.S3FileSystem(**STORAGE_OPTIONS)\n","\n","# Diagnostic: presence only -- never print credential values\n","print(f\"endpoint: {os.environ.get('S3_ENDPOINT') or '(AWS default)'}\")\n","print(f\"explicit keys: {bool(STORAGE_OPTIONS.get('key'))}\")\n","\n","# Data bucket\n","S3_BUCKET = os.getenv('OTEL_DATA_PATH', 's3://cybersec-dask-data/otel/').replace('s3://', '').rstrip('/')\n","bucket_name = S3_BUCKET.split('/')[0]\n","data_prefix = '/'.join(S3_BUCKET.split('/')[1:]) or 'otel'\n","\n","print(f\"Bucket: {bucket_name}\")\n","print(f\"Prefix: {data_prefix}\")\n","\n","# Test access\n","contents = s3.ls(bucket_name)\n","print(f\"\\nBucket contents: {contents}\")"]},{"cell_type":"markdown","metadata":{},"source":"<cell_type>markdown</cell_type>## 3. Generate Large Synthetic Dataset (Idempotent)\n\nWe generate a **30 GB dataset** (expanded memory) to validate true out-of-core processing.\nEach span includes additional attributes (~500 bytes/row in memory).\n\n**Dataset Configuration:**\n- Target: 30 GB expanded memory footprint\n- Spans: ~60 million\n- Partitions: 600 (100K spans each)\n- Disk: ~6-8 GB (Parquet compressed with Snappy)\n\nThis dataset is typically **10-30× larger than cluster memory**, guaranteeing\nthat Dask must use streaming/out-of-core processing."},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":"# Fixed 30 GB dataset configuration - HARDCODED VALUES\nBYTES_PER_SPAN = 500\nTARGET_MEMORY_GB = 30\nTARGET_MEMORY_BYTES = 30_000_000_000  # 30 GB\n\n# HARDCODED: 60 million spans, 600 partitions\nTOTAL_SPANS = 60_000_000\nSPANS_PER_PARTITION = 100_000\nNUM_PARTITIONS = 600\nNUM_SERVICES = 20\n\n# Get cluster info for comparison\nscheduler_info = client.scheduler_info()\ntotal_worker_memory = sum(\n    w['memory_limit'] for w in scheduler_info['workers'].values()\n)\nnum_workers = len(scheduler_info['workers'])\nmemory_ratio = TARGET_MEMORY_BYTES / total_worker_memory if total_worker_memory > 0 else float('inf')\n\nprint(\"=\"*60)\nprint(\"DATASET CONFIGURATION (30 GB)\")\nprint(\"=\"*60)\nprint(f\"\\nDataset:\")\nprint(f\"  Target memory footprint: {TARGET_MEMORY_GB} GB\")\nprint(f\"  Total spans:             {TOTAL_SPANS:,}\")\nprint(f\"  Partitions:              {NUM_PARTITIONS}\")\nprint(f\"  Spans per partition:     {SPANS_PER_PARTITION:,}\")\nprint(f\"  Est. disk size:          {TOTAL_SPANS * 200 / 1e9:.1f} GB (compressed)\")\nprint(f\"\\nCluster:\")\nprint(f\"  Workers:                 {num_workers}\")\nprint(f\"  Total worker memory:     {total_worker_memory/1e9:.2f} GB\")\nprint(f\"  Dataset/Memory ratio:    {memory_ratio:.1f}×\")\nprint(f\"\\n  ⚡ Dataset is {memory_ratio:.1f}× larger than cluster memory!\")\n\nvalidation_path = f\"{bucket_name}/{data_prefix}/validation-30gb\"\n\n# Check if data already exists WITH CORRECT PARTITION COUNT (idempotent)\ntry:\n    existing_files = s3.glob(f\"{validation_path}/*.parquet\")\n    if existing_files and len(existing_files) >= NUM_PARTITIONS:\n        total_size = sum(s3.info(f)['size'] for f in existing_files)\n        print(f\"\\n✓ Data exists: {len(existing_files)} files ({total_size/1024/1024/1024:.2f} GB)\")\n        print(f\"  Path: s3://{validation_path}/\")\n        print(\"  Skipping generation (idempotent)\")\n        GENERATE_DATA = False\n    elif existing_files:\n        print(f\"\\n⚠ Partial data exists: {len(existing_files)} files (need {NUM_PARTITIONS})\")\n        print(f\"  Deleting incomplete dataset and regenerating...\")\n        s3.rm(validation_path, recursive=True)\n        GENERATE_DATA = True\n    else:\n        print(f\"\\n⚠ No existing data at: s3://{validation_path}/\")\n        print(\"  Will generate new dataset\")\n        GENERATE_DATA = True\nexcept Exception as e:\n    print(f\"\\n⚠ No existing data: {e}\")\n    GENERATE_DATA = True"},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":"def generate_spans(n_spans=100000, n_services=20):\n    \"\"\"Generate synthetic span data with rich attributes.\"\"\"\n    services = [f\"service-{i:02d}\" for i in range(n_services)]\n    operations = [\n        'GET /api/v1/users', 'POST /api/v1/orders', 'GET /health',\n        'PUT /api/v1/users/{id}', 'DELETE /api/v1/orders/{id}',\n        'db.query.select', 'db.query.insert', 'db.query.update',\n        'cache.get', 'cache.set', 'cache.delete',\n        'queue.publish', 'queue.consume',\n        'grpc.client.call', 'grpc.server.handle',\n    ]\n    http_methods = ['GET', 'POST', 'PUT', 'DELETE', 'PATCH']\n    status_codes_http = [200, 201, 204, 400, 401, 403, 404, 500, 502, 503]\n\n    now = datetime.now(timezone.utc)\n    base_ts = int(now.timestamp() * 1e9)\n\n    # Generate random data\n    n = n_spans\n    service_idx = np.random.randint(0, n_services, n)\n\n    return pd.DataFrame({\n        # Core span fields\n        'trace_id': [uuid.uuid4().hex for _ in range(n)],\n        'span_id': [uuid.uuid4().hex[:16] for _ in range(n)],\n        'parent_span_id': np.where(\n            np.random.random(n) > 0.3,\n            [uuid.uuid4().hex[:16] for _ in range(n)],\n            ''\n        ),\n        'service_name': np.array(services)[service_idx],\n        'operation_name': np.random.choice(operations, n),\n\n        # Timing\n        'start_time_unix_nano': base_ts - np.random.randint(0, 86400 * 1e9, n).astype(np.int64),\n        'duration_ns': np.random.exponential(scale=50_000_000, size=n).astype(np.int64),\n\n        # Status\n        'status_code': np.random.choice(['OK', 'ERROR', 'UNSET'], n, p=[0.92, 0.05, 0.03]),\n        'http_status_code': np.random.choice(status_codes_http, n, p=[0.5, 0.1, 0.05, 0.1, 0.05, 0.05, 0.05, 0.05, 0.025, 0.025]),\n        'http_method': np.random.choice(http_methods, n, p=[0.5, 0.25, 0.1, 0.1, 0.05]),\n\n        # Additional attributes for richer data\n        'user_id': [f\"user-{np.random.randint(1, 10000):05d}\" for _ in range(n)],\n        'request_id': [uuid.uuid4().hex for _ in range(n)],\n        'host': np.array([f\"{services[i]}-{np.random.randint(1,10)}.cluster.local\" for i in service_idx]),\n        'db_statement': np.where(\n            np.random.random(n) > 0.7,\n            [f\"SELECT * FROM table_{np.random.randint(1,100)} WHERE id = {np.random.randint(1,1000000)}\" for _ in range(n)],\n            ''\n        ),\n        'error_message': np.where(\n            np.random.random(n) > 0.95,\n            np.random.choice(['Connection timeout', 'Rate limit exceeded', 'Internal error', 'Not found', 'Permission denied'], n),\n            ''\n        ),\n    })\n\nif GENERATE_DATA:\n    import time as time_module\n    \n    print(f\"Generating {TOTAL_SPANS:,} spans across {NUM_PARTITIONS} partitions...\")\n    print(f\"  {SPANS_PER_PARTITION:,} spans per partition\")\n    print(f\"  {NUM_SERVICES} services\")\n    print(f\"  Estimated time: {NUM_PARTITIONS * 2 / 60:.0f}-{NUM_PARTITIONS * 4 / 60:.0f} minutes\")\n    print()\n    \n    start_time = time_module.time()\n    bytes_written = 0\n\n    for partition in range(NUM_PARTITIONS):\n        df = generate_spans(n_spans=SPANS_PER_PARTITION, n_services=NUM_SERVICES)\n\n        # Convert to PyArrow table\n        table = pa.Table.from_pandas(df, preserve_index=False)\n\n        # Write to S3\n        output_path = f\"s3://{validation_path}/partition_{partition:04d}.parquet\"\n        pq.write_table(table, output_path, filesystem=s3, compression='snappy')\n        \n        # Track progress\n        file_size = s3.info(f\"{validation_path}/partition_{partition:04d}.parquet\")['size']\n        bytes_written += file_size\n        \n        # Progress update every 50 partitions\n        if (partition + 1) % 50 == 0:\n            elapsed = time_module.time() - start_time\n            rate = (partition + 1) / elapsed\n            eta = (NUM_PARTITIONS - partition - 1) / rate\n            print(f\"  [{partition + 1:4d}/{NUM_PARTITIONS}] \"\n                  f\"{bytes_written/1e9:.2f} GB written, \"\n                  f\"{rate:.1f} partitions/sec, \"\n                  f\"ETA: {eta/60:.1f} min\")\n\n    elapsed = time_module.time() - start_time\n    \n    # Print final stats\n    files = s3.glob(f\"{validation_path}/*.parquet\")\n    total_size = sum(s3.info(f)['size'] for f in files)\n    \n    print(f\"\\n{'='*60}\")\n    print(\"DATA GENERATION COMPLETE\")\n    print(f\"{'='*60}\")\n    print(f\"  Files:       {len(files)}\")\n    print(f\"  Total size:  {total_size/1024/1024/1024:.2f} GB (compressed)\")\n    print(f\"  Spans:       {TOTAL_SPANS:,}\")\n    print(f\"  Time:        {elapsed/60:.1f} minutes\")\n    print(f\"  Throughput:  {TOTAL_SPANS/elapsed:,.0f} spans/sec\")\nelse:\n    print(\"Using existing data\")"},{"cell_type":"markdown","metadata":{},"source":["## 4. Load Data with Dask (Lazy)"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Load as Dask DataFrame (lazy - no data loaded yet)\n","ddf = dd.read_parquet(\n","    f\"s3://{validation_path}/*.parquet\",\n","    storage_options=STORAGE_OPTIONS,  # from Section 2: env-driven, AWS + air-gap\n",")\n","\n","print(f\"Partitions: {ddf.npartitions}\")\n","print(f\"Columns: {list(ddf.columns)}\")\n","print(f\"Expected rows: {TOTAL_SPANS:,}\")\n","print(f\"\\n⚡ This is LAZY - no data loaded yet!\")\n","print(\"   Data will only be fetched when .compute() is called\")\n","ddf"]},{"cell_type":"markdown","source":"## 4b. PyArrow Dataset API (Zero-Copy, Predicate Pushdown)\n\nPyArrow's Dataset API provides fine-grained control over Parquet reading with:\n- **Schema inspection** without reading data\n- **Predicate pushdown** - filters applied at the storage layer (only matching row groups read)\n- **Column projection** - only requested columns are deserialized\n- **Zero-copy reads** - memory-mapped access when possible\n\nThis is the foundation that Dask uses internally, but explicit access enables optimization.","metadata":{}},{"cell_type":"code","source":["import pyarrow.dataset as ds\n","import pyarrow.fs as pafs\n","\n","# PyArrow's S3FileSystem has the same gap as s3fs: it does not read S3_ENDPOINT.\n","# Mirror the Section 2 pattern (empty env -> AWS credential chain).\n","_pa_kwargs = {'region': os.environ.get('AWS_REGION') or 'us-east-1'}\n","if os.environ.get('S3_ENDPOINT'):\n","    _pa_kwargs.update(\n","        endpoint_override=os.environ['S3_ENDPOINT'],\n","        access_key=os.environ.get('AWS_ACCESS_KEY_ID') or None,\n","        secret_key=os.environ.get('AWS_SECRET_ACCESS_KEY') or None,\n","        session_token=os.environ.get('AWS_SESSION_TOKEN') or None,\n","    )\n","arrow_fs = pafs.S3FileSystem(**_pa_kwargs)\n","\n","# Load as Arrow Dataset - NO DATA READ YET (just metadata)\n","dataset = ds.dataset(\n","    f\"{validation_path}/\",\n","    format=\"parquet\",\n","    filesystem=arrow_fs,\n",")\n","\n","print(\"=\"*60)\n","print(\"ARROW DATASET METADATA (no data loaded)\")\n","print(\"=\"*60)\n","print(f\"\\nFiles: {len(dataset.files)}\")\n","\n","# Schema inspection - critical for understanding data without loading\n","print(f\"\\nSchema ({len(dataset.schema)} columns):\")\n","for field in dataset.schema:\n","    print(f\"  {field.name:30} {field.type}\")\n","\n","# Get row group and size info from fragments\n","total_row_groups = 0\n","for fragment in dataset.get_fragments():\n","    total_row_groups += fragment.metadata.num_row_groups\n","    \n","print(f\"\\nTotal row groups: {total_row_groups}\")\n","print(f\"Parquet files: {len(dataset.files)}\")"],"metadata":{},"execution_count":null,"outputs":[]},{"cell_type":"code","source":"%%time\n# PREDICATE PUSHDOWN - filter applied at Parquet row-group level\n# Only matching row groups are read from S3 (massive I/O savings)\n\n# Filter: only ERROR spans with high latency (> 100ms)\nerror_filter = (\n    (ds.field('status_code') == 'ERROR') & \n    (ds.field('duration_ns') > 100_000_000)  # > 100ms\n)\n\n# Column projection - only read columns we need (reduces I/O and memory)\nselected_columns = ['trace_id', 'service_name', 'operation_name', 'duration_ns', 'error_message']\n\n# Execute with pushdown - this reads ONLY matching data from S3\nerror_table = dataset.to_table(\n    filter=error_filter,\n    columns=selected_columns,\n)\n\nprint(\"=\"*60)\nprint(\"PREDICATE PUSHDOWN + COLUMN PROJECTION\")\nprint(\"=\"*60)\nprint(f\"\\nFilter: status_code='ERROR' AND duration_ns > 100ms\")\nprint(f\"Columns: {selected_columns}\")\nprint(f\"\\nResult: {len(error_table):,} rows (from {TOTAL_SPANS:,} total)\")\nprint(f\"Reduction: {(1 - len(error_table)/TOTAL_SPANS)*100:.1f}% of rows filtered at storage layer\")\nprint(f\"Memory: {error_table.nbytes/1024/1024:.1f} MB (vs {TARGET_MEMORY_GB} GB for full dataset)\")\n\n# Show sample\nerror_df = error_table.to_pandas()\nprint(f\"\\nSample high-latency errors:\")\nerror_df['duration_ms'] = error_df['duration_ns'] / 1e6\nerror_df[['service_name', 'operation_name', 'duration_ms', 'error_message']].head(10)","metadata":{},"execution_count":null,"outputs":[]},{"cell_type":"code","source":["%%time\n","# ARROW + DASK: Distributed processing with predicate pushdown\n","# Dask can use Arrow's predicate pushdown when reading Parquet\n","\n","# Read with filters pushed down to Arrow (distributed across workers)\n","# Each worker reads only matching row groups from S3\n","ddf_filtered = dd.read_parquet(\n","    f\"s3://{validation_path}/*.parquet\",\n","    storage_options=STORAGE_OPTIONS,\n","    filters=[\n","        ('status_code', '==', 'ERROR'),\n","    ],\n","    columns=['trace_id', 'service_name', 'operation_name', 'duration_ns', 'error_message', 'status_code'],\n","    engine='pyarrow',  # Explicit Arrow engine\n",")\n","\n","print(\"=\"*60)\n","print(\"DASK + ARROW PREDICATE PUSHDOWN (Distributed)\")\n","print(\"=\"*60)\n","print(f\"\\nPartitions: {ddf_filtered.npartitions}\")\n","print(f\"Filter: status_code='ERROR' (pushed to Arrow)\")\n","print(f\"This is LAZY - filter will be applied during compute()\")\n","\n","# Compute aggregation on filtered data (distributed)\n","error_by_service = ddf_filtered.groupby('service_name').agg({\n","    'trace_id': 'count',\n","    'duration_ns': ['mean', 'max'],\n","}).compute()\n","\n","error_by_service.columns = ['error_count', 'mean_duration_ns', 'max_duration_ns']\n","error_by_service['mean_duration_ms'] = error_by_service['mean_duration_ns'] / 1e6\n","error_by_service = error_by_service.sort_values('error_count', ascending=False)\n","\n","print(f\"\\n✓ Distributed aggregation on filtered data:\")\n","print(f\"  Total errors: {error_by_service['error_count'].sum():,}\")\n","error_by_service[['error_count', 'mean_duration_ms']]"],"metadata":{},"execution_count":null,"outputs":[]},{"cell_type":"code","source":"# SCANNER API: Fine-grained batch iteration for streaming processing\n# This is the most memory-efficient way to process large datasets\n\nprint(\"=\"*60)\nprint(\"ARROW SCANNER: Streaming Batch Processing\")\nprint(\"=\"*60)\n\n# Create scanner with batch size control\nscanner = dataset.scanner(\n    columns=['service_name', 'duration_ns', 'status_code'],\n    filter=(ds.field('http_status_code') >= 500),  # Server errors only\n    batch_size=100_000,  # 100K rows per batch\n)\n\n# Process in batches - never loads full dataset\nbatch_count = 0\ntotal_rows = 0\nduration_sum = 0\n\nfor batch in scanner.to_batches():\n    batch_count += 1\n    total_rows += len(batch)\n    # Aggregate within batch (zero-copy access to Arrow arrays)\n    duration_sum += batch.column('duration_ns').to_numpy().sum()\n\navg_duration_ms = (duration_sum / total_rows / 1e6) if total_rows > 0 else 0\n\nprint(f\"\\nProcessed {batch_count} batches ({total_rows:,} rows)\")\nprint(f\"Average latency for HTTP 5xx errors: {avg_duration_ms:.2f} ms\")\nprint(f\"\\n✓ Memory-efficient: only one batch in memory at a time\")\nprint(f\"  Each batch: ~{100_000 * 50 / 1024 / 1024:.1f} MB\")\nprint(f\"  Full dataset: {TARGET_MEMORY_GB} GB\")\nprint(f\"  Memory savings: {TARGET_MEMORY_GB * 1000 / (100_000 * 50 / 1024 / 1024):.0f}×\")","metadata":{},"execution_count":null,"outputs":[]},{"cell_type":"markdown","metadata":{},"source":["## 5. Compute Aggregations (Distributed)"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":"%%time\n# This triggers distributed computation across all workers\n# Watch the Dask dashboard to see tasks being distributed!\ntotal_spans = len(ddf)\nprint(f\"✓ Total spans: {total_spans:,}\")\nprint(f\"  Processing {total_spans:,} rows across {ddf.npartitions} partitions\")"},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":"%%time\n# Multi-dimensional aggregation - watch the Dask dashboard!\n# This demonstrates streaming aggregation: data flows through workers\n# without loading the entire dataset into memory\n\nservice_stats = ddf.groupby('service_name').agg({\n    'span_id': 'count',\n    'duration_ns': ['mean', 'max', 'min', 'std'],\n    'http_status_code': ['mean'],\n}).compute()\n\nservice_stats.columns = ['count', 'mean_duration_ns', 'max_duration_ns', 'min_duration_ns', 'std_duration_ns', 'avg_http_status']\nservice_stats['mean_duration_ms'] = service_stats['mean_duration_ns'] / 1e6\nservice_stats['max_duration_ms'] = service_stats['max_duration_ns'] / 1e6\nservice_stats = service_stats.sort_values('count', ascending=False)\n\nprint(f\"✓ Aggregated {total_spans:,} spans into {len(service_stats)} service groups\")\nservice_stats[['count', 'mean_duration_ms', 'max_duration_ms', 'std_duration_ns']]"},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":"%%time\n# Error rate by service - OPTIMIZED (no apply/lambda)\n# Count errors and total per service, then compute ratio\nimport dask\n\nerror_counts = ddf[ddf['status_code'] == 'ERROR'].groupby('service_name').size()\ntotal_counts = ddf.groupby('service_name').size()\n\n# Compute both in parallel\nerror_counts, total_counts = dask.compute(error_counts, total_counts)\n\n# Calculate error rate\nerror_rate = (error_counts / total_counts * 100).fillna(0).sort_values(ascending=False)\n\nprint(\"Error rate by service (%)\")\nerror_rate"},{"cell_type":"markdown","metadata":{},"source":["## 6. Visualizations with HoloViews"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Sample for visualization (compute a subset)\n","sample_df = ddf.sample(frac=0.1).compute()\n","print(f\"Sample size: {len(sample_df):,} spans\")"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Duration distribution by service\n","sample_df['duration_ms'] = sample_df['duration_ns'] / 1e6\n","\n","hv.BoxWhisker(sample_df, kdims='service_name', vdims='duration_ms').opts(\n","    width=800, height=400,\n","    title='Latency Distribution by Service',\n","    ylabel='Duration (ms)',\n","    box_fill_color=hv.dim('service_name').categorize(dict(zip(\n","        sample_df['service_name'].unique(),\n","        hv.Cycle('Category10').values\n","    )))\n",")"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Span count by service (bar chart)\n","counts = sample_df.groupby('service_name').size().reset_index(name='count')\n","\n","hv.Bars(counts, kdims='service_name', vdims='count').opts(\n","    width=600, height=400,\n","    title='Span Count by Service',\n","    color='service_name',\n","    cmap='Category10',\n","    xrotation=45,\n",")"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Status distribution\n","status_counts = sample_df.groupby(['service_name', 'status_code']).size().reset_index(name='count')\n","\n","hv.Bars(status_counts, kdims=['service_name', 'status_code'], vdims='count').opts(\n","    width=800, height=400,\n","    title='Status Code Distribution by Service',\n","    xrotation=45,\n","    color='status_code',\n","    cmap={'OK': 'green', 'ERROR': 'red', 'UNSET': 'gray'},\n",")"]},{"cell_type":"markdown","source":"## 6b. Hierarchical Drill-Down Visualization\n\nThis section demonstrates **zoom-triggered aggregation** - a key pattern for exploring\nlarge temporal + high-dimensional datasets like OTel traces.\n\n**How it works:**\n- **Zoomed out** (hours/days): Data aggregated at region/AZ level\n- **Medium zoom** (minutes): Service-level aggregates\n- **Zoomed in** (seconds): Individual spans visible\n\nThis enables exploring data from cluster-wide overview down to individual requests\nwithout loading the entire dataset into memory.","metadata":{}},{"cell_type":"code","source":"# Import drill-down visualization utilities\nfrom holoviews.operation.datashader import rasterize, datashade\nfrom holoviews.streams import RangeXY, RangeX\n\n# Prepare data with proper datetime column\ndrill_df = sample_df.copy()\ndrill_df['timestamp'] = pd.to_datetime(drill_df['start_time_unix_nano'], unit='ns')\ndrill_df['duration_ms'] = drill_df['duration_ns'] / 1e6\n\nprint(f\"Prepared {len(drill_df):,} spans for drill-down visualization\")\nprint(f\"Time range: {drill_df['timestamp'].min()} to {drill_df['timestamp'].max()}\")","metadata":{},"execution_count":null,"outputs":[]},{"cell_type":"code","source":["# Dynamic Service Latency Heatmap — RECOMPUTED ON THE DASK CLUSTER on zoom/pan\n","# Unlike a static HeatMap, every zoom/pan filters the FULL dataset (not the\n","# sample) to the visible time window and re-aggregates it distributed, at a\n","# bucket resolution chosen from the zoom depth. The linked histogram\n","# recomputes over the same window. Watch the Dask dashboard while zooming.\n","import time as _time\n","import dask.array as da\n","\n","# Lazy derived columns over the full dataset (no compute yet)\n","hddf = ddf.assign(\n","    timestamp=dd.to_datetime(ddf['start_time_unix_nano'], unit='ns'),\n","    duration_ms=ddf['duration_ns'] / 1e6,\n",")[['timestamp', 'service_name', 'duration_ms']]\n","# Pin in cluster RAM so each zoom re-agg skips the S3 re-read. Comment this\n","# out on a memory-tight cluster — everything still works, just slower.\n","hddf = hddf.persist()\n","\n","T_MIN = pd.Timestamp(hddf['timestamp'].min().compute())\n","T_MAX = pd.Timestamp(hddf['timestamp'].max().compute())\n","\n","def _as_ts(value, default):\n","    \"\"\"Bokeh reports datetime ranges as epoch-ms floats or datetime64.\"\"\"\n","    if value is None:\n","        return default\n","    if isinstance(value, (int, float)):\n","        return pd.Timestamp(value, unit='ms')\n","    return pd.Timestamp(value)\n","\n","def _bucket_for(span_seconds):\n","    \"\"\"Zoom-adaptive bucket size: keep <= ~150 columns in view.\"\"\"\n","    for freq, limit in [('1s', 150), ('5s', 750), ('15s', 2250),\n","                        ('1min', 9000), ('5min', 45000),\n","                        ('15min', 135000), ('1h', 540000)]:\n","        if span_seconds <= limit:\n","            return freq\n","    return '6h'\n","\n","def _window(x_range):\n","    t0 = _as_ts(x_range[0] if x_range else None, T_MIN)\n","    t1 = _as_ts(x_range[1] if x_range else None, T_MAX)\n","    if t1 <= t0:\n","        t0, t1 = T_MIN, T_MAX\n","    return t0, t1\n","\n","def latency_heatmap(x_range, y_range):\n","    t0, t1 = _window(x_range)\n","    freq = _bucket_for((t1 - t0).total_seconds())\n","\n","    started = _time.perf_counter()\n","    win = hddf[(hddf['timestamp'] >= t0) & (hddf['timestamp'] <= t1)]\n","    win = win.assign(bucket=win['timestamp'].dt.floor(freq))\n","    agg = (win.groupby(['service_name', 'bucket'])['duration_ms']\n","              .agg(['mean', 'count'])\n","              .reset_index()\n","              .compute())  # <-- distributed re-aggregation happens here\n","    elapsed = _time.perf_counter() - started\n","\n","    agg.columns = ['service', 'time', 'mean_latency', 'count']\n","    if agg.empty:\n","        return hv.HeatMap([], kdims=['time', 'service'],\n","                          vdims=['mean_latency', 'count']).opts(\n","            title='Service Latency (no data in view)', width=700, height=400)\n","    return hv.HeatMap(agg, kdims=['time', 'service'],\n","                      vdims=['mean_latency', 'count']).opts(\n","        title=(f'Service Latency — bucket {freq}, '\n","               f'{int(agg[\"count\"].sum()):,} spans, '\n","               f'recomputed on Dask in {elapsed:.2f}s'),\n","        colorbar=True,\n","        cmap='RdYlGn_r',  # Red=slow, Green=fast\n","        tools=['hover'],\n","        width=700, height=400,\n","        xrotation=45,\n","        framewise=True,   # rescale color/extents per recomputation\n","    )\n","\n","# One shared stream: sourced to the heatmap (created first), drives both views\n","range_stream = RangeXY()\n","heatmap = hv.DynamicMap(latency_heatmap, streams=[range_stream])\n","\n","def update_histogram(x_range, y_range):\n","    t0, t1 = _window(x_range)\n","    win = hddf[(hddf['timestamp'] >= t0) & (hddf['timestamp'] <= t1)]['duration_ms']\n","    hi = float(win.max().compute() or 0)\n","    if hi <= 0:\n","        return hv.Histogram([]).opts(title='Latency Distribution (no data)')\n","    frequencies, edges = da.histogram(\n","        win.to_dask_array(lengths=True), bins=50, range=(0.0, hi))\n","    frequencies = frequencies.compute()  # distributed histogram\n","    return hv.Histogram((edges, frequencies)).opts(\n","        title=f'Latency Distribution (n={int(frequencies.sum()):,})',\n","        xlabel='Latency (ms)', ylabel='Count',\n","        width=350, height=350,\n","        fill_color='#3182bd',\n","        framewise=True,\n","    )\n","\n","histogram = hv.DynamicMap(update_histogram, streams=[range_stream])\n","\n","# Display linked views side by side; zoom/pan the heatmap to drive both\n","(heatmap + histogram).opts(shared_axes=False)\n"],"metadata":{},"execution_count":null,"outputs":[]},{"cell_type":"code","source":"# Overview + Detail View with Hierarchy-Aware Aggregation\n# The detail view changes aggregation level based on zoom\n\ndef determine_agg_level(time_range_seconds):\n    \"\"\"Determine aggregation level from visible time range.\"\"\"\n    if time_range_seconds > 3600:    # > 1 hour\n        return 'service_group', '10min'   # Group services, 10-min buckets\n    elif time_range_seconds > 300:   # > 5 minutes\n        return 'service', '1min'          # Individual services, 1-min buckets\n    else:                            # < 5 minutes\n        return 'host', '10s'              # Host level, 10-sec buckets\n\ndef create_overview(df):\n    \"\"\"Create overview area chart showing total request volume.\"\"\"\n    hourly = df.groupby(df['timestamp'].dt.floor('10min')).agg({\n        'duration_ms': ['mean', 'count']\n    }).reset_index()\n    hourly.columns = ['time', 'mean_latency', 'count']\n    \n    area = hv.Area(hourly, kdims=['time'], vdims=['count'])\n    return area.opts(\n        height=120, width=900,\n        alpha=0.7, color='#1f77b4',\n        title='Overview: Request Volume (drag to zoom detail view)',\n        tools=['xbox_select'],\n    )\n\ndef create_detail(df, x_range):\n    \"\"\"Create detail view with hierarchy-aware aggregation.\"\"\"\n    if x_range is None or x_range[0] is None:\n        # Default view\n        time_range_sec = 3600\n        filtered = df\n    else:\n        start, end = pd.Timestamp(x_range[0]), pd.Timestamp(x_range[1])\n        time_range_sec = (end - start).total_seconds()\n        filtered = df[(df['timestamp'] >= start) & (df['timestamp'] <= end)]\n    \n    if filtered.empty:\n        return hv.Scatter([]).opts(title='Detail (No data in range)')\n    \n    # Determine aggregation level\n    group_col, time_bucket = determine_agg_level(time_range_sec)\n    \n    if group_col == 'service_group':\n        # Group services into clusters (e.g., service-0X -> group-0)\n        filtered = filtered.copy()\n        filtered['_group'] = filtered['service_name'].str.extract(r'service-(\\d)')[0].apply(\n            lambda x: f'group-{x}' if pd.notna(x) else 'other'\n        )\n        group_by = '_group'\n    elif group_col == 'host':\n        group_by = 'host'\n    else:\n        group_by = 'service_name'\n    \n    # Aggregate\n    filtered = filtered.copy()\n    filtered['_bucket'] = filtered['timestamp'].dt.floor(time_bucket)\n    \n    agg = filtered.groupby([group_by, '_bucket']).agg({\n        'duration_ms': 'mean',\n    }).reset_index()\n    agg.columns = ['group', 'time', 'latency']\n    \n    # Create scatter plot\n    scatter = hv.Scatter(agg, kdims=['time'], vdims=['latency', 'group'])\n    \n    return scatter.opts(\n        title=f'Detail: {group_col} level, {time_bucket} buckets (n={len(agg):,})',\n        color='group',\n        cmap='Category20',\n        width=900, height=350,\n        tools=['hover'],\n        size=8,\n        alpha=0.7,\n    )\n\n# Create the linked overview + detail\noverview = create_overview(drill_df)\nrange_x = RangeX(source=overview)\n\ndetail = hv.DynamicMap(\n    lambda x_range: create_detail(drill_df, x_range),\n    streams=[range_x]\n)\n\n# Stack vertically\n(overview + detail).cols(1).opts(shared_axes=False)","metadata":{},"execution_count":null,"outputs":[]},{"cell_type":"code","source":"# Datashader visualization for large datasets\n# This uses server-side rendering to handle millions of points efficiently\n\nfrom holoviews.operation.datashader import datashade, dynspread\n\n# Load a sample for datashader demo (10% = ~6M points from 60M)\nprint(\"Loading ~6M spans for datashader visualization...\")\nlarge_sample = ddf.sample(frac=0.1).compute()\nlarge_sample['timestamp'] = pd.to_datetime(large_sample['start_time_unix_nano'], unit='ns')\nlarge_sample['duration_ms'] = large_sample['duration_ns'] / 1e6\nlarge_sample['timestamp_numeric'] = large_sample['timestamp'].astype(np.int64) / 1e9  # seconds\nprint(f\"Loaded {len(large_sample):,} spans\")\n\n# Create points - each span is a point in (time, latency) space\npoints = hv.Points(\n    large_sample,\n    kdims=['timestamp_numeric', 'duration_ms'],\n    vdims=['service_name']\n)\n\n# Datashade - aggregates millions of points to screen resolution\n# Automatically re-aggregates on zoom/pan\nshaded = datashade(points, cmap='fire').opts(\n    title=f'Datashaded Latency: {len(large_sample):,} spans (zoom to explore)',\n    width=900,\n    height=400,\n    tools=['hover', 'wheel_zoom', 'box_zoom', 'reset'],\n    xlabel='Time (Unix seconds)',\n    ylabel='Latency (ms)',\n)\n\n# dynspread makes individual points visible when zoomed in\ndynspread(shaded, threshold=0.5, max_px=5)","metadata":{},"execution_count":null,"outputs":[]},{"cell_type":"markdown","metadata":{},"source":"<cell_type>markdown</cell_type>## 7. Out-of-Core Stress Test (30 GB)\n\nThis section demonstrates that Dask processes data **much larger than worker memory** using streaming aggregation.\nWith a 30 GB dataset and typical 2-8 GB cluster memory, this is a 4-15× memory challenge.\n\nEach worker processes partitions sequentially, computing partial results and releasing memory."},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":"import time\n\ndef show_worker_memory(label=\"\"):\n    \"\"\"Display worker memory utilization.\"\"\"\n    info = client.scheduler_info()\n    print(f\"\\n{'='*60}\")\n    print(f\"Worker Memory Utilization {label}\")\n    print(f\"{'='*60}\")\n    \n    total_used = 0\n    total_limit = 0\n    \n    for worker_id, worker in sorted(info['workers'].items()):\n        mem_used = worker.get('metrics', {}).get('memory', 0)\n        mem_limit = worker['memory_limit']\n        pct = (mem_used / mem_limit * 100) if mem_limit else 0\n        worker_short = worker_id.split('/')[-1][:25]\n        bar = '█' * int(pct/5) + '░' * (20 - int(pct/5))\n        print(f\"  {worker_short:25} [{bar}] {mem_used/1e9:.2f}GB / {mem_limit/1e9:.2f}GB ({pct:5.1f}%)\")\n        total_used += mem_used\n        total_limit += mem_limit\n    \n    print(f\"\\n  TOTAL: {total_used/1e9:.2f}GB / {total_limit/1e9:.2f}GB ({total_used/total_limit*100:.1f}%)\")\n    return total_used, total_limit\n\n# Show baseline memory and dataset ratio\nbaseline_used, baseline_limit = show_worker_memory(\"(baseline)\")\n\nprint(f\"\\n{'='*60}\")\nprint(\"OUT-OF-CORE CHALLENGE: 30 GB DATASET\")\nprint(f\"{'='*60}\")\nprint(f\"\\n  Dataset expanded size:   {TARGET_MEMORY_GB} GB\")\nprint(f\"  Total worker memory:     {baseline_limit/1e9:.2f} GB\")\nprint(f\"  Ratio (dataset/workers): {TARGET_MEMORY_BYTES/baseline_limit:.1f}×\")\nprint(f\"\\n  ⚡ Dataset is {TARGET_MEMORY_BYTES/baseline_limit:.1f}× larger than cluster memory!\")\nprint(f\"     Dask MUST use out-of-core streaming to process this.\")"},{"cell_type":"code","source":"%%time\n# Complex multi-key aggregation - stresses out-of-core processing\n# This groups by multiple columns, requiring more intermediate state\n\nprint(f\"Running complex aggregation across {TOTAL_SPANS:,} spans (30 GB)...\")\nprint(\"Watch the Dask dashboard - you'll see tasks streaming through workers\\n\")\n\n# First, add a column for HTTP errors (status >= 400)\n# This avoids using lambda in agg() which Dask can't serialize\nddf_with_errors = ddf.assign(is_http_error=(ddf['http_status_code'] >= 400).astype(int))\n\ncomplex_stats = ddf_with_errors.groupby(['service_name', 'operation_name', 'http_method']).agg({\n    'span_id': 'count',\n    'duration_ns': ['mean', 'max', 'std'],\n    'is_http_error': 'sum',  # Sum of boolean = count of errors\n}).compute()\n\ncomplex_stats.columns = ['count', 'mean_duration_ns', 'max_duration_ns', 'std_duration_ns', 'error_count']\ncomplex_stats['mean_duration_ms'] = complex_stats['mean_duration_ns'] / 1e6\ncomplex_stats['error_rate_pct'] = complex_stats['error_count'] / complex_stats['count'] * 100\ncomplex_stats = complex_stats.sort_values('count', ascending=False)\n\nprint(f\"✓ Created {len(complex_stats)} distinct groups from {total_spans:,} spans\")\nprint(f\"  Unique service/operation/method combinations: {len(complex_stats)}\")\ncomplex_stats.head(15)[['count', 'mean_duration_ms', 'error_rate_pct']]","metadata":{},"execution_count":null,"outputs":[]},{"cell_type":"code","source":"# Check memory AFTER complex aggregation\n# Key insight: memory should still be bounded even after processing 30 GB dataset\npost_used, post_limit = show_worker_memory(\"(after complex aggregation)\")\n\nprint(\"\\n\" + \"=\"*60)\nprint(\"OUT-OF-CORE VERIFICATION: 30 GB DATASET\")\nprint(\"=\"*60)\n\n# Calculate memory headroom\nmax_worker_pct = max(\n    w.get('metrics', {}).get('memory', 0) / w['memory_limit'] * 100\n    for w in client.scheduler_info()['workers'].values()\n)\n\nprint(f\"\"\"\nDataset size:          {TARGET_MEMORY_GB} GB ({TOTAL_SPANS:,} spans)\nCluster memory:        {post_limit/1e9:.1f} GB\nDataset/Memory ratio:  {TARGET_MEMORY_BYTES/post_limit:.1f}×\nPeak worker memory:    {max_worker_pct:.1f}%\nMemory stayed bounded: {'✓ YES' if max_worker_pct < 90 else '✗ NO'}\n\nHow out-of-core processing works:\n  1. Dask reads partitions lazily from S3 (one at a time per task)\n  2. Each partition ({SPANS_PER_PARTITION:,} spans, ~50 MB) is processed\n  3. Partial aggregation results accumulated, raw data released\n  4. Only final aggregated results stay in memory\n\nResult: Processed {TARGET_MEMORY_GB} GB dataset using {post_limit/1e9:.1f} GB cluster!\n        That's {TARGET_MEMORY_BYTES/post_limit:.0f}× more data than available RAM.\n\"\"\")","metadata":{},"execution_count":null,"outputs":[]},{"cell_type":"markdown","metadata":{},"source":["## 8. Cleanup"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Optionally delete test data\n","# Uncomment to clean up:\n","# s3.rm(validation_path, recursive=True)\n","# print(f\"Deleted: {validation_path}\")"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Close client\n","# client.close()"]},{"cell_type":"markdown","metadata":{},"source":"<cell_type>markdown</cell_type>---\n\n## Validation Summary\n\nThis notebook validated **Dask out-of-core processing** with a **30 GB dataset**:\n\n| Metric | Value |\n|--------|-------|\n| Dataset Size | **30 GB** (expanded memory) |\n| Total Spans | 60,000,000 |\n| Partitions | 600 |\n| Disk Size | ~6-8 GB (Parquet/Snappy) |\n| Services | 20 |\n\n### Key Validation: 30 GB Out-of-Core Processing\n\nThe 30 GB dataset is typically **10-30× larger** than cluster memory:\n- With 2 workers × 2 GB = 4 GB cluster → **7.5× ratio**\n- With 4 workers × 2 GB = 8 GB cluster → **3.75× ratio**\n- With 2 workers × 1 GB = 2 GB cluster → **15× ratio**\n\nThis **guarantees** Dask must use streaming/out-of-core processing - the data\nsimply cannot fit in memory.\n\n### Capabilities Demonstrated\n\n1. **Dask Cluster Connection** - Connected to distributed scheduler with multiple workers\n2. **S3 Access via IAM** - Read/write to S3 using AWS IAM role credentials\n3. **30 GB Dataset Generation** - 60M spans across 600 partitions\n4. **Idempotent Data Generation** - Skips regeneration if data already exists\n5. **Lazy Loading** - 60M rows loaded only when `.compute()` is called\n6. **Distributed Aggregations** - GroupBy operations computed in parallel across workers\n7. **Out-of-Core Processing** - Memory stays bounded processing 30 GB with ~2-8 GB cluster\n8. **HoloViews Visualizations** - Interactive plots render correctly in JupyterLab\n9. **Hierarchical Drill-Down** - Zoom-triggered aggregation (service group → service → host)\n10. **Datashader Integration** - Millions of points rendered efficiently with zoom/pan\n\n### PyArrow Dataset Capabilities\n\n| Feature | Description | Benefit |\n|---------|-------------|---------|\n| **Schema Inspection** | Read schema without loading data | Fast exploration of unknown datasets |\n| **Predicate Pushdown** | Filters applied at Parquet row-group level | Only matching data read from S3 |\n| **Column Projection** | Only requested columns deserialized | Reduced I/O and memory |\n| **Scanner API** | Batch-by-batch iteration | Constant memory for any dataset size |\n| **Dask Integration** | Filters passed to Arrow engine | Distributed + pushdown combined |\n\n### Data Loading Approaches Compared\n\n| Approach | Use Case | Memory Model |\n|----------|----------|--------------|\n| `dd.read_parquet()` | Distributed aggregations | Partitioned across workers |\n| `ds.dataset().to_table()` | Single-node filtered reads | Predicate pushdown, full result in memory |\n| `ds.dataset().scanner()` | Streaming processing | Constant memory (batch-at-a-time) |\n| `dd.read_parquet(filters=)` | Distributed + filtered | Best of both worlds |\n\n### Drill-Down Visualization Pattern\n\nThe notebook demonstrates **zoom-triggered hierarchy** for exploring large OTel datasets:\n\n| Zoom Level | Aggregation | Time Bucket | Use Case |\n|------------|-------------|-------------|----------|\n| Zoomed out (>1h) | Service groups | 10 min | Cluster-wide overview |\n| Medium (5m-1h) | Individual services | 1 min | Service comparison |\n| Zoomed in (<5m) | Hosts/pods | 10 sec | Incident investigation |\n\nThis pattern enables exploring from region/AZ-level down to individual spans without\nloading the entire dataset into memory.\n\n### Key Insight\n\n**No bottlenecks** in the data path:\n\n1. **S3 → Arrow**: Predicate pushdown means only relevant row groups are read\n2. **Arrow → Dask**: Zero-copy handoff, data stays in Arrow format\n3. **Dask Workers**: Stream partitions, compute partial aggregations, release memory\n4. **Final Result**: Only aggregated summaries returned to client\n\nThis architecture processes datasets **orders of magnitude larger than cluster memory**."}],"metadata":{"kernelspec":{"display_name":"Python 3","language":"python","name":"python3"},"language_info":{"name":"python","version":"3.10.0"}},"nbformat":4,"nbformat_minor":5}
