    {"cells":[{"cell_type":"markdown","metadata":{},"source":"# OTEL Synthetic Data Generator\n\nGenerate synthetic OpenTelemetry span data for the air-gap Dask/Panel-Viz stack.\n\n**Methodology**: Same vectorized NumPy generation as the production 1TB+ dataset\n(K8s Indexed Job with 8 parallel pods). Adapted for single-node JupyterHub execution.\n\n**Output**: Hive-partitioned Parquet files in S3, compatible with OTEL Navigator (Panel-Viz).\n\n| Parameter | Default | Description |\n|-----------|---------|-------------|\n| `TOTAL_SPANS` | 500,000 | Total spans to generate (50K quick test, 5M+ stress) |\n| `CHUNK_SIZE` | 200,000 | Spans per chunk (controls peak memory) |\n| `DURATION_DAYS` | 2 | Time range for generated spans |\n| `PREFIX` | `otel-notebook` | S3 prefix (distinct from production `otel-minimal`) |\n\n**Note**: This notebook is read-only from ConfigMap. To edit:\n```bash\ncp ~/sample-notebooks/OTEL_Data_Generator.ipynb ~/\n```"},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":"# --- User Configuration ---\nTOTAL_SPANS = 500_000       # 500K default (50K for quick test, 5M+ for stress)\nCHUNK_SIZE = 200_000        # Spans per chunk (controls peak memory ~300 MB)\nDURATION_DAYS = 2           # Time range for generated spans\nCOMPRESSION = \"ZSTD\"\nCOMPRESSION_LEVEL = 3\nROW_GROUP_SIZE = 100_000\n\n# S3 target (reads from JupyterHub env vars, override as needed)\nimport os\nBUCKET = os.getenv('S3_BUCKET', 'cyberphy')\nPREFIX = \"otel-notebook\"    # Distinct prefix to avoid overwriting production data\nS3_ENDPOINT = os.getenv('S3_ENDPOINT', '')\nS3_REGION = os.getenv('AWS_REGION', os.getenv('S3_REGION', 'us-east-1'))\n\nprint(f\"Target: s3://{BUCKET}/{PREFIX}/spans/\")\nprint(f\"Spans:  {TOTAL_SPANS:,} in chunks of {CHUNK_SIZE:,}\")\nprint(f\"Days:   {DURATION_DAYS}\")\nprint(f\"S3:     {S3_ENDPOINT or 'AWS S3 (default)'}\")"},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":"import json\nimport random\nimport sys\nimport time\nfrom datetime import datetime, timedelta, timezone\n\nimport numpy as np\nimport pyarrow as pa\nimport pyarrow.parquet as pq\nimport pyarrow.compute as pc\nimport pyarrow.fs as pafs\n\n# Schema (30 columns — identical to production 1TB dataset)\n_span_kind_dict = pa.dictionary(pa.int8(), pa.string())\n_status_code_dict = pa.dictionary(pa.int8(), pa.string())\n\nSPANS_SCHEMA = pa.schema([\n    pa.field(\"trace_id\", pa.string(), nullable=False),\n    pa.field(\"span_id\", pa.string(), nullable=False),\n    pa.field(\"parent_span_id\", pa.string(), nullable=True),\n    pa.field(\"start_time_unix_nano\", pa.int64(), nullable=False),\n    pa.field(\"end_time_unix_nano\", pa.int64(), nullable=False),\n    pa.field(\"duration_ns\", pa.int64(), nullable=False),\n    pa.field(\"name\", pa.string(), nullable=False),\n    pa.field(\"kind\", _span_kind_dict, nullable=False),\n    pa.field(\"status_code\", _status_code_dict, nullable=False),\n    pa.field(\"status_message\", pa.string(), nullable=True),\n    pa.field(\"service_name\", pa.string(), nullable=False),\n    pa.field(\"service_namespace\", pa.string(), nullable=True),\n    pa.field(\"service_version\", pa.string(), nullable=True),\n    pa.field(\"host_name\", pa.string(), nullable=True),\n    pa.field(\"host_ip\", pa.string(), nullable=True),\n    pa.field(\"attributes_json\", pa.string(), nullable=True),\n    pa.field(\"resource_attributes_json\", pa.string(), nullable=True),\n    pa.field(\"http_method\", pa.string(), nullable=True),\n    pa.field(\"http_status_code\", pa.int16(), nullable=True),\n    pa.field(\"http_url\", pa.string(), nullable=True),\n    pa.field(\"http_route\", pa.string(), nullable=True),\n    pa.field(\"http_target\", pa.string(), nullable=True),\n    pa.field(\"db_system\", pa.string(), nullable=True),\n    pa.field(\"db_name\", pa.string(), nullable=True),\n    pa.field(\"db_operation\", pa.string(), nullable=True),\n    pa.field(\"db_statement\", pa.string(), nullable=True),\n    pa.field(\"rpc_system\", pa.string(), nullable=True),\n    pa.field(\"rpc_service\", pa.string(), nullable=True),\n    pa.field(\"rpc_method\", pa.string(), nullable=True),\n    pa.field(\"messaging_system\", pa.string(), nullable=True),\n    pa.field(\"messaging_destination\", pa.string(), nullable=True),\n    pa.field(\"messaging_operation\", pa.string(), nullable=True),\n    pa.field(\"exception_type\", pa.string(), nullable=True),\n    pa.field(\"exception_message\", pa.string(), nullable=True),\n    pa.field(\"events_count\", pa.int32(), nullable=True),\n    pa.field(\"links_count\", pa.int32(), nullable=True),\n])\n\n# 12 service templates (identical to production)\nSERVICE_TEMPLATES = [\n    {\"name\": \"api-gateway\",          \"kind\": \"SERVER\",   \"operations\": [\"HTTP request\", \"route\", \"rate-limit\"]},\n    {\"name\": \"auth-service\",         \"kind\": \"SERVER\",   \"operations\": [\"validate_token\", \"refresh_token\", \"login\", \"logout\"]},\n    {\"name\": \"user-service\",         \"kind\": \"SERVER\",   \"operations\": [\"get_user\", \"update_user\", \"list_users\", \"delete_user\"]},\n    {\"name\": \"order-service\",        \"kind\": \"SERVER\",   \"operations\": [\"create_order\", \"get_order\", \"process_order\", \"cancel_order\"]},\n    {\"name\": \"inventory-service\",    \"kind\": \"SERVER\",   \"operations\": [\"check_stock\", \"reserve_item\", \"release_item\"]},\n    {\"name\": \"payment-service\",      \"kind\": \"SERVER\",   \"operations\": [\"process_payment\", \"refund\", \"validate_card\"]},\n    {\"name\": \"notification-service\", \"kind\": \"PRODUCER\", \"operations\": [\"send_email\", \"send_sms\", \"send_push\"]},\n    {\"name\": \"shipping-service\",     \"kind\": \"SERVER\",   \"operations\": [\"calculate_shipping\", \"create_shipment\", \"track\"]},\n    {\"name\": \"analytics-service\",    \"kind\": \"CONSUMER\", \"operations\": [\"process_event\", \"aggregate\", \"report\"]},\n    {\"name\": \"database\",             \"kind\": \"CLIENT\",   \"operations\": [\"SELECT\", \"INSERT\", \"UPDATE\", \"DELETE\"]},\n    {\"name\": \"cache\",                \"kind\": \"CLIENT\",   \"operations\": [\"GET\", \"SET\", \"DEL\", \"MGET\", \"SCAN\"]},\n    {\"name\": \"message-queue\",        \"kind\": \"PRODUCER\", \"operations\": [\"publish\", \"consume\", \"ack\", \"nack\"]},\n]\n\n# Pre-compute flat arrays for vectorized lookups\nSVC_NAMES = [s[\"name\"] for s in SERVICE_TEMPLATES]\nSVC_KINDS = [s[\"kind\"] for s in SERVICE_TEMPLATES]\nSVC_OPS, SVC_OP_IDX = [], []\nfor si, s in enumerate(SERVICE_TEMPLATES):\n    for op in s[\"operations\"]:\n        SVC_OPS.append(op)\n        SVC_OP_IDX.append(si)\nSVC_OPS = np.array(SVC_OPS)\nSVC_OP_IDX = np.array(SVC_OP_IDX)\n\nHTTP_METHODS = np.array([\"GET\", \"POST\", \"PUT\", \"DELETE\", \"PATCH\"])\nHTTP_ROUTES = np.array([\n    \"/api/users\", \"/api/users/{id}\", \"/api/orders\", \"/api/orders/{id}\",\n    \"/api/products\", \"/api/products/{id}\", \"/api/auth/login\", \"/api/auth/logout\",\n    \"/api/health\", \"/api/metrics\", \"/api/cart\", \"/api/checkout\",\n])\nHTTP_STATUS_CODES = np.array([200, 200, 200, 200, 201, 204, 400, 401, 403, 404, 500, 502, 503], dtype=np.int16)\n\nservice_count = len(SERVICE_TEMPLATES)\nprint(f\"Schema: {len(SPANS_SCHEMA)} columns\")\nprint(f\"Services: {service_count} templates, {len(SVC_OPS)} total operations\")"},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":"def generate_batch_vectorized(n, rng, start_ns, time_range_ns):\n    \"\"\"Generate n spans using vectorized numpy operations.\n\n    Same methodology as the production 1TB K8s Indexed Job:\n    - Exponential duration distribution (median ~50ms)\n    - 5% error rate\n    - Rejection sampling for service-operation matching\n    - Full 30-column OTEL schema\n    \"\"\"\n    # Timing: uniform start offset, exponential duration\n    offsets_ns = rng.integers(0, time_range_ns, size=n, dtype=np.int64)\n    span_starts = start_ns + offsets_ns\n    durations = np.clip(\n        rng.exponential(50_000_000, size=n).astype(np.int64),  # median ~50ms\n        1_000_000, 30_000_000_000,  # 1ms to 30s\n    )\n    span_ends = span_starts + durations\n\n    # Service assignment\n    svc_indices = rng.integers(0, service_count, size=n)\n    is_error = rng.random(size=n) < 0.05\n\n    # Vectorized rejection sampling for service-operation matching\n    op_global_indices = rng.integers(0, len(SVC_OPS), size=n)\n    mismatched = SVC_OP_IDX[op_global_indices] != svc_indices\n    retries = 0\n    while mismatched.any() and retries < 20:\n        new_indices = rng.integers(0, len(SVC_OPS), size=mismatched.sum())\n        op_global_indices[mismatched] = new_indices\n        mismatched = SVC_OP_IDX[op_global_indices] != svc_indices\n        retries += 1\n    if mismatched.any():\n        for idx in np.where(mismatched)[0]:\n            si = svc_indices[idx]\n            candidates = np.where(SVC_OP_IDX == si)[0]\n            op_global_indices[idx] = rng.choice(candidates)\n\n    names = SVC_OPS[op_global_indices]\n    kinds_arr = np.array(SVC_KINDS)[svc_indices]\n    svc_names_arr = np.array(SVC_NAMES)[svc_indices]\n\n    # Boolean masks for conditional fields\n    is_server = kinds_arr == \"SERVER\"\n    is_client = kinds_arr == \"CLIENT\"\n    is_producer = kinds_arr == \"PRODUCER\"\n    is_consumer = kinds_arr == \"CONSUMER\"\n    is_msg = is_producer | is_consumer\n\n    # HTTP fields (SERVER spans only)\n    http_method_idx = rng.integers(0, len(HTTP_METHODS), size=n)\n    http_route_idx = rng.integers(0, len(HTTP_ROUTES), size=n)\n    http_status_idx = rng.integers(0, len(HTTP_STATUS_CODES), size=n)\n\n    # Host fields\n    host_nums = rng.integers(1, 11, size=n)\n    ip_b = rng.integers(1, 256, size=n)\n    ip_c = rng.integers(1, 256, size=n)\n\n    # Trace/span IDs via numpy random bytes\n    trace_raw = rng.bytes(n * 16)\n    trace_ids = [trace_raw[i*16:(i+1)*16].hex() for i in range(n)]\n    span_raw = rng.bytes(n * 8)\n    span_ids = [span_raw[i*8:(i+1)*8].hex() for i in range(n)]\n\n    events_count = rng.integers(0, 4, size=n, dtype=np.int32)\n    links_count = np.zeros(n, dtype=np.int32)\n\n    # Vectorized column construction\n    svc_names_list = svc_names_arr.tolist()\n    names_list = names.tolist()\n    status_codes = np.where(is_error, \"ERROR\", \"OK\").tolist()\n    status_msgs = np.where(is_error, \"Error occurred\", None).tolist()\n\n    host_names_list = np.char.add(\n        np.char.add(svc_names_arr.astype(str), \"-\"),\n        np.char.add(host_nums.astype(str), \".example.com\")\n    ).tolist()\n    host_ips = np.char.add(\n        \"10.0.\",\n        np.char.add(np.char.add(ip_b.astype(str), \".\"), ip_c.astype(str))\n    ).tolist()\n\n    http_method_vals = HTTP_METHODS[http_method_idx]\n    http_route_vals = HTTP_ROUTES[http_route_idx]\n    http_status_vals = HTTP_STATUS_CODES[http_status_idx]\n\n    http_methods = np.where(is_server, http_method_vals, None).tolist()\n    http_routes_list = np.where(is_server, http_route_vals, None).tolist()\n    http_statuses = np.where(is_server, http_status_vals, None).tolist()\n    http_urls = np.where(is_server, np.char.add(\"https://api.example.com\", http_route_vals), None).tolist()\n\n    attrs = np.char.add(np.char.add('{\"service.name\": \"', svc_names_arr.astype(str)), '\"}').tolist()\n    res_attrs = ['{}'] * n\n\n    db_systems = np.where(is_client, \"postgresql\", None).tolist()\n    db_names_list = np.where(is_client, \"production\", None).tolist()\n    db_ops = np.where(is_client, names, None).tolist()\n\n    msg_systems = np.where(is_msg, \"kafka\", None).tolist()\n    msg_dests = np.where(is_msg, \"events\", None).tolist()\n    msg_ops = np.where(is_producer, \"publish\", np.where(is_consumer, \"consume\", None)).tolist()\n\n    exc_types = np.where(is_error, \"RuntimeError\", None).tolist()\n    exc_msgs = np.where(is_error, \"Something went wrong\", None).tolist()\n\n    # Compute date partition column\n    timestamps_s = span_starts // 1_000_000_000\n    days_since_epoch = (timestamps_s // 86400).astype(np.int32)\n    hours_of_day = ((timestamps_s % 86400) // 3600).astype(np.int8)\n    unique_days = np.unique(days_since_epoch)\n    day_to_str = {}\n    for d in unique_days:\n        dt = datetime.fromtimestamp(int(d) * 86400, tz=timezone.utc)\n        day_to_str[int(d)] = dt.strftime(\"%Y-%m-%d\")\n    date_col = pa.array([day_to_str[int(d)] for d in days_since_epoch], type=pa.string())\n    hour_col = pa.array(hours_of_day, type=pa.int8())\n\n    table = pa.table({\n        \"trace_id\": pa.array(trace_ids, type=pa.string()),\n        \"span_id\": pa.array(span_ids, type=pa.string()),\n        \"parent_span_id\": pa.nulls(n, type=pa.string()),\n        \"start_time_unix_nano\": pa.array(span_starts),\n        \"end_time_unix_nano\": pa.array(span_ends),\n        \"duration_ns\": pa.array(durations),\n        \"name\": pa.array(names_list, type=pa.string()),\n        \"kind\": pa.array(kinds_arr.tolist()).dictionary_encode().cast(_span_kind_dict),\n        \"status_code\": pa.array(status_codes).dictionary_encode().cast(_status_code_dict),\n        \"status_message\": pa.array(status_msgs, type=pa.string()),\n        \"service_name\": pa.array(svc_names_list, type=pa.string()),\n        \"service_namespace\": pa.array([\"production\"] * n, type=pa.string()),\n        \"service_version\": pa.array([\"1.0.0\"] * n, type=pa.string()),\n        \"host_name\": pa.array(host_names_list, type=pa.string()),\n        \"host_ip\": pa.array(host_ips, type=pa.string()),\n        \"attributes_json\": pa.array(attrs, type=pa.string()),\n        \"resource_attributes_json\": pa.array(res_attrs, type=pa.string()),\n        \"http_method\": pa.array(http_methods, type=pa.string()),\n        \"http_status_code\": pa.array(http_statuses, type=pa.int16()),\n        \"http_url\": pa.array(http_urls, type=pa.string()),\n        \"http_route\": pa.array(http_routes_list, type=pa.string()),\n        \"http_target\": pa.nulls(n, type=pa.string()),\n        \"db_system\": pa.array(db_systems, type=pa.string()),\n        \"db_name\": pa.array(db_names_list, type=pa.string()),\n        \"db_operation\": pa.array(db_ops, type=pa.string()),\n        \"db_statement\": pa.nulls(n, type=pa.string()),\n        \"rpc_system\": pa.nulls(n, type=pa.string()),\n        \"rpc_service\": pa.nulls(n, type=pa.string()),\n        \"rpc_method\": pa.nulls(n, type=pa.string()),\n        \"messaging_system\": pa.array(msg_systems, type=pa.string()),\n        \"messaging_destination\": pa.array(msg_dests, type=pa.string()),\n        \"messaging_operation\": pa.array(msg_ops, type=pa.string()),\n        \"exception_type\": pa.array(exc_types, type=pa.string()),\n        \"exception_message\": pa.array(exc_msgs, type=pa.string()),\n        \"events_count\": pa.array(events_count),\n        \"links_count\": pa.array(links_count),\n        \"date\": date_col,\n        \"hour\": hour_col,\n    })\n\n    return table\n\nprint(\"generate_batch_vectorized() defined\")\nprint(\"  - Exponential duration (median ~50ms, clipped 1ms-30s)\")\nprint(\"  - 5% error rate\")\nprint(\"  - Rejection sampling for service-operation matching\")"},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":"# Connect to S3\ns3_kwargs = dict(\n    access_key=os.environ.get('AWS_ACCESS_KEY_ID', ''),\n    secret_key=os.environ.get('AWS_SECRET_ACCESS_KEY', ''),\n    region=S3_REGION,\n)\nsession_token = os.environ.get('AWS_SESSION_TOKEN', '')\nif session_token:\n    s3_kwargs['session_token'] = session_token\nif S3_ENDPOINT:\n    s3_kwargs['endpoint_override'] = S3_ENDPOINT\n    s3_kwargs['scheme'] = 'https' if 'https' in S3_ENDPOINT else 'http'\n\ns3 = pafs.S3FileSystem(**s3_kwargs)\nbase_path = f\"{BUCKET}/{PREFIX}/spans\"\nprint(f\"Connected to S3\")\nprint(f\"Base path: {base_path}\")\n\ndef write_partitioned(table, root_path, batch_id, chunk_idx=None, max_retries=5):\n    \"\"\"Write date-partitioned parquet — sorted, ZSTD compressed.\n\n    Layout: root_path/date=YYYY-MM-DD/batch_NNNN_chunk_CC.parquet\n\n    Sorting by start_time_unix_nano enables predicate pushdown via\n    row-group statistics (hour-level filtering without Hive partition).\n    \"\"\"\n    sort_indices = pc.sort_indices(table, sort_keys=[(\"start_time_unix_nano\", \"ascending\")])\n    table = table.take(sort_indices)\n\n    date_col = table.column(\"date\")\n    data_cols = [c for c in table.column_names if c not in (\"date\", \"hour\")]\n    unique_dates = pc.unique(date_col).to_pylist()\n\n    for date_val in unique_dates:\n        date_mask = pc.equal(date_col, date_val)\n        partition = table.filter(date_mask).select(data_cols)\n\n        sort_idx = pc.sort_indices(partition, sort_keys=[(\"start_time_unix_nano\", \"ascending\")])\n        partition = partition.take(sort_idx)\n\n        if chunk_idx is not None:\n            part_path = f\"{root_path}/date={date_val}/batch_{batch_id:04d}_chunk_{chunk_idx:02d}.parquet\"\n        else:\n            part_path = f\"{root_path}/date={date_val}/batch_{batch_id:04d}.parquet\"\n\n        for attempt in range(max_retries):\n            try:\n                pq.write_table(\n                    partition, part_path, filesystem=s3,\n                    row_group_size=ROW_GROUP_SIZE,\n                    compression=COMPRESSION,\n                    compression_level=COMPRESSION_LEVEL,\n                    write_statistics=True,\n                    write_page_index=True,\n                )\n                break\n            except OSError as e:\n                if \"SLOW_DOWN\" in str(e) and attempt < max_retries - 1:\n                    wait = (2 ** attempt) + random.uniform(0, 2)\n                    print(f\"  S3 SLOW_DOWN, retry {attempt+1}/{max_retries} after {wait:.1f}s\")\n                    time.sleep(wait)\n                else:\n                    raise\n        del partition\n\nprint(\"write_partitioned() defined\")"},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":"# Time range\nend_time = datetime.now(timezone.utc)\nstart_time = end_time - timedelta(days=DURATION_DAYS)\ntime_range_ns = DURATION_DAYS * 24 * 3600 * 1_000_000_000\nstart_ns = int(start_time.timestamp() * 1_000_000_000)\n\nnum_batches = (TOTAL_SPANS + CHUNK_SIZE - 1) // CHUNK_SIZE\n\nprint(\"=\" * 60)\nprint(\"OTEL Data Generator\")\nprint(\"=\" * 60)\nprint(f\"Total spans:  {TOTAL_SPANS:,}\")\nprint(f\"Chunks:       {num_batches} x {CHUNK_SIZE:,}\")\nprint(f\"Time range:   {start_time:%Y-%m-%d %H:%M} to {end_time:%Y-%m-%d %H:%M}\")\nprint(f\"Compression:  {COMPRESSION} (level {COMPRESSION_LEVEL})\")\nprint(f\"Destination:  s3://{base_path}/\")\nprint(\"=\" * 60)\nsys.stdout.flush()\n\noverall_start = time.time()\ntotal_bytes = 0\ntotal_spans_written = 0\nremaining = TOTAL_SPANS\n\nfor batch_id in range(num_batches):\n    chunk_size = min(CHUNK_SIZE, remaining)\n    remaining -= chunk_size\n\n    rng = np.random.default_rng(seed=batch_id * 10000)\n    t0 = time.time()\n\n    table = generate_batch_vectorized(chunk_size, rng, start_ns, time_range_ns)\n    gen_time = time.time() - t0\n\n    t1 = time.time()\n    write_partitioned(table, base_path, batch_id, chunk_idx=0)\n    write_time = time.time() - t1\n\n    batch_bytes = table.nbytes // 4  # rough ZSTD ratio\n    total_bytes += batch_bytes\n    total_spans_written += chunk_size\n    del table\n\n    pct = total_spans_written / TOTAL_SPANS * 100\n    rate = chunk_size / (gen_time + write_time)\n    print(f\"  [{batch_id+1}/{num_batches}] {chunk_size:,} spans | \"\n          f\"gen {gen_time:.1f}s + write {write_time:.1f}s | \"\n          f\"{rate:,.0f} spans/s | {pct:.0f}%\")\n    sys.stdout.flush()\n\n# Write _active_dataset.json marker\nmarker = {\n    \"dataset\": PREFIX,\n    \"updated_at\": datetime.now(timezone.utc).isoformat(),\n    \"phase\": \"notebook\",\n    \"total_spans\": total_spans_written,\n    \"total_bytes\": total_bytes,\n}\nmarker_key = f\"{BUCKET}/_active_dataset.json\"\nwith s3.open_output_stream(marker_key) as f:\n    f.write(json.dumps(marker).encode())\n\nelapsed = time.time() - overall_start\nprint(\"=\" * 60)\nprint(\"Generation Complete!\")\nprint(\"=\" * 60)\nprint(f\"Spans:    {total_spans_written:,}\")\nprint(f\"Size:     ~{total_bytes / (1024**2):.0f} MiB (compressed)\")\nprint(f\"Time:     {elapsed:.1f}s\")\nprint(f\"Rate:     {total_spans_written / elapsed:,.0f} spans/s\")\nprint(f\"Marker:   s3://{marker_key}\")\nprint(f\"Panel-Viz will auto-detect this dataset on next poll (60s)\")"},{"cell_type":"markdown","metadata":{},"source":"## Verify Generated Data\n\nConnect to the Dask cluster and verify the data reads correctly.\nThe heatmap below uses the same format as OTEL Navigator (Panel-Viz):\n`timestamp_s` vs `duration_ms` with datashader."},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":"import s3fs\nimport dask.dataframe as dd\nfrom dask.distributed import Client\nimport holoviews as hv\nfrom holoviews.operation.datashader import datashade, dynspread\nhv.extension('bokeh')\n\n# Connect to Dask cluster\nscheduler_addr = os.getenv('DASK_SCHEDULER_ADDRESS',\n                           'tcp://cybersec-dask-scheduler.dask.svc.cluster.local:8786')\nprint(f\"Connecting to Dask: {scheduler_addr}\")\nclient = Client(scheduler_addr)\nprint(f\"Dashboard: {client.dashboard_link}\")\nprint(f\"Workers: {len(client.scheduler_info()['workers'])}\")\n\n# Read generated data\ns3fs_kwargs = {\n    'anon': False,\n    'key': os.environ.get('AWS_ACCESS_KEY_ID') or None,\n    'secret': os.environ.get('AWS_SECRET_ACCESS_KEY') or None,\n    'token': os.environ.get('AWS_SESSION_TOKEN') or None,\n}\nif S3_ENDPOINT:\n    s3fs_kwargs['client_kwargs'] = {'endpoint_url': S3_ENDPOINT}\n    s3fs_kwargs['config_kwargs'] = {\n        's3': {'addressing_style': 'path'},\n        'signature_version': 's3v4',\n    }\n\ndata_path = f\"s3://{BUCKET}/{PREFIX}/spans/date=*/*.parquet\"\nprint(f\"\\nReading: {data_path}\")\n\nddf = dd.read_parquet(\n    data_path,\n    columns=['start_time_unix_nano', 'duration_ns', 'service_name', 'status_code'],\n    storage_options=s3fs_kwargs,\n)\n\ntotal = len(ddf)\nprint(f\"Total spans: {total:,}\")\nprint(f\"Partitions:  {ddf.npartitions}\")\n\n# Quick stats\nsample = ddf.head(5)\nprint(f\"\\nSample:\")\nprint(sample)\n\n# Build heatmap (same as otel-navigator)\nprint(\"\\nBuilding datashader heatmap (timestamp_s vs duration_ms)...\")\nviz_df = ddf[['start_time_unix_nano', 'duration_ns']].compute()\nviz_df['timestamp_s'] = viz_df['start_time_unix_nano'] / 1_000_000_000\nviz_df['duration_ms'] = viz_df['duration_ns'] / 1_000_000\n\npoints = hv.Points(viz_df, kdims=['timestamp_s', 'duration_ms'])\nheatmap = datashade(points, cmap='fire').opts(\n    width=900, height=400,\n    title=f'OTEL Span Heatmap ({len(viz_df):,} spans) — same view as Panel-Viz',\n    xlabel='Timestamp (unix seconds)',\n    ylabel='Duration (ms)',\n    tools=['wheel_zoom', 'box_zoom', 'reset'],\n)\ndynspread(heatmap, threshold=0.5, max_px=5)"}],"metadata":{"kernelspec":{"display_name":"Python 3 (ipykernel)","language":"python","name":"python3"},"language_info":{"name":"python","version":"3.10.12"}},"nbformat":4,"nbformat_minor":5}
  Dask_S3_Validation.ipynb: |
    {"cells":[{"cell_type":"markdown","metadata":{},"source":"<cell_type>markdown</cell_type># Dask Out-of-Core S3 Validation (30 GB)\n\nThis notebook validates Dask out-of-core processing with a **30 GB dataset** stored in S3.\n\n**Key demonstration**: Processing 60 million spans (30 GB expanded) with a cluster that has\nonly 2-8 GB of memory, proving true out-of-core streaming capabilities.\n\n**Note**: This notebook is read-only from ConfigMap. To edit:\n```python\nimport shutil\nshutil.copy('/home/jovyan/sample-notebooks/Dask_S3_Validation.ipynb', '/home/jovyan/')\n```"},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":"# Imports\nimport os\nimport uuid\nfrom datetime import datetime, timezone\n\nimport numpy as np\nimport pandas as pd\nimport pyarrow as pa\nimport pyarrow.parquet as pq\nimport s3fs\nimport dask.dataframe as dd\nfrom dask.distributed import Client\n\nimport holoviews as hv\nhv.extension('bokeh')\n\n# AWS credentials are provided via:\n# - IAM role (when running in AWS with proper instance profile)\n# - Environment variables (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN)\n# - ~/.aws/credentials file\n# No hardcoded credentials - uses boto3's credential chain\nprint(\"Using AWS credential chain (IAM role / env vars / credentials file)\")"},{"cell_type":"markdown","metadata":{},"source":["## 1. Connect to Dask Cluster"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Connect to remote scheduler or create local\n","scheduler_address = os.getenv('DASK_SCHEDULER_ADDRESS')\n","if scheduler_address:\n","    print(f\"Connecting to: {scheduler_address}\")\n","    client = Client(scheduler_address)\n","else:\n","    print(\"Creating local cluster\")\n","    client = Client(n_workers=2)\n","\n","print(f\"Dashboard: {client.dashboard_link}\")\n","client"]},{"cell_type":"markdown","metadata":{},"source":["## 2. Configure S3 Access"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":"# S3 configuration — local lab uses RustFS (admin/admin, bucket cyberphy);\n# AWS deploys use IAM / env vars from JupyterHub singleuser.extraEnv.\nimport os\n\n_endpoint = os.getenv(\"S3_ENDPOINT\") or \"\"\n_key = os.getenv(\"AWS_ACCESS_KEY_ID\") or None\n_secret = os.getenv(\"AWS_SECRET_ACCESS_KEY\") or None\n_token = os.getenv(\"AWS_SESSION_TOKEN\") or None\n\ns3_opts = {\"anon\": False, \"key\": _key, \"secret\": _secret, \"token\": _token}\nif _endpoint:\n    s3_opts[\"client_kwargs\"] = {\"endpoint_url\": _endpoint}\n    s3_opts[\"config_kwargs\"] = {\n        \"s3\": {\"addressing_style\": \"path\"},\n        \"signature_version\": \"s3v4\",\n    }\n\ns3 = s3fs.S3FileSystem(**s3_opts)\n\n# Data bucket (default cyberphy for local RustFS lab)\nS3_BUCKET = (\n    os.getenv(\"S3_BUCKET\")\n    or os.getenv(\"OTEL_DATA_PATH\", \"s3://cyberphy/\").replace(\"s3://\", \"\").rstrip(\"/\")\n)\n# OTEL_DATA_PATH may be s3://bucket/ or s3://bucket/prefix/\nif S3_BUCKET.startswith(\"s3://\"):\n    S3_BUCKET = S3_BUCKET.replace(\"s3://\", \"\").rstrip(\"/\")\nbucket_name = S3_BUCKET.split(\"/\")[0]\ndata_prefix = \"/\".join(S3_BUCKET.split(\"/\")[1:]) or \"otel\"\n\nprint(f\"Endpoint: {_endpoint or 'AWS default'}\")\nprint(f\"Bucket:   {bucket_name}\")\nprint(f\"Prefix:   {data_prefix}\")\nprint(f\"Access:   {_key or '(IAM/default chain)'}\")\n\n# Test access\ncontents = s3.ls(bucket_name)\nprint(f\"\\nBucket contents: {contents}\")\n"},{"cell_type":"markdown","metadata":{},"source":"<cell_type>markdown</cell_type>## 3. Generate Large Synthetic Dataset (Idempotent)\n\nWe generate a **30 GB dataset** (expanded memory) to validate true out-of-core processing.\nEach span includes additional attributes (~500 bytes/row in memory).\n\n**Dataset Configuration:**\n- Target: 30 GB expanded memory footprint\n- Spans: ~60 million\n- Partitions: 600 (100K spans each)\n- Disk: ~6-8 GB (Parquet compressed with Snappy)\n\nThis dataset is typically **10-30× larger than cluster memory**, guaranteeing\nthat Dask must use streaming/out-of-core processing."},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":"# Fixed 30 GB dataset configuration - HARDCODED VALUES\nBYTES_PER_SPAN = 500\nTARGET_MEMORY_GB = 30\nTARGET_MEMORY_BYTES = 30_000_000_000  # 30 GB\n\n# HARDCODED: 60 million spans, 600 partitions\nTOTAL_SPANS = 60_000_000\nSPANS_PER_PARTITION = 100_000\nNUM_PARTITIONS = 600\nNUM_SERVICES = 20\n\n# Get cluster info for comparison\nscheduler_info = client.scheduler_info()\ntotal_worker_memory = sum(\n    w['memory_limit'] for w in scheduler_info['workers'].values()\n)\nnum_workers = len(scheduler_info['workers'])\nmemory_ratio = TARGET_MEMORY_BYTES / total_worker_memory if total_worker_memory > 0 else float('inf')\n\nprint(\"=\"*60)\nprint(\"DATASET CONFIGURATION (30 GB)\")\nprint(\"=\"*60)\nprint(f\"\\nDataset:\")\nprint(f\"  Target memory footprint: {TARGET_MEMORY_GB} GB\")\nprint(f\"  Total spans:             {TOTAL_SPANS:,}\")\nprint(f\"  Partitions:              {NUM_PARTITIONS}\")\nprint(f\"  Spans per partition:     {SPANS_PER_PARTITION:,}\")\nprint(f\"  Est. disk size:          {TOTAL_SPANS * 200 / 1e9:.1f} GB (compressed)\")\nprint(f\"\\nCluster:\")\nprint(f\"  Workers:                 {num_workers}\")\nprint(f\"  Total worker memory:     {total_worker_memory/1e9:.2f} GB\")\nprint(f\"  Dataset/Memory ratio:    {memory_ratio:.1f}×\")\nprint(f\"\\n  ⚡ Dataset is {memory_ratio:.1f}× larger than cluster memory!\")\n\nvalidation_path = f\"{bucket_name}/{data_prefix}/validation-30gb\"\n\n# Check if data already exists WITH CORRECT PARTITION COUNT (idempotent)\ntry:\n    existing_files = s3.glob(f\"{validation_path}/*.parquet\")\n    if existing_files and len(existing_files) >= NUM_PARTITIONS:\n        total_size = sum(s3.info(f)['size'] for f in existing_files)\n        print(f\"\\n✓ Data exists: {len(existing_files)} files ({total_size/1024/1024/1024:.2f} GB)\")\n        print(f\"  Path: s3://{validation_path}/\")\n        print(\"  Skipping generation (idempotent)\")\n        GENERATE_DATA = False\n    elif existing_files:\n        print(f\"\\n⚠ Partial data exists: {len(existing_files)} files (need {NUM_PARTITIONS})\")\n        print(f\"  Deleting incomplete dataset and regenerating...\")\n        s3.rm(validation_path, recursive=True)\n        GENERATE_DATA = True\n    else:\n        print(f\"\\n⚠ No existing data at: s3://{validation_path}/\")\n        print(\"  Will generate new dataset\")\n        GENERATE_DATA = True\nexcept Exception as e:\n    print(f\"\\n⚠ No existing data: {e}\")\n    GENERATE_DATA = True"},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":"def generate_spans(n_spans=100000, n_services=20):\n    \"\"\"Generate synthetic span data with rich attributes.\"\"\"\n    services = [f\"service-{i:02d}\" for i in range(n_services)]\n    operations = [\n        'GET /api/v1/users', 'POST /api/v1/orders', 'GET /health',\n        'PUT /api/v1/users/{id}', 'DELETE /api/v1/orders/{id}',\n        'db.query.select', 'db.query.insert', 'db.query.update',\n        'cache.get', 'cache.set', 'cache.delete',\n        'queue.publish', 'queue.consume',\n        'grpc.client.call', 'grpc.server.handle',\n    ]\n    http_methods = ['GET', 'POST', 'PUT', 'DELETE', 'PATCH']\n    status_codes_http = [200, 201, 204, 400, 401, 403, 404, 500, 502, 503]\n\n    now = datetime.now(timezone.utc)\n    base_ts = int(now.timestamp() * 1e9)\n\n    # Generate random data\n    n = n_spans\n    service_idx = np.random.randint(0, n_services, n)\n\n    return pd.DataFrame({\n        # Core span fields\n        'trace_id': [uuid.uuid4().hex for _ in range(n)],\n        'span_id': [uuid.uuid4().hex[:16] for _ in range(n)],\n        'parent_span_id': np.where(\n            np.random.random(n) > 0.3,\n            [uuid.uuid4().hex[:16] for _ in range(n)],\n            ''\n        ),\n        'service_name': np.array(services)[service_idx],\n        'operation_name': np.random.choice(operations, n),\n\n        # Timing\n        'start_time_unix_nano': base_ts - np.random.randint(0, 86400 * 1e9, n).astype(np.int64),\n        'duration_ns': np.random.exponential(scale=50_000_000, size=n).astype(np.int64),\n\n        # Status\n        'status_code': np.random.choice(['OK', 'ERROR', 'UNSET'], n, p=[0.92, 0.05, 0.03]),\n        'http_status_code': np.random.choice(status_codes_http, n, p=[0.5, 0.1, 0.05, 0.1, 0.05, 0.05, 0.05, 0.05, 0.025, 0.025]),\n        'http_method': np.random.choice(http_methods, n, p=[0.5, 0.25, 0.1, 0.1, 0.05]),\n\n        # Additional attributes for richer data\n        'user_id': [f\"user-{np.random.randint(1, 10000):05d}\" for _ in range(n)],\n        'request_id': [uuid.uuid4().hex for _ in range(n)],\n        'host': np.array([f\"{services[i]}-{np.random.randint(1,10)}.cluster.local\" for i in service_idx]),\n        'db_statement': np.where(\n            np.random.random(n) > 0.7,\n            [f\"SELECT * FROM table_{np.random.randint(1,100)} WHERE id = {np.random.randint(1,1000000)}\" for _ in range(n)],\n            ''\n        ),\n        'error_message': np.where(\n            np.random.random(n) > 0.95,\n            np.random.choice(['Connection timeout', 'Rate limit exceeded', 'Internal error', 'Not found', 'Permission denied'], n),\n            ''\n        ),\n    })\n\nif GENERATE_DATA:\n    import time as time_module\n    \n    print(f\"Generating {TOTAL_SPANS:,} spans across {NUM_PARTITIONS} partitions...\")\n    print(f\"  {SPANS_PER_PARTITION:,} spans per partition\")\n    print(f\"  {NUM_SERVICES} services\")\n    print(f\"  Estimated time: {NUM_PARTITIONS * 2 / 60:.0f}-{NUM_PARTITIONS * 4 / 60:.0f} minutes\")\n    print()\n    \n    start_time = time_module.time()\n    bytes_written = 0\n\n    for partition in range(NUM_PARTITIONS):\n        df = generate_spans(n_spans=SPANS_PER_PARTITION, n_services=NUM_SERVICES)\n\n        # Convert to PyArrow table\n        table = pa.Table.from_pandas(df, preserve_index=False)\n\n        # Write to S3\n        output_path = f\"s3://{validation_path}/partition_{partition:04d}.parquet\"\n        pq.write_table(table, output_path, filesystem=s3, compression='snappy')\n        \n        # Track progress\n        file_size = s3.info(f\"{validation_path}/partition_{partition:04d}.parquet\")['size']\n        bytes_written += file_size\n        \n        # Progress update every 50 partitions\n        if (partition + 1) % 50 == 0:\n            elapsed = time_module.time() - start_time\n            rate = (partition + 1) / elapsed\n            eta = (NUM_PARTITIONS - partition - 1) / rate\n            print(f\"  [{partition + 1:4d}/{NUM_PARTITIONS}] \"\n                  f\"{bytes_written/1e9:.2f} GB written, \"\n                  f\"{rate:.1f} partitions/sec, \"\n                  f\"ETA: {eta/60:.1f} min\")\n\n    elapsed = time_module.time() - start_time\n    \n    # Print final stats\n    files = s3.glob(f\"{validation_path}/*.parquet\")\n    total_size = sum(s3.info(f)['size'] for f in files)\n    \n    print(f\"\\n{'='*60}\")\n    print(\"DATA GENERATION COMPLETE\")\n    print(f\"{'='*60}\")\n    print(f\"  Files:       {len(files)}\")\n    print(f\"  Total size:  {total_size/1024/1024/1024:.2f} GB (compressed)\")\n    print(f\"  Spans:       {TOTAL_SPANS:,}\")\n    print(f\"  Time:        {elapsed/60:.1f} minutes\")\n    print(f\"  Throughput:  {TOTAL_SPANS/elapsed:,.0f} spans/sec\")\nelse:\n    print(\"Using existing data\")"},{"cell_type":"markdown","metadata":{},"source":["## 4. Load Data with Dask (Lazy)"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":"# Load as Dask DataFrame (lazy - no data loaded yet)\nddf = dd.read_parquet(\n    f\"s3://{validation_path}/*.parquet\",\n    storage_options=s3_opts,  # Use IAM role\n)\n\nprint(f\"Partitions: {ddf.npartitions}\")\nprint(f\"Columns: {list(ddf.columns)}\")\nprint(f\"Expected rows: {TOTAL_SPANS:,}\")\nprint(f\"\\n⚡ This is LAZY - no data loaded yet!\")\nprint(\"   Data will only be fetched when .compute() is called\")\nddf"},{"cell_type":"markdown","source":"## 4b. PyArrow Dataset API (Zero-Copy, Predicate Pushdown)\n\nPyArrow's Dataset API provides fine-grained control over Parquet reading with:\n- **Schema inspection** without reading data\n- **Predicate pushdown** - filters applied at the storage layer (only matching row groups read)\n- **Column projection** - only requested columns are deserialized\n- **Zero-copy reads** - memory-mapped access when possible\n\nThis is the foundation that Dask uses internally, but explicit access enables optimization.","metadata":{}},{"cell_type":"code","source":"import pyarrow.dataset as ds\nimport pyarrow.fs as pafs\n\n# Create PyArrow S3 filesystem (uses same credential chain as s3fs)\narrow_kwargs = dict(region=os.getenv('AWS_REGION', os.getenv('S3_REGION', 'us-east-1')))\nif _key and _secret:\n    arrow_kwargs['access_key'] = _key\n    arrow_kwargs['secret_key'] = _secret\nif _token:\n    arrow_kwargs['session_token'] = _token\nif _endpoint:\n    arrow_kwargs['endpoint_override'] = _endpoint\n    arrow_kwargs['scheme'] = 'https' if _endpoint.startswith('https') else 'http'\narrow_fs = pafs.S3FileSystem(**arrow_kwargs)\n\n# Load as Arrow Dataset - NO DATA READ YET (just metadata)\ndataset = ds.dataset(\n    f\"{validation_path}/\",\n    format=\"parquet\",\n    filesystem=arrow_fs,\n)\n\nprint(\"=\"*60)\nprint(\"ARROW DATASET METADATA (no data loaded)\")\nprint(\"=\"*60)\nprint(f\"\\nFiles: {len(dataset.files)}\")\n\n# Schema inspection - critical for understanding data without loading\nprint(f\"\\nSchema ({len(dataset.schema)} columns):\")\nfor field in dataset.schema:\n    print(f\"  {field.name:30} {field.type}\")\n\n# Get row group and size info from fragments\ntotal_row_groups = 0\nfor fragment in dataset.get_fragments():\n    total_row_groups += fragment.metadata.num_row_groups\n    \nprint(f\"\\nTotal row groups: {total_row_groups}\")\nprint(f\"Parquet files: {len(dataset.files)}\")","metadata":{},"execution_count":null,"outputs":[]},{"cell_type":"code","source":"%%time\n# PREDICATE PUSHDOWN - filter applied at Parquet row-group level\n# Only matching row groups are read from S3 (massive I/O savings)\n\n# Filter: only ERROR spans with high latency (> 100ms)\nerror_filter = (\n    (ds.field('status_code') == 'ERROR') & \n    (ds.field('duration_ns') > 100_000_000)  # > 100ms\n)\n\n# Column projection - only read columns we need (reduces I/O and memory)\nselected_columns = ['trace_id', 'service_name', 'operation_name', 'duration_ns', 'error_message']\n\n# Execute with pushdown - this reads ONLY matching data from S3\nerror_table = dataset.to_table(\n    filter=error_filter,\n    columns=selected_columns,\n)\n\nprint(\"=\"*60)\nprint(\"PREDICATE PUSHDOWN + COLUMN PROJECTION\")\nprint(\"=\"*60)\nprint(f\"\\nFilter: status_code='ERROR' AND duration_ns > 100ms\")\nprint(f\"Columns: {selected_columns}\")\nprint(f\"\\nResult: {len(error_table):,} rows (from {TOTAL_SPANS:,} total)\")\nprint(f\"Reduction: {(1 - len(error_table)/TOTAL_SPANS)*100:.1f}% of rows filtered at storage layer\")\nprint(f\"Memory: {error_table.nbytes/1024/1024:.1f} MB (vs {TARGET_MEMORY_GB} GB for full dataset)\")\n\n# Show sample\nerror_df = error_table.to_pandas()\nprint(f\"\\nSample high-latency errors:\")\nerror_df['duration_ms'] = error_df['duration_ns'] / 1e6\nerror_df[['service_name', 'operation_name', 'duration_ms', 'error_message']].head(10)","metadata":{},"execution_count":null,"outputs":[]},{"cell_type":"code","source":"%%time\n# ARROW + DASK: Distributed processing with predicate pushdown\n# Dask can use Arrow's predicate pushdown when reading Parquet\n\n# Read with filters pushed down to Arrow (distributed across workers)\n# Each worker reads only matching row groups from S3\nddf_filtered = dd.read_parquet(\n    f\"s3://{validation_path}/*.parquet\",\n    storage_options=s3_opts,\n    filters=[\n        ('status_code', '==', 'ERROR'),\n    ],\n    columns=['trace_id', 'service_name', 'operation_name', 'duration_ns', 'error_message', 'status_code'],\n    engine='pyarrow',  # Explicit Arrow engine\n)\n\nprint(\"=\"*60)\nprint(\"DASK + ARROW PREDICATE PUSHDOWN (Distributed)\")\nprint(\"=\"*60)\nprint(f\"\\nPartitions: {ddf_filtered.npartitions}\")\nprint(f\"Filter: status_code='ERROR' (pushed to Arrow)\")\nprint(f\"This is LAZY - filter will be applied during compute()\")\n\n# Compute aggregation on filtered data (distributed)\nerror_by_service = ddf_filtered.groupby('service_name').agg({\n    'trace_id': 'count',\n    'duration_ns': ['mean', 'max'],\n}).compute()\n\nerror_by_service.columns = ['error_count', 'mean_duration_ns', 'max_duration_ns']\nerror_by_service['mean_duration_ms'] = error_by_service['mean_duration_ns'] / 1e6\nerror_by_service = error_by_service.sort_values('error_count', ascending=False)\n\nprint(f\"\\n✓ Distributed aggregation on filtered data:\")\nprint(f\"  Total errors: {error_by_service['error_count'].sum():,}\")\nerror_by_service[['error_count', 'mean_duration_ms']]","metadata":{},"execution_count":null,"outputs":[]},{"cell_type":"code","source":"# SCANNER API: Fine-grained batch iteration for streaming processing\n# This is the most memory-efficient way to process large datasets\n\nprint(\"=\"*60)\nprint(\"ARROW SCANNER: Streaming Batch Processing\")\nprint(\"=\"*60)\n\n# Create scanner with batch size control\nscanner = dataset.scanner(\n    columns=['service_name', 'duration_ns', 'status_code'],\n    filter=(ds.field('http_status_code') >= 500),  # Server errors only\n    batch_size=100_000,  # 100K rows per batch\n)\n\n# Process in batches - never loads full dataset\nbatch_count = 0\ntotal_rows = 0\nduration_sum = 0\n\nfor batch in scanner.to_batches():\n    batch_count += 1\n    total_rows += len(batch)\n    # Aggregate within batch (zero-copy access to Arrow arrays)\n    duration_sum += batch.column('duration_ns').to_numpy().sum()\n\navg_duration_ms = (duration_sum / total_rows / 1e6) if total_rows > 0 else 0\n\nprint(f\"\\nProcessed {batch_count} batches ({total_rows:,} rows)\")\nprint(f\"Average latency for HTTP 5xx errors: {avg_duration_ms:.2f} ms\")\nprint(f\"\\n✓ Memory-efficient: only one batch in memory at a time\")\nprint(f\"  Each batch: ~{100_000 * 50 / 1024 / 1024:.1f} MB\")\nprint(f\"  Full dataset: {TARGET_MEMORY_GB} GB\")\nprint(f\"  Memory savings: {TARGET_MEMORY_GB * 1000 / (100_000 * 50 / 1024 / 1024):.0f}×\")","metadata":{},"execution_count":null,"outputs":[]},{"cell_type":"markdown","metadata":{},"source":["## 5. Compute Aggregations (Distributed)"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":"%%time\n# This triggers distributed computation across all workers\n# Watch the Dask dashboard to see tasks being distributed!\ntotal_spans = len(ddf)\nprint(f\"✓ Total spans: {total_spans:,}\")\nprint(f\"  Processing {total_spans:,} rows across {ddf.npartitions} partitions\")"},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":"%%time\n# Multi-dimensional aggregation - watch the Dask dashboard!\n# This demonstrates streaming aggregation: data flows through workers\n# without loading the entire dataset into memory\n\nservice_stats = ddf.groupby('service_name').agg({\n    'span_id': 'count',\n    'duration_ns': ['mean', 'max', 'min', 'std'],\n    'http_status_code': ['mean'],\n}).compute()\n\nservice_stats.columns = ['count', 'mean_duration_ns', 'max_duration_ns', 'min_duration_ns', 'std_duration_ns', 'avg_http_status']\nservice_stats['mean_duration_ms'] = service_stats['mean_duration_ns'] / 1e6\nservice_stats['max_duration_ms'] = service_stats['max_duration_ns'] / 1e6\nservice_stats = service_stats.sort_values('count', ascending=False)\n\nprint(f\"✓ Aggregated {total_spans:,} spans into {len(service_stats)} service groups\")\nservice_stats[['count', 'mean_duration_ms', 'max_duration_ms', 'std_duration_ns']]"},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":"%%time\n# Error rate by service - OPTIMIZED (no apply/lambda)\n# Count errors and total per service, then compute ratio\nimport dask\n\nerror_counts = ddf[ddf['status_code'] == 'ERROR'].groupby('service_name').size()\ntotal_counts = ddf.groupby('service_name').size()\n\n# Compute both in parallel\nerror_counts, total_counts = dask.compute(error_counts, total_counts)\n\n# Calculate error rate\nerror_rate = (error_counts / total_counts * 100).fillna(0).sort_values(ascending=False)\n\nprint(\"Error rate by service (%)\")\nerror_rate"},{"cell_type":"markdown","metadata":{},"source":["## 6. Visualizations with HoloViews"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Sample for visualization (compute a subset)\n","sample_df = ddf.sample(frac=0.1).compute()\n","print(f\"Sample size: {len(sample_df):,} spans\")"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Duration distribution by service\n","sample_df['duration_ms'] = sample_df['duration_ns'] / 1e6\n","\n","hv.BoxWhisker(sample_df, kdims='service_name', vdims='duration_ms').opts(\n","    width=800, height=400,\n","    title='Latency Distribution by Service',\n","    ylabel='Duration (ms)',\n","    box_fill_color=hv.dim('service_name').categorize(dict(zip(\n","        sample_df['service_name'].unique(),\n","        hv.Cycle('Category10').values\n","    )))\n",")"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Span count by service (bar chart)\n","counts = sample_df.groupby('service_name').size().reset_index(name='count')\n","\n","hv.Bars(counts, kdims='service_name', vdims='count').opts(\n","    width=600, height=400,\n","    title='Span Count by Service',\n","    color='service_name',\n","    cmap='Category10',\n","    xrotation=45,\n",")"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Status distribution\n","status_counts = sample_df.groupby(['service_name', 'status_code']).size().reset_index(name='count')\n","\n","hv.Bars(status_counts, kdims=['service_name', 'status_code'], vdims='count').opts(\n","    width=800, height=400,\n","    title='Status Code Distribution by Service',\n","    xrotation=45,\n","    color='status_code',\n","    cmap={'OK': 'green', 'ERROR': 'red', 'UNSET': 'gray'},\n",")"]},{"cell_type":"markdown","source":"## 6b. Hierarchical Drill-Down Visualization\n\nThis section demonstrates **zoom-triggered aggregation** - a key pattern for exploring\nlarge temporal + high-dimensional datasets like OTel traces.\n\n**How it works:**\n- **Zoomed out** (hours/days): Data aggregated at region/AZ level\n- **Medium zoom** (minutes): Service-level aggregates\n- **Zoomed in** (seconds): Individual spans visible\n\nThis enables exploring data from cluster-wide overview down to individual requests\nwithout loading the entire dataset into memory.","metadata":{}},{"cell_type":"code","source":"# Import drill-down visualization utilities\nfrom holoviews.operation.datashader import rasterize, datashade\nfrom holoviews.streams import RangeXY, RangeX\n\n# Prepare data with proper datetime column\ndrill_df = sample_df.copy()\ndrill_df['timestamp'] = pd.to_datetime(drill_df['start_time_unix_nano'], unit='ns')\ndrill_df['duration_ms'] = drill_df['duration_ns'] / 1e6\n\nprint(f\"Prepared {len(drill_df):,} spans for drill-down visualization\")\nprint(f\"Time range: {drill_df['timestamp'].min()} to {drill_df['timestamp'].max()}\")","metadata":{},"execution_count":null,"outputs":[]},{"cell_type":"code","source":"# Create Service Latency Heatmap with linked histogram\n# Zoom/pan on the heatmap to filter the histogram\n\ndef create_latency_heatmap(df):\n    \"\"\"Create an interactive latency heatmap by service over time.\"\"\"\n    # Bucket by 1-minute intervals\n    df = df.copy()\n    df['time_bucket'] = df['timestamp'].dt.floor('1min')\n    \n    # Aggregate: mean latency per service per time bucket\n    agg = df.groupby(['service_name', 'time_bucket']).agg({\n        'duration_ms': ['mean', 'count', 'max'],\n    }).reset_index()\n    agg.columns = ['service', 'time', 'mean_latency', 'count', 'max_latency']\n    \n    # Create heatmap\n    heatmap = hv.HeatMap(agg, kdims=['time', 'service'], vdims=['mean_latency', 'count'])\n    \n    return heatmap.opts(\n        title='Service Latency Heatmap (zoom to filter histogram →)',\n        colorbar=True,\n        cmap='RdYlGn_r',  # Red=slow, Green=fast\n        tools=['hover', 'box_select'],\n        width=700,\n        height=400,\n        xrotation=45,\n    )\n\n# Create the linked view\nheatmap = create_latency_heatmap(drill_df)\n\n# Dynamic histogram that updates based on heatmap selection\nrange_stream = RangeXY(source=heatmap)\n\ndef update_histogram(x_range, y_range):\n    \"\"\"Update histogram based on selected time range.\"\"\"\n    filtered = drill_df\n    \n    if x_range and x_range[0] is not None:\n        mask = (drill_df['timestamp'] >= pd.Timestamp(x_range[0])) & \\\n               (drill_df['timestamp'] <= pd.Timestamp(x_range[1]))\n        filtered = drill_df[mask]\n    \n    if filtered.empty:\n        return hv.Histogram([]).opts(title='Latency Distribution (No data)')\n    \n    frequencies, edges = np.histogram(filtered['duration_ms'], bins=50)\n    hist = hv.Histogram((edges, frequencies))\n    \n    return hist.opts(\n        title=f'Latency Distribution (n={len(filtered):,})',\n        xlabel='Latency (ms)',\n        ylabel='Count',\n        width=350,\n        height=350,\n        fill_color='#3182bd',\n    )\n\nhistogram = hv.DynamicMap(update_histogram, streams=[range_stream])\n\n# Display linked views side by side\n(heatmap + histogram).opts(shared_axes=False)","metadata":{},"execution_count":null,"outputs":[]},{"cell_type":"code","source":"# Overview + Detail View with Hierarchy-Aware Aggregation\n# The detail view changes aggregation level based on zoom\n\ndef determine_agg_level(time_range_seconds):\n    \"\"\"Determine aggregation level from visible time range.\"\"\"\n    if time_range_seconds > 3600:    # > 1 hour\n        return 'service_group', '10min'   # Group services, 10-min buckets\n    elif time_range_seconds > 300:   # > 5 minutes\n        return 'service', '1min'          # Individual services, 1-min buckets\n    else:                            # < 5 minutes\n        return 'host', '10s'              # Host level, 10-sec buckets\n\ndef create_overview(df):\n    \"\"\"Create overview area chart showing total request volume.\"\"\"\n    hourly = df.groupby(df['timestamp'].dt.floor('10min')).agg({\n        'duration_ms': ['mean', 'count']\n    }).reset_index()\n    hourly.columns = ['time', 'mean_latency', 'count']\n    \n    area = hv.Area(hourly, kdims=['time'], vdims=['count'])\n    return area.opts(\n        height=120, width=900,\n        alpha=0.7, color='#1f77b4',\n        title='Overview: Request Volume (drag to zoom detail view)',\n        tools=['xbox_select'],\n    )\n\ndef create_detail(df, x_range):\n    \"\"\"Create detail view with hierarchy-aware aggregation.\"\"\"\n    if x_range is None or x_range[0] is None:\n        # Default view\n        time_range_sec = 3600\n        filtered = df\n    else:\n        start, end = pd.Timestamp(x_range[0]), pd.Timestamp(x_range[1])\n        time_range_sec = (end - start).total_seconds()\n        filtered = df[(df['timestamp'] >= start) & (df['timestamp'] <= end)]\n    \n    if filtered.empty:\n        return hv.Scatter([]).opts(title='Detail (No data in range)')\n    \n    # Determine aggregation level\n    group_col, time_bucket = determine_agg_level(time_range_sec)\n    \n    if group_col == 'service_group':\n        # Group services into clusters (e.g., service-0X -> group-0)\n        filtered = filtered.copy()\n        filtered['_group'] = filtered['service_name'].str.extract(r'service-(\\d)')[0].apply(\n            lambda x: f'group-{x}' if pd.notna(x) else 'other'\n        )\n        group_by = '_group'\n    elif group_col == 'host':\n        group_by = 'host'\n    else:\n        group_by = 'service_name'\n    \n    # Aggregate\n    filtered = filtered.copy()\n    filtered['_bucket'] = filtered['timestamp'].dt.floor(time_bucket)\n    \n    agg = filtered.groupby([group_by, '_bucket']).agg({\n        'duration_ms': 'mean',\n    }).reset_index()\n    agg.columns = ['group', 'time', 'latency']\n    \n    # Create scatter plot\n    scatter = hv.Scatter(agg, kdims=['time'], vdims=['latency', 'group'])\n    \n    return scatter.opts(\n        title=f'Detail: {group_col} level, {time_bucket} buckets (n={len(agg):,})',\n        color='group',\n        cmap='Category20',\n        width=900, height=350,\n        tools=['hover'],\n        size=8,\n        alpha=0.7,\n    )\n\n# Create the linked overview + detail\noverview = create_overview(drill_df)\nrange_x = RangeX(source=overview)\n\ndetail = hv.DynamicMap(\n    lambda x_range: create_detail(drill_df, x_range),\n    streams=[range_x]\n)\n\n# Stack vertically\n(overview + detail).cols(1).opts(shared_axes=False)","metadata":{},"execution_count":null,"outputs":[]},{"cell_type":"code","source":"# Datashader visualization for large datasets\n# This uses server-side rendering to handle millions of points efficiently\n\nfrom holoviews.operation.datashader import datashade, dynspread\n\n# Load a sample for datashader demo (10% = ~6M points from 60M)\nprint(\"Loading ~6M spans for datashader visualization...\")\nlarge_sample = ddf.sample(frac=0.1).compute()\nlarge_sample['timestamp'] = pd.to_datetime(large_sample['start_time_unix_nano'], unit='ns')\nlarge_sample['duration_ms'] = large_sample['duration_ns'] / 1e6\nlarge_sample['timestamp_numeric'] = large_sample['timestamp'].astype(np.int64) / 1e9  # seconds\nprint(f\"Loaded {len(large_sample):,} spans\")\n\n# Create points - each span is a point in (time, latency) space\npoints = hv.Points(\n    large_sample,\n    kdims=['timestamp_numeric', 'duration_ms'],\n    vdims=['service_name']\n)\n\n# Datashade - aggregates millions of points to screen resolution\n# Automatically re-aggregates on zoom/pan\nshaded = datashade(points, cmap='fire').opts(\n    title=f'Datashaded Latency: {len(large_sample):,} spans (zoom to explore)',\n    width=900,\n    height=400,\n    tools=['hover', 'wheel_zoom', 'box_zoom', 'reset'],\n    xlabel='Time (Unix seconds)',\n    ylabel='Latency (ms)',\n)\n\n# dynspread makes individual points visible when zoomed in\ndynspread(shaded, threshold=0.5, max_px=5)","metadata":{},"execution_count":null,"outputs":[]},{"cell_type":"markdown","metadata":{},"source":"<cell_type>markdown</cell_type>## 7. Out-of-Core Stress Test (30 GB)\n\nThis section demonstrates that Dask processes data **much larger than worker memory** using streaming aggregation.\nWith a 30 GB dataset and typical 2-8 GB cluster memory, this is a 4-15× memory challenge.\n\nEach worker processes partitions sequentially, computing partial results and releasing memory."},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":"import time\n\ndef show_worker_memory(label=\"\"):\n    \"\"\"Display worker memory utilization.\"\"\"\n    info = client.scheduler_info()\n    print(f\"\\n{'='*60}\")\n    print(f\"Worker Memory Utilization {label}\")\n    print(f\"{'='*60}\")\n    \n    total_used = 0\n    total_limit = 0\n    \n    for worker_id, worker in sorted(info['workers'].items()):\n        mem_used = worker.get('metrics', {}).get('memory', 0)\n        mem_limit = worker['memory_limit']\n        pct = (mem_used / mem_limit * 100) if mem_limit else 0\n        worker_short = worker_id.split('/')[-1][:25]\n        bar = '█' * int(pct/5) + '░' * (20 - int(pct/5))\n        print(f\"  {worker_short:25} [{bar}] {mem_used/1e9:.2f}GB / {mem_limit/1e9:.2f}GB ({pct:5.1f}%)\")\n        total_used += mem_used\n        total_limit += mem_limit\n    \n    print(f\"\\n  TOTAL: {total_used/1e9:.2f}GB / {total_limit/1e9:.2f}GB ({total_used/total_limit*100:.1f}%)\")\n    return total_used, total_limit\n\n# Show baseline memory and dataset ratio\nbaseline_used, baseline_limit = show_worker_memory(\"(baseline)\")\n\nprint(f\"\\n{'='*60}\")\nprint(\"OUT-OF-CORE CHALLENGE: 30 GB DATASET\")\nprint(f\"{'='*60}\")\nprint(f\"\\n  Dataset expanded size:   {TARGET_MEMORY_GB} GB\")\nprint(f\"  Total worker memory:     {baseline_limit/1e9:.2f} GB\")\nprint(f\"  Ratio (dataset/workers): {TARGET_MEMORY_BYTES/baseline_limit:.1f}×\")\nprint(f\"\\n  ⚡ Dataset is {TARGET_MEMORY_BYTES/baseline_limit:.1f}× larger than cluster memory!\")\nprint(f\"     Dask MUST use out-of-core streaming to process this.\")"},{"cell_type":"code","source":"%%time\n# Complex multi-key aggregation - stresses out-of-core processing\n# This groups by multiple columns, requiring more intermediate state\n\nprint(f\"Running complex aggregation across {TOTAL_SPANS:,} spans (30 GB)...\")\nprint(\"Watch the Dask dashboard - you'll see tasks streaming through workers\\n\")\n\n# First, add a column for HTTP errors (status >= 400)\n# This avoids using lambda in agg() which Dask can't serialize\nddf_with_errors = ddf.assign(is_http_error=(ddf['http_status_code'] >= 400).astype(int))\n\ncomplex_stats = ddf_with_errors.groupby(['service_name', 'operation_name', 'http_method']).agg({\n    'span_id': 'count',\n    'duration_ns': ['mean', 'max', 'std'],\n    'is_http_error': 'sum',  # Sum of boolean = count of errors\n}).compute()\n\ncomplex_stats.columns = ['count', 'mean_duration_ns', 'max_duration_ns', 'std_duration_ns', 'error_count']\ncomplex_stats['mean_duration_ms'] = complex_stats['mean_duration_ns'] / 1e6\ncomplex_stats['error_rate_pct'] = complex_stats['error_count'] / complex_stats['count'] * 100\ncomplex_stats = complex_stats.sort_values('count', ascending=False)\n\nprint(f\"✓ Created {len(complex_stats)} distinct groups from {total_spans:,} spans\")\nprint(f\"  Unique service/operation/method combinations: {len(complex_stats)}\")\ncomplex_stats.head(15)[['count', 'mean_duration_ms', 'error_rate_pct']]","metadata":{},"execution_count":null,"outputs":[]},{"cell_type":"code","source":"# Check memory AFTER complex aggregation\n# Key insight: memory should still be bounded even after processing 30 GB dataset\npost_used, post_limit = show_worker_memory(\"(after complex aggregation)\")\n\nprint(\"\\n\" + \"=\"*60)\nprint(\"OUT-OF-CORE VERIFICATION: 30 GB DATASET\")\nprint(\"=\"*60)\n\n# Calculate memory headroom\nmax_worker_pct = max(\n    w.get('metrics', {}).get('memory', 0) / w['memory_limit'] * 100\n    for w in client.scheduler_info()['workers'].values()\n)\n\nprint(f\"\"\"\nDataset size:          {TARGET_MEMORY_GB} GB ({TOTAL_SPANS:,} spans)\nCluster memory:        {post_limit/1e9:.1f} GB\nDataset/Memory ratio:  {TARGET_MEMORY_BYTES/post_limit:.1f}×\nPeak worker memory:    {max_worker_pct:.1f}%\nMemory stayed bounded: {'✓ YES' if max_worker_pct < 90 else '✗ NO'}\n\nHow out-of-core processing works:\n  1. Dask reads partitions lazily from S3 (one at a time per task)\n  2. Each partition ({SPANS_PER_PARTITION:,} spans, ~50 MB) is processed\n  3. Partial aggregation results accumulated, raw data released\n  4. Only final aggregated results stay in memory\n\nResult: Processed {TARGET_MEMORY_GB} GB dataset using {post_limit/1e9:.1f} GB cluster!\n        That's {TARGET_MEMORY_BYTES/post_limit:.0f}× more data than available RAM.\n\"\"\")","metadata":{},"execution_count":null,"outputs":[]},{"cell_type":"markdown","metadata":{},"source":["## 8. Cleanup"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Optionally delete test data\n","# Uncomment to clean up:\n","# s3.rm(validation_path, recursive=True)\n","# print(f\"Deleted: {validation_path}\")"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Close client\n","# client.close()"]},{"cell_type":"markdown","metadata":{},"source":"<cell_type>markdown</cell_type>---\n\n## Validation Summary\n\nThis notebook validated **Dask out-of-core processing** with a **30 GB dataset**:\n\n| Metric | Value |\n|--------|-------|\n| Dataset Size | **30 GB** (expanded memory) |\n| Total Spans | 60,000,000 |\n| Partitions | 600 |\n| Disk Size | ~6-8 GB (Parquet/Snappy) |\n| Services | 20 |\n\n### Key Validation: 30 GB Out-of-Core Processing\n\nThe 30 GB dataset is typically **10-30× larger** than cluster memory:\n- With 2 workers × 2 GB = 4 GB cluster → **7.5× ratio**\n- With 4 workers × 2 GB = 8 GB cluster → **3.75× ratio**\n- With 2 workers × 1 GB = 2 GB cluster → **15× ratio**\n\nThis **guarantees** Dask must use streaming/out-of-core processing - the data\nsimply cannot fit in memory.\n\n### Capabilities Demonstrated\n\n1. **Dask Cluster Connection** - Connected to distributed scheduler with multiple workers\n2. **S3 Access via IAM** - Read/write to S3 using AWS IAM role credentials\n3. **30 GB Dataset Generation** - 60M spans across 600 partitions\n4. **Idempotent Data Generation** - Skips regeneration if data already exists\n5. **Lazy Loading** - 60M rows loaded only when `.compute()` is called\n6. **Distributed Aggregations** - GroupBy operations computed in parallel across workers\n7. **Out-of-Core Processing** - Memory stays bounded processing 30 GB with ~2-8 GB cluster\n8. **HoloViews Visualizations** - Interactive plots render correctly in JupyterLab\n9. **Hierarchical Drill-Down** - Zoom-triggered aggregation (service group → service → host)\n10. **Datashader Integration** - Millions of points rendered efficiently with zoom/pan\n\n### PyArrow Dataset Capabilities\n\n| Feature | Description | Benefit |\n|---------|-------------|---------|\n| **Schema Inspection** | Read schema without loading data | Fast exploration of unknown datasets |\n| **Predicate Pushdown** | Filters applied at Parquet row-group level | Only matching data read from S3 |\n| **Column Projection** | Only requested columns deserialized | Reduced I/O and memory |\n| **Scanner API** | Batch-by-batch iteration | Constant memory for any dataset size |\n| **Dask Integration** | Filters passed to Arrow engine | Distributed + pushdown combined |\n\n### Data Loading Approaches Compared\n\n| Approach | Use Case | Memory Model |\n|----------|----------|--------------|\n| `dd.read_parquet()` | Distributed aggregations | Partitioned across workers |\n| `ds.dataset().to_table()` | Single-node filtered reads | Predicate pushdown, full result in memory |\n| `ds.dataset().scanner()` | Streaming processing | Constant memory (batch-at-a-time) |\n| `dd.read_parquet(filters=)` | Distributed + filtered | Best of both worlds |\n\n### Drill-Down Visualization Pattern\n\nThe notebook demonstrates **zoom-triggered hierarchy** for exploring large OTel datasets:\n\n| Zoom Level | Aggregation | Time Bucket | Use Case |\n|------------|-------------|-------------|----------|\n| Zoomed out (>1h) | Service groups | 10 min | Cluster-wide overview |\n| Medium (5m-1h) | Individual services | 1 min | Service comparison |\n| Zoomed in (<5m) | Hosts/pods | 10 sec | Incident investigation |\n\nThis pattern enables exploring from region/AZ-level down to individual spans without\nloading the entire dataset into memory.\n\n### Key Insight\n\n**No bottlenecks** in the data path:\n\n1. **S3 → Arrow**: Predicate pushdown means only relevant row groups are read\n2. **Arrow → Dask**: Zero-copy handoff, data stays in Arrow format\n3. **Dask Workers**: Stream partitions, compute partial aggregations, release memory\n4. **Final Result**: Only aggregated summaries returned to client\n\nThis architecture processes datasets **orders of magnitude larger than cluster memory**."}],"metadata":{"kernelspec":{"display_name":"Python 3","language":"python","name":"python3"},"language_info":{"name":"python","version":"3.10.0"}},"nbformat":4,"nbformat_minor":5}
  HDF5_CPHY_Acquisition_Generator.ipynb: |
    {"nbformat":4,"nbformat_minor":5,"metadata":{"kernelspec":{"display_name":"Python 3","language":"python","name":"python3"},"language_info":{"name":"python","version":"3.10.0"}},"cells":[{"cell_type":"markdown","metadata":{},"source":"# CPHY HDF5 Acquisition Generator + Dask Explorer\n\nGenerate many **OpenTelemetry-framed** dense acquisition windows as HDF5 for CPHY\ntelemetry, land them on RustFS (`s3://cyberphy/…`), and explore\nwith **Dask + Holoviews/Datashader** out-of-core.\n\n| Layer | Content |\n|-------|---------|\n| **A — Dataset plane** | Many contiguous `.h5` files under hive prefixes |\n| **B — Metadata plane** | Pointer-table *preview* only (no Iceberg write yet) |\n\n**Domain:** cyber-physical (**CPHY**) operations — dense sensor-chain telemetry that\nFlink will eventually project into rich OTel spans/metrics. Group tree stays\n`ResourceMetrics` for OTel clarity.\n\n**Iceberg File Format API readiness:** fixed one-window files, time bounds in three\nplaces (filename / group attrs / dataset attrs), uuid chain, contiguous Values for\nsingle byte-range kerchunk refs. See\n`docs/current/src/architecture/hdf5-iceberg-metadata-plane.md`.\n\n**Profiles**\n\n| Profile | Geometry | Approx Values size |\n|---------|----------|--------------------|\n| `lab` (default) | 5001 × 10000 × 108 parts | **~10 GiB** (RAID) |\n| `lab_tiny` | 256 × 500 × 24 parts | ~6 MiB smoke |\n| `airgap_2tb` | 5001 × 10000 × 21500 parts | **~2 TiB** |\n\nCopy this notebook to your home before editing:\n```python\nimport shutil; shutil.copy('/app/sample-notebooks/HDF5_CPHY_Acquisition_Generator.ipynb', '/root/')\n```\n"},{"cell_type":"code","metadata":{},"execution_count":null,"outputs":[],"source":"# --- User Configuration ---\nimport os\nfrom datetime import datetime, timezone\n\n# Profile: \"lab\" | \"airgap_2tb\"\nPROFILE = os.getenv(\"HDF5_PROFILE\", \"lab\")\n\n# Time unit for Timestamps dataset: \"ns\" (OTel default) or \"us\" (microseconds)\nTIME_UNIT = os.getenv(\"HDF5_TIME_UNIT\", \"ns\")\n\n# Contiguous storage (Iceberg/kerchunk-friendly). Set False only for chunk experiments.\nCONTIGUOUS = True\n\n# Optional overrides (None = use profile defaults)\nN_PARTS = None          # e.g. 8 for a quicker lab run\nN_SERIES = None\nN_TIME = None\n\n# S3 (JupyterHub injects these for zarf:local)\nBUCKET = os.getenv(\"S3_BUCKET\", \"cyberphy\")\nS3_ENDPOINT = os.getenv(\"S3_ENDPOINT\", \"http://127.0.0.1:9010\")\nS3_REGION = os.getenv(\"AWS_REGION\", os.getenv(\"S3_REGION\", \"us-east-1\"))\n# Root is fixed hive layout under the bucket; OUT is the s3:// URL for generate_parts\nOUT = f\"s3://{BUCKET}/\"  # keys always datasets/hdf5/otelcphy/... when hive_layout=True\n\n# Dask\nDASK_SCHEDULER = os.getenv(\n    \"DASK_SCHEDULER_ADDRESS\",\n    os.getenv(\"DASK_SCHEDULER\", \"tcp://cybersec-dask-scheduler.dask.svc.cluster.local:8786\"),\n)\nUSE_DASK = os.getenv(\"USE_DASK\", \"1\") not in (\"0\", \"false\", \"False\")\n\n# Visualization\nHEATMAP_SERIES_STRIDE = 1   # plot every Nth series (lab can use 1)\nVIZ_MAX_POINTS = 2_000_000  # safety cap for client-side raster before datashader\n\nprint(f\"PROFILE={PROFILE}  TIME_UNIT={TIME_UNIT}  BUCKET={BUCKET}\")\nprint(f\"S3_ENDPOINT={S3_ENDPOINT or '(AWS default)'}\")\nprint(f\"DASK={DASK_SCHEDULER if USE_DASK else 'disabled'}\")\n"},{"cell_type":"code","metadata":{},"execution_count":null,"outputs":[],"source":"# Imports + path to generate_hdf5\nimport json\nimport sys\nimport tempfile\nfrom pathlib import Path\n\nimport numpy as np\nimport pandas as pd\n\n# Resolve generate_hdf5.py (repo checkout, image /app, or notebook cwd)\n_CANDIDATES = [\n    Path(\"/app/generate_hdf5.py\"),              # image-baked (air-gap; survives ConfigMap)\n    Path(\"/app/lib/generate_hdf5.py\"),\n    Path(\"/app/sample-notebooks/generate_hdf5.py\"),  # ConfigMap or image\n    Path.cwd() / \"generate_hdf5.py\",\n    Path.cwd() / \"zarf\" / \"scripts\" / \"generate_hdf5.py\",\n    Path(\"/app/zarf/scripts/generate_hdf5.py\"),\n    Path(\"/root/generate_hdf5.py\"),\n]\n_SCRIPT = next((p for p in _CANDIDATES if p.is_file()), None)\nif _SCRIPT is None:\n    # Fall back: search upward\n    for parent in [Path.cwd(), *Path.cwd().parents]:\n        cand = parent / \"zarf\" / \"scripts\" / \"generate_hdf5.py\"\n        if cand.is_file():\n            _SCRIPT = cand\n            break\nif _SCRIPT is None:\n    raise FileNotFoundError(\"generate_hdf5.py not found — mount repo or copy script into image\")\n\nsys.path.insert(0, str(_SCRIPT.parent))\nimport generate_hdf5 as gh\n\nprint(f\"Using generator: {_SCRIPT}\")\nprint(f\"Profiles: {list(gh.PROFILES)}\")\nfor name, p in gh.PROFILES.items():\n    print(f\"  {name}: {p['description']}\")\n"},{"cell_type":"code","metadata":{},"execution_count":null,"outputs":[],"source":"# Build GenConfig\noverrides = {\n    \"time_unit\": TIME_UNIT,\n    \"contiguous\": CONTIGUOUS,\n    \"group_style\": \"underscore\",\n    \"hive_layout\": True,\n    \"service_name\": \"cphy-collector\",\n    \"service_namespace\": \"cyberphy.otel\",\n    \"base_time\": datetime.now(timezone.utc).replace(microsecond=0),\n}\nif N_PARTS is not None:\n    overrides[\"n_parts\"] = int(N_PARTS)\nif N_SERIES is not None:\n    overrides[\"n_series\"] = int(N_SERIES)\nif N_TIME is not None:\n    overrides[\"n_time\"] = int(N_TIME)\n\nif PROFILE == \"custom\":\n    cfg = gh.GenConfig(**overrides)\nelse:\n    cfg = gh.profile_config(PROFILE, **overrides)\n\nprint(\"=\" * 60)\nprint(f\"Active profile: {PROFILE}\")\nprint(f\"  series × time × parts = {cfg.n_series} × {cfg.n_time} × {cfg.n_parts}\")\nprint(f\"  Values payload ≈ {cfg.estimated_values_bytes()/1e6:.2f} MB \"\n      f\"({cfg.estimated_values_tib():.4f} TiB)\")\nprint(f\"  layout={('contiguous' if cfg.contiguous else 'chunked')}  time_unit={cfg.time_unit}\")\nprint(f\"  hive keys under s3://{BUCKET}/datasets/hdf5/{cfg.product}/…\")\nprint(\"=\" * 60)\nif PROFILE == \"lab\":\n    print(\"ℹ lab profile is ~10 GiB Values — ensure RUSTFS_DATA_DIR is on /raid.\")\nif PROFILE == \"airgap_2tb\":\n    print(\"⚠ airgap_2tb is ~2 TiB — only run on a large air-gap cluster with ample S3.\")\n    print(\"  For this notebook session, consider N_PARTS=2 smoke test first.\")\n"},{"cell_type":"markdown","metadata":{},"source":"## Iceberg-oriented layout (dataset plane)\n\n```\ns3://cyberphy/\n  datasets/hdf5/otelcphy/                 # Layer A — conserved, never rewritten by Iceberg\n    service=cphy-collector/\n      date=YYYY-MM-DD/\n        hour=HH/\n          otelcphy_<YYYYMMDDTHHMMSS>_<part>Z.h5\n  indexes/kerchunk/<fingerprint>.json     # optional refs (Layer B stub)\n  # iceberg/warehouse/                    # Layer B warehouse — NOT written by this notebook\n```\n\n**Why many small files?** Each file is one fixed-duration acquisition window. That maps\ncleanly to Iceberg *data files* under a future HDF5 `FormatModel` (File Format API), and\nto pointer-table rows (`telemetry.hdf5_datasets`) with `t_min_ns`/`t_max_ns` pruning today.\n\n**Contiguous Values:** one byte range per dataset → kerchunk refs degenerate to a single\n`(offset, length)`; series hyperslabs are arithmetic strides (`n_time * itemsize` per row).\n"},{"cell_type":"code","metadata":{},"execution_count":null,"outputs":[],"source":"# Generate parts → RustFS\ninventory = gh.generate_parts(\n    cfg,\n    OUT,\n    s3_endpoint=S3_ENDPOINT or None,\n    emit_kerchunk_refs=False,\n    dry_run=False,\n    progress_every=max(1, cfg.n_parts // 8),\n)\n\npointer_rows = gh.inventory_to_pointer_rows(inventory)\ninv_df = pd.DataFrame(pointer_rows)\nprint(inv_df.head())\nprint(f\"\\nTotal files: {len(inv_df)}  total size: {inv_df['size_bytes'].sum()/1e6:.1f} MB\")\n"},{"cell_type":"code","metadata":{},"execution_count":null,"outputs":[],"source":"# Upload pointer-table preview (not full Iceberg — just inventory for later registration)\nimport pyarrow as pa\nimport pyarrow.parquet as pq\nimport pyarrow.fs as pafs\n\ndef s3_filesystem():\n    kw = dict(\n        access_key=os.environ.get(\"AWS_ACCESS_KEY_ID\", \"admin\"),\n        secret_key=os.environ.get(\"AWS_SECRET_ACCESS_KEY\", \"admin\"),\n        region=S3_REGION,\n    )\n    token = os.environ.get(\"AWS_SESSION_TOKEN\") or \"\"\n    if token:\n        kw[\"session_token\"] = token\n    if S3_ENDPOINT:\n        kw[\"endpoint_override\"] = S3_ENDPOINT\n        kw[\"scheme\"] = \"https\" if S3_ENDPOINT.startswith(\"https\") else \"http\"\n    return pafs.S3FileSystem(**kw)\n\ns3fs_pa = s3_filesystem()\ninv_key = f\"{BUCKET}/datasets/hdf5/{cfg.product}/_inventory/parts.parquet\"\ntable = pa.Table.from_pandas(inv_df)\npq.write_table(table, inv_key, filesystem=s3fs_pa)\nprint(f\"Wrote pointer-table preview → s3://{inv_key}\")\n\n# s3fs listing of first hive prefix\nimport s3fs\ns3 = s3fs.S3FileSystem(\n    key=os.environ.get(\"AWS_ACCESS_KEY_ID\", \"admin\"),\n    secret=os.environ.get(\"AWS_SECRET_ACCESS_KEY\", \"admin\"),\n    client_kwargs={\"endpoint_url\": S3_ENDPOINT} if S3_ENDPOINT else {},\n    config_kwargs={\"s3\": {\"addressing_style\": \"path\"}, \"signature_version\": \"s3v4\"},\n)\nprefix = f\"{BUCKET}/datasets/hdf5/{cfg.product}\"\nprint(\"Sample listing:\")\nfor p in sorted(s3.glob(prefix + \"/**/*.h5\"))[:8]:\n    print(\" \", p)\n"},{"cell_type":"markdown","metadata":{},"source":"## Structural audit (one file)\n\nOpen a single acquisition and verify: contiguous Values, uuid chain, time triple agreement,\nand Metric sub-window vs acquisition start index.\n"},{"cell_type":"code","metadata":{},"execution_count":null,"outputs":[],"source":"import h5py\nimport tempfile\n\n# Download one part for audit (h5py needs a seekable path for full attr walk)\nsample_uri = inventory[0][\"uri\"]\nsample_key = inventory[0][\"key\"]\nprint(\"Auditing\", sample_uri)\n\nwith tempfile.NamedTemporaryFile(suffix=\".h5\") as tmp:\n    s3.get(f\"{BUCKET}/{sample_key}\", tmp.name)\n    with h5py.File(tmp.name, \"r\") as f:\n        def walk(name, obj):\n            kind = \"G\" if isinstance(obj, h5py.Group) else \"D\"\n            nattr = len(obj.attrs)\n            extra = \"\"\n            if isinstance(obj, h5py.Dataset):\n                extra = f\" shape={obj.shape} dtype={obj.dtype} contiguous={obj.chunks is None}\"\n            print(f\"  {kind} /{name}  attrs={nattr}{extra}\")\n        print(\"Tree:\")\n        f.visititems(walk)\n        print(\"\\nRoot uuid:\", f.attrs.get(\"collection.uuid\"))\n        rm = f[\"ResourceMetrics\"]\n        print(\"Acquisition start.series.index:\", int(rm.attrs[\"start.series.index\"]))\n        met_name = \"Metric_0\" if \"Metric_0\" in rm else \"Metric[0]\"\n        met = rm[met_name]\n        print(\"Metric start.series.index:\", int(met.attrs[\"start.series.index\"]))\n        print(\"  (sub-window ≠ acquisition — expected)\")\n        vals = met[\"Values\"]\n        ts = met[\"Timestamps\"]\n        print(f\"Values: {vals.shape} chunks={vals.chunks} scale.factor={float(met.attrs.get('scale.factor', 0))}\")\n        print(f\"Timestamps: unit={ts.attrs.get('unit')} start.index={int(ts.attrs['start.index'])}\")\n        print(f\"part.start.time Values:\", vals.attrs.get(\"part.start.time\"))\n        print(f\"part.start.time RM:    \", rm.attrs.get(\"start.time\"))\n"},{"cell_type":"markdown","metadata":{},"source":"## Dask client\n\nWorkers inherit S3 env from the DaskCluster (admin/cyberphy on lab). Tasks should only\nload **hyperslabs**, never whole multi-hundred-MB files into the client.\n"},{"cell_type":"code","metadata":{},"execution_count":null,"outputs":[],"source":"from dask.distributed import Client, get_client\n\nclient = None\nif USE_DASK:\n    try:\n        client = Client(DASK_SCHEDULER, timeout=\"10s\")\n        print(\"Connected:\", client)\n        print(\"Dashboard:\", client.dashboard_link)\n        print(\"Workers:\", len(client.scheduler_info().get(\"workers\", {})))\n    except Exception as e:\n        print(f\"Dask unavailable ({e}); falling back to local threads\")\n        client = Client(processes=False, threads_per_worker=2, n_workers=2)\n        print(client)\nelse:\n    print(\"USE_DASK=0 — client-local only\")\n"},{"cell_type":"code","metadata":{},"execution_count":null,"outputs":[],"source":"# Dask-ready hyperslab reader (one part → numpy block)\n# Paths on workers: use s3fs inside the task so workers need network to RustFS.\n\ndef read_values_hyperslab(bucket, key, endpoint, access_key, secret_key,\n                          series_slice=None, time_slice=None):\n    \"\"\"Read Values[series, time] from one HDF5 object on S3.\"\"\"\n    import tempfile\n    import h5py\n    import numpy as np\n    import s3fs\n\n    s3 = s3fs.S3FileSystem(\n        key=access_key, secret=secret_key,\n        client_kwargs={\"endpoint_url\": endpoint} if endpoint else {},\n        config_kwargs={\"s3\": {\"addressing_style\": \"path\"}, \"signature_version\": \"s3v4\"},\n    )\n    with tempfile.NamedTemporaryFile(suffix=\".h5\") as tmp:\n        s3.get(f\"{bucket}/{key}\", tmp.name)\n        with h5py.File(tmp.name, \"r\") as f:\n            met = f[\"ResourceMetrics\"][\"Metric_0\"] if \"Metric_0\" in f[\"ResourceMetrics\"] \\\n                  else f[\"ResourceMetrics\"][\"Metric[0]\"]\n            ds = met[\"Values\"]\n            ss = series_slice or slice(None)\n            ts = time_slice or slice(None)\n            arr = np.asarray(ds[ss, ts], dtype=np.float32)\n            scale = float(met.attrs.get(\"scale.factor\", 1.0)) or 1.0\n            # denormalize toward physical-ish units for viz (phase-like)\n            return arr / scale\n\n\nAK = os.environ.get(\"AWS_ACCESS_KEY_ID\", \"admin\")\nSK = os.environ.get(\"AWS_SECRET_ACCESS_KEY\", \"admin\")\n\n# Build delayed stack of parts (series × time) for out-of-core access\nimport dask.array as da\nfrom dask import delayed\n\nkeys = [m[\"key\"] for m in inventory]\n# For lab, load full series; for larger profiles, stride series on read\ns_slice = slice(None)\nt_slice = slice(None)\n\ndelayed_reads = [\n    delayed(read_values_hyperslab)(BUCKET, k, S3_ENDPOINT, AK, SK, s_slice, t_slice)\n    for k in keys\n]\n# Each part → (n_series, n_time); stack along a new \"part\" axis then reshape to time\nsample = read_values_hyperslab(BUCKET, keys[0], S3_ENDPOINT, AK, SK, s_slice, t_slice)\nprint(\"Sample part shape:\", sample.shape, sample.dtype)\n\nblocks = [\n    da.from_delayed(d, shape=sample.shape, dtype=np.float32)\n    for d in delayed_reads\n]\n# Concatenate along time: (series, time_total)\nvalues_da = da.concatenate(blocks, axis=1)\nprint(\"Dask array:\", values_da)\nprint(\"npartitions (blocks):\", values_da.npartitions)\n"},{"cell_type":"markdown","metadata":{},"source":"## Holoviews + Datashader\n\nDatashader aggregates on the **cluster or client** without shipping every point to the\nbrowser. For the lab profile we pull a modest compute(); for airgap-scale, keep work on\nDask and only materialize decimated overviews.\n"},{"cell_type":"code","metadata":{},"execution_count":null,"outputs":[],"source":"import holoviews as hv\nfrom holoviews.operation.datashader import datashade, rasterize, dynspread\nimport datashader as ds\nhv.extension(\"bokeh\")\n\n# Materialize for viz — lab is small; for large profiles, decimate first\nmax_series_plot = min(cfg.n_series, 512)\nmax_time_plot = min(values_da.shape[1], 4000)\n\nviz = values_da[:max_series_plot, :max_time_plot]\nprint(\"Computing viz slab\", viz.shape, \"…\")\nviz_np = viz.compute()\nprint(\"done\", viz_np.shape, \"minmax\", float(viz_np.min()), float(viz_np.max()))\n\n# Build a points table: time index × series index × value  (sampled if huge)\nn_s, n_t = viz_np.shape\n# stride so total points stay under VIZ_MAX_POINTS\nstride_s = max(1, int(np.ceil(n_s * n_t / VIZ_MAX_POINTS)))\nstride_t = 1\nsub = viz_np[::stride_s, ::stride_t]\nss, tt = sub.shape\n# coordinates\nseries_idx = np.arange(0, n_s, stride_s)[:ss]\ntime_idx = np.arange(0, n_t, stride_t)[:tt]\n# mesh to columns\nT, S = np.meshgrid(time_idx, series_idx)\ndf = pd.DataFrame({\n    \"time_sample\": T.ravel().astype(np.float32),\n    \"series\": S.ravel().astype(np.float32),\n    \"value\": sub.ravel().astype(np.float32),\n})\nprint(f\"Datashader points: {len(df):,} (stride_s={stride_s})\")\n\npoints = hv.Points(df, kdims=[\"time_sample\", \"series\"], vdims=[\"value\"])\nheatmap = datashade(points, aggregator=ds.mean(\"value\"), cmap=\"fire\").opts(\n    width=900,\n    height=420,\n    title=f\"CPHY acquisition phase (mean) — {PROFILE} — {len(keys)} parts\",\n    xlabel=\"time sample (concatenated parts)\",\n    ylabel=\"series index\",\n)\ndynspread(heatmap, threshold=0.4, max_px=3)\n"},{"cell_type":"code","metadata":{},"execution_count":null,"outputs":[],"source":"# Series profile + value histogram (client-side on viz_np)\nmid = viz_np.shape[0] // 2\nprofile = hv.Curve(\n    (np.arange(viz_np.shape[1]), viz_np[mid]),\n    kdims=\"time_sample\", vdims=\"value\",\n).opts(width=900, height=200, title=f\"Series {mid} profile\", color=\"#4fc3f7\")\n\nhist = hv.Histogram(np.histogram(viz_np.ravel()[::10], bins=80)).opts(\n    width=900, height=200, title=\"Value distribution (decimated)\",\n    xlabel=\"normalized phase\",\n)\n(profile + hist).cols(1)\n"},{"cell_type":"code","metadata":{},"execution_count":null,"outputs":[],"source":"# Multi-file time continuity (Timestamps stitch check)\ndef read_ts_bounds(bucket, key, endpoint, access_key, secret_key):\n    import tempfile, h5py, s3fs\n    s3 = s3fs.S3FileSystem(\n        key=access_key, secret=secret_key,\n        client_kwargs={\"endpoint_url\": endpoint} if endpoint else {},\n        config_kwargs={\"s3\": {\"addressing_style\": \"path\"}, \"signature_version\": \"s3v4\"},\n    )\n    with tempfile.NamedTemporaryFile(suffix=\".h5\") as tmp:\n        s3.get(f\"{bucket}/{key}\", tmp.name)\n        with h5py.File(tmp.name, \"r\") as f:\n            met = f[\"ResourceMetrics\"][\"Metric_0\"] if \"Metric_0\" in f[\"ResourceMetrics\"] \\\n                  else f[\"ResourceMetrics\"][\"Metric[0]\"]\n            ts = met[\"Timestamps\"]\n            return int(ts[0]), int(ts[-1]), int(ts.attrs[\"start.index\"]), str(ts.attrs.get(\"unit\", b\"ns\"))\n\nbounds = []\nfor m in inventory[: min(12, len(inventory))]:\n    a, b, si, unit = read_ts_bounds(BUCKET, m[\"key\"], S3_ENDPOINT, AK, SK)\n    bounds.append({\"part\": m[\"part_idx\"], \"t0\": a, \"t1\": b, \"start.index\": si, \"unit\": unit})\nbdf = pd.DataFrame(bounds)\nprint(bdf)\n# gaps between parts (should be ~ one sample step)\nif len(bdf) > 1:\n    gaps = bdf[\"t0\"].values[1:] - bdf[\"t1\"].values[:-1]\n    print(\"inter-part Δ (should be ~step):\", gaps[:5], \"…\")\n"},{"cell_type":"markdown","metadata":{},"source":"## Next steps (metadata plane)\n\n1. **Registration pipeline** — scan hive prefixes → append `telemetry.hdf5_datasets` +\n   `hdf5_chunk_stats` (pointer table / virtual chunks).\n2. **Kerchunk** — `--emit-kerchunk` or notebook cell; store under `indexes/kerchunk/`.\n3. **Overviews** — Iceberg parquet pyramids for first-paint datashader (see design §6).\n4. **File Format API** — when an HDF5 `FormatModel` exists, these files become first-class\n   Iceberg data files; pointer table remains provenance.\n\n### Air-gap 2 TiB checklist\n\n```python\nPROFILE = \"airgap_2tb\"\n# or: PROFILE=\"lab\"; N_PARTS=2  # smoke\n```\n\nEnsure RustFS/S3 capacity ≥ ~2.2 TiB free, Dask workers with spill, and run generation as a\nbatch job (not a long-lived notebook cell) if part count is full 21500.\n"},{"cell_type":"code","metadata":{},"execution_count":null,"outputs":[],"source":"# Optional cleanup of client\n# if client is not None:\n#     client.close()\nprint(\"Notebook complete.\")\nprint(f\"Files: {len(inventory)} under s3://{BUCKET}/datasets/hdf5/{cfg.product}/\")\n"}]}
  generate_hdf5.py: |
    #!/usr/bin/env python3
    """Synthetic HDF5 telemetry generator (OpenTelemetry-framed, CPHY domain).

    Generates synthetic OpenTelemetry / cyber-physical (CPHY) datasets in HDF5 and
    lands them in S3 (RustFS locally, AWS S3 in the cloud). The container layout is
    a dense multi-series acquisition layout framed entirely in OpenTelemetry / CPHY terms:

      * depth-4 group tree (root → ResourceMetrics → {Scope, Resource_0, Metric_0})
      * rich node-level metadata: fixed-length |S strings, float64 + ".unit" pairs,
        int64/int32 counts, bool flags (GaugeLength.uom pattern)
      * one dominant 2D Values array (series × time) + 1D Timestamps index
      * compound side tables: Windows, SeriesAnchor summary + full map
      * default **contiguous** storage (Iceberg/kerchunk: one byte range per dataset)
      * optional chunked mode for native-ref experiments

    Iceberg File Format API readiness
    ---------------------------------
    Many fixed-window .h5 files under a hive-style prefix, with time bounds in
    filename + group attrs + dataset attrs, uuid chain for registration, and
    pointer-table-shaped inventory rows (see docs/current/.../hdf5-iceberg-metadata-plane.md).

    Profiles
    --------
      lab        — small (space-constrained Jupyter/Dask demo)
      airgap_2tb — ~2 TiB of Values payload across many 1 s fidelity parts

    Usage:
        python generate_hdf5.py --profile lab --out s3://cyberphy/datasets/hdf5/otelcphy/
        python generate_hdf5.py --profile lab --out ./local_hdf5 --contiguous
        python generate_hdf5.py --profile airgap_2tb --out s3://cyberphy/datasets/hdf5/otelcphy/ \\
            --dry-run   # print plan only

    Dependencies: h5py, numpy; boto3 for S3.
        uv run --with h5py,numpy,boto3 python zarf/scripts/generate_hdf5.py ...
    """
    from __future__ import annotations

    import argparse
    import hashlib
    import json
    import os
    import tempfile
    import uuid
    from dataclasses import asdict, dataclass, field
    from datetime import datetime, timedelta, timezone
    from pathlib import Path
    from typing import Any, Literal, Optional
    from urllib.parse import urlparse

    import numpy as np

    try:
        import h5py
    except ImportError:  # pragma: no cover
        raise SystemExit(
            "h5py is required: uv run --with h5py,numpy python zarf/scripts/generate_hdf5.py ..."
        )

    SCHEMA_VERSION = "2.1"
    OTEL_SCHEMA_URL = "https://opentelemetry.io/schemas/1.27.0"
    DEFAULT_DTYPE = "int16"
    # int16 full-scale encoding factor for normalized metric values
    DEFAULT_SCALE_FACTOR = 10430.0

    TimeUnit = Literal["ns", "us"]
    GroupStyle = Literal["underscore", "brackets"]
    ProfileName = Literal["lab", "airgap_2tb", "custom"]

    # ---------------------------------------------------------------------------
    # Profiles
    # ---------------------------------------------------------------------------
    # Values bytes ≈ n_series * n_time * itemsize * n_parts  (plus small HDF5 overhead)
    PROFILES: dict[str, dict[str, Any]] = {
        # Default lab on RAID (~10 GiB Values). Needs /raid free space; use lab_tiny for smoke.
        # 5001 × 10000 × 2 B ≈ 95.39 MiB Values/part × 108 parts ≈ 10.05 GiB.
        "lab": {
            "n_series": 5001,
            "n_time": 10_000,
            "n_parts": 108,
            "sampling_interval_ms": 0.1,  # 10 kHz → 1 s window (fidelity-shaped)
            "sample_rate_hz_declared": 10_000.0,
            "contiguous": True,
            "description": (
                "Lab (RAID): 5001 × 10000 × 108 parts ≈ 10.05 GiB Values (int16). "
                "Interesting multi-file Dask/datashader workload; store under RUSTFS_DATA_DIR on /raid."
            ),
        },
        # Quick smoke / CI-sized (seconds, not GiB).
        "lab_tiny": {
            "n_series": 256,
            "n_time": 500,
            "n_parts": 24,
            "sampling_interval_ms": 2.0,
            "sample_rate_hz_declared": 10_000.0,
            "contiguous": True,
            "description": (
                "Tiny smoke: 256 × 500 × 24 parts ≈ 6.1 MiB Values. Fast notebook/CI check."
            ),
        },
        # Large air-gap: ~2 TiB of int16 Values using fidelity-shaped parts.
        # 5001 × 10000 × 2 B ≈ 95.4 MiB Values/part → 21_500 parts ≈ 2.00 TiB.
        "airgap_2tb": {
            "n_series": 5001,
            "n_time": 10_000,
            "n_parts": 21_500,
            "sampling_interval_ms": 0.1,  # 10 kHz → 1 s window
            "sample_rate_hz_declared": 10_000.0,
            "contiguous": True,
            "description": (
                "Air-gap scale: 5001 × 10000 int16 × 21500 parts ≈ 2.00 TiB Values. "
                "Needs significant S3-like capacity + cluster RAM for out-of-core Dask."
            ),
        },
    }


    @dataclass
    class GenConfig:
        """Generation configuration (notebook- and CLI-friendly)."""

        n_series: int = 5001
        n_time: int = 10_000
        n_parts: int = 108
        contiguous: bool = True
        chunk_series: int = 512
        chunk_time: int = 2048
        sampling_interval_ms: float = 2.0
        sample_rate_hz_declared: float = 10_000.0
        dtype: str = DEFAULT_DTYPE
        value_unit: str = "normalized_units"
        scale_factor: float = DEFAULT_SCALE_FACTOR
        service_name: str = "cphy-collector"
        service_namespace: str = "cyberphy.otel"
        # Acquisition-level start (full fiber); Metric_0 uses a sub-window offset
        start_series_index: int = 3489
        metric_start_series_index: int = 3500  # ≠ start_series_index (sub-window parity)
        export_timeout_s: float = 30.0
        batch_max_size: int = 8192
        spatial_resolution: float = 1.021  # meters per series index step
        sensing_span: float = 2.0  # meters (instrument sense window)
        seed: int = 0
        time_unit: TimeUnit = "ns"  # OTel-native; set "us" for microsecond timestamps
        group_style: GroupStyle = "underscore"  # URL/HOCON-safe
        product: str = "otelcphy"
        # Hive layout under bucket: datasets/hdf5/otelcphy/service=…/date=…/hour=…
        hive_layout: bool = True
        base_time: Optional[datetime] = None  # UTC; default = now

        def estimated_values_bytes(self) -> int:
            item = np.dtype(self.dtype).itemsize
            return int(self.n_series) * int(self.n_time) * item * int(self.n_parts)

        def estimated_values_tib(self) -> float:
            return self.estimated_values_bytes() / (1024**4)


    def profile_config(name: str, **overrides: Any) -> GenConfig:
        """Build GenConfig from a named profile, with optional field overrides."""
        if name not in PROFILES and name != "custom":
            raise ValueError(f"Unknown profile {name!r}; choose from {list(PROFILES)}")
        base = PROFILES.get(name, {})
        cfg = GenConfig(
            n_series=int(base.get("n_series", 256)),
            n_time=int(base.get("n_time", 500)),
            n_parts=int(base.get("n_parts", 1)),
            contiguous=bool(base.get("contiguous", True)),
            sampling_interval_ms=float(base.get("sampling_interval_ms", 2.0)),
            sample_rate_hz_declared=float(base.get("sample_rate_hz_declared", 10_000.0)),
        )
        for k, v in overrides.items():
            if v is not None and hasattr(cfg, k):
                setattr(cfg, k, v)
        return cfg


    # ---------------------------------------------------------------------------
    # Attribute helpers
    # ---------------------------------------------------------------------------
    def _fix(node, name: str, s: str) -> None:
        """Fixed-length ASCII |S attr (reference-faithful; avoid h5py vlen UTF-8)."""
        b = s.encode("ascii", "replace")
        node.attrs.create(name, np.bytes_(b), dtype=np.dtype(f"S{max(1, len(b))}"))


    def _pair(node, name: str, value: float, unit: str) -> None:
        """float64 value + '.unit' sibling (GaugeLength / GaugeLength.uom pattern)."""
        node.attrs.create(name, np.float64(value))
        _fix(node, name + ".unit", unit)


    def _uuid() -> str:
        return str(uuid.uuid4())


    def _iso(ns: int) -> str:
        """ISO-8601 micros + UTC → 32 chars → |S32."""
        dt = datetime(1970, 1, 1, tzinfo=timezone.utc) + timedelta(microseconds=ns // 1000)
        return dt.strftime("%Y-%m-%dT%H:%M:%S.%f") + "+00:00"


    def _iso_compact(ns: int) -> str:
        """Filename component YYYYMMDDTHHMMSS (UTC)."""
        dt = datetime(1970, 1, 1, tzinfo=timezone.utc) + timedelta(microseconds=ns // 1000)
        return dt.strftime("%Y%m%dT%H%M%S")


    def _gname(base: str, index: int, style: GroupStyle) -> str:
        if style == "brackets":
            return f"{base}[{index}]"
        return f"{base}_{index}"


    # ---------------------------------------------------------------------------
    # Signal model
    # ---------------------------------------------------------------------------
    def synth_signal(n_series: int, n_time: int, rng: np.random.Generator, dtype: str) -> np.ndarray:
        """Spatio-temporal structure for datashader (baseline + periodic + cascades).

        Cascades model CPHY phenomena: correlated anomalies propagating along a
        contiguous band of series (sensor chain / conduit segment / joint group).
        """
        t = np.arange(n_time, dtype=np.float32)
        base_level = rng.uniform(40, 120, size=(n_series, 1)).astype(np.float32)
        sig = base_level + rng.normal(0, 8, size=(n_series, n_time)).astype(np.float32)

        n_cycles = float(rng.uniform(2, 6))
        phase = rng.uniform(0, 2 * np.pi, size=(n_series, 1)).astype(np.float32)
        sig += 15.0 * np.sin(2 * np.pi * n_cycles * t / max(n_time, 1) + phase).astype(np.float32)

        n_events = max(1, int(n_series * n_time / 5_000_000) + int(rng.integers(1, 4)))
        for _ in range(n_events):
            s0 = int(rng.integers(0, n_series))
            band = int(rng.integers(20, max(21, n_series // 8)))
            t0 = int(rng.integers(0, n_time))
            offset = float(rng.uniform(0.2, 2.0))
            width = int(rng.integers(30, 200))
            amp = float(rng.uniform(60, 200))
            for k in range(band):
                s = s0 + k
                if s >= n_series:
                    break
                c = int(t0 + k * offset)
                lo, hi = max(0, c - width), min(n_time, c + width)
                if lo >= hi:
                    continue
                env = amp * np.exp(-((np.arange(lo, hi) - c) ** 2) / (2 * (width / 3.0) ** 2))
                sig[s, lo:hi] += env.astype(np.float32)

        if np.dtype(dtype).kind in ("i", "u"):
            info = np.iinfo(dtype)
            sig = np.clip(np.rint(sig), info.min, info.max)
        return sig.astype(dtype)


    # ---------------------------------------------------------------------------
    # HDF5 writer
    # ---------------------------------------------------------------------------
    def _create_values_dataset(group, name: str, shape, dtype: str, chunks):
        """Primary 2D array. chunks=None → CONTIGUOUS (reference / Iceberg-friendly)."""
        if chunks is None:
            return group.create_dataset(name, shape=tuple(shape), dtype=np.dtype(dtype))
        space = h5py.h5s.create_simple(tuple(shape))
        dcpl = h5py.h5p.create(h5py.h5p.DATASET_CREATE)
        dcpl.set_chunk(tuple(chunks))
        dcpl.set_fill_time(h5py.h5d.FILL_TIME_NEVER)
        tid = h5py.h5t.py_create(np.dtype(dtype), logical=True)
        dsid = h5py.h5d.create(group.id, name.encode("utf-8"), tid, space, dcpl)
        return h5py.Dataset(dsid)


    def part_time_bounds(cfg: GenConfig, part_idx: int) -> tuple[int, int, int]:
        """Return (start_ns, end_ns, step_ns) for a part (always computed in ns)."""
        step_ns = int(round(cfg.sampling_interval_ms * 1_000_000))
        if step_ns < 1:
            step_ns = 1
        if cfg.base_time is not None:
            base_ns = int(cfg.base_time.replace(tzinfo=timezone.utc).timestamp() * 1e9)
        else:
            base_ns = int(datetime.now(timezone.utc).timestamp() * 1e9)
        # Align base to whole seconds for clean filenames
        base_ns = (base_ns // 1_000_000_000) * 1_000_000_000
        start_ns = base_ns + part_idx * cfg.n_time * step_ns
        end_ns = start_ns + cfg.n_time * step_ns
        return start_ns, end_ns, step_ns


    def timestamps_array(start_ns: int, n_time: int, step_ns: int, time_unit: TimeUnit) -> np.ndarray:
        """1D int64 index in ns (default) or µs."""
        if time_unit == "us":
            start = start_ns // 1000
            step = max(1, step_ns // 1000)
            return start + np.arange(n_time, dtype=np.int64) * step
        return start_ns + np.arange(n_time, dtype=np.int64) * step_ns


    def part_filename(cfg: GenConfig, part_idx: int, start_ns: int) -> str:
        """otelcphy_<YYYYMMDDTHHMMSS>_<part>Z.h5"""
        return f"{cfg.product}_{_iso_compact(start_ns)}_{part_idx:04d}Z.h5"


    def hive_key(cfg: GenConfig, part_idx: int, start_ns: int, filename: str) -> str:
        """Relative key under bucket (no leading slash)."""
        if not cfg.hive_layout:
            return filename
        dt = datetime(1970, 1, 1, tzinfo=timezone.utc) + timedelta(microseconds=start_ns // 1000)
        return (
            f"datasets/hdf5/{cfg.product}/"
            f"service={cfg.service_name}/"
            f"date={dt.strftime('%Y-%m-%d')}/"
            f"hour={dt.strftime('%H')}/"
            f"{filename}"
        )


    def structural_fingerprint(cfg: GenConfig, collection_uuid: str) -> str:
        """Idempotency key: layout geometry + uuid (not payload bytes)."""
        payload = json.dumps(
            {
                "uuid": collection_uuid,
                "n_series": cfg.n_series,
                "n_time": cfg.n_time,
                "dtype": cfg.dtype,
                "contiguous": cfg.contiguous,
                "time_unit": cfg.time_unit,
                "group_style": cfg.group_style,
                "schema": SCHEMA_VERSION,
            },
            sort_keys=True,
        )
        return hashlib.sha256(payload.encode()).hexdigest()[:16]


    def write_part(
        path: str,
        part_idx: int,
        cfg: GenConfig,
        rng: np.random.Generator,
    ) -> dict[str, Any]:
        """Write one acquisition-window HDF5 file. Returns inventory metadata."""
        n_series, n_time = cfg.n_series, cfg.n_time
        chunks = (
            None
            if cfg.contiguous
            else (min(cfg.chunk_series, n_series), min(cfg.chunk_time, n_time))
        )
        start_ns, end_ns, step_ns = part_time_bounds(cfg, part_idx)
        si_s = cfg.sampling_interval_ms / 1000.0
        declared_hz = cfg.sample_rate_hz_declared or (1.0 / si_s if si_s else 0.0)

        collection_uuid = _uuid()
        collection_id = _uuid()
        metric_uuid = _uuid()
        layout = "contiguous" if cfg.contiguous else "chunked"

        with h5py.File(path, "w", libver="latest") as f:
            # --- root -------------------------------------------------------------
            _fix(f, "collection.uuid", collection_uuid)
            _fix(f, "product", cfg.product)
            _fix(f, "domain", "cphy")

            # --- ResourceMetrics (≈ Acquisition physics) --------------------------
            rm = f.create_group("ResourceMetrics")
            _pair(rm, "collection.interval", si_s * n_time, "s")  # window duration
            _pair(rm, "export.timeout", float(cfg.export_timeout_s), "s")
            _pair(rm, "sample.rate.max", float(declared_hz), "Hz")
            _pair(rm, "sample.rate.min", 0.0, "Hz")
            _pair(rm, "batch.flush.latency", float(rng.uniform(1.0, 9.0)), "ms")
            _pair(rm, "spatial.resolution", float(cfg.spatial_resolution), "m")
            _pair(rm, "sensing.span", float(cfg.sensing_span), "m")
            rm.attrs.create("series.count", np.int64(n_series))
            rm.attrs.create("start.series.index", np.int64(cfg.start_series_index))
            rm.attrs.create("aggregation.temporality.is_delta", np.bool_(False))
            _fix(rm, "schema.url", OTEL_SCHEMA_URL)
            _fix(rm, "collection.id", collection_id)
            _fix(rm, "service.name", cfg.service_name)
            _fix(rm, "service.instance.id", _uuid())
            _fix(rm, "start.time", _iso(start_ns))
            _fix(rm, "end.time", _iso(end_ns))
            _fix(rm, "otel.schema.version", SCHEMA_VERSION)
            _fix(rm, "band.low", "0")
            _fix(rm, "band.high", "5000")
            _fix(rm, "band.high.unit", "Hz")

            # --- Scope (instrumentation / collector config) -----------------------
            scope = rm.create_group("Scope")
            scope.attrs.create("batch.max.size", np.int32(cfg.batch_max_size))
            scope.attrs.create("queue.capacity", np.int32(2048))
            scope.attrs.create("export.retry.count", np.int32(5))
            scope.attrs.create("sampling.ratio", np.float64(1.0))
            scope.attrs.create("compression.ratio", np.float64(1.0))  # contiguous: none
            scope.attrs.create("data.transposed", np.bool_(True))  # series-major
            scope.attrs.create("layout.series_major", np.bool_(True))
            scope.attrs.create("values.relative", np.bool_(False))
            scope.attrs.create("temporal.downsampling", np.int32(1))
            scope.attrs.create("instrument.channels", np.int32(4))
            _fix(scope, "telemetry.sdk.name", "opentelemetry")
            _fix(scope, "telemetry.sdk.language", "python")
            _fix(scope, "instrument.serial", f"CPHY-{rng.integers(1000, 9999)}")
            _fix(scope, "instrument.model", "cphy-collector")

            win_dt = np.dtype([("StartSeries", "<i4"), ("EndSeries", "<i4"), ("Stride", "<i4")])
            # A few zone windows along series axis
            n_win = max(1, min(8, n_series // 32))
            edges = np.linspace(0, n_series, n_win + 1).astype(np.int32)
            windows = np.zeros(n_win, dtype=win_dt)
            windows["StartSeries"], windows["EndSeries"], windows["Stride"] = edges[:-1], edges[1:], 1
            scope.create_dataset("Windows", data=windows)

            # --- Resource_0 (site geometry / series position map) -----------------
            res = rm.create_group(_gname("Resource", 0, cfg.group_style))
            _fix(res, "resource.schema.url", OTEL_SCHEMA_URL)
            _fix(res, "service.namespace", cfg.service_namespace)
            _fix(res, "host.name", cfg.service_name + "-host")
            _fix(res, "host.arch", "amd64")
            _fix(res, "reference.datum", "site-origin")

            anchor_dt = np.dtype(
                [
                    ("SeriesIndex", "<i8"),
                    ("PathDistance", "<f8"),
                    ("SiteLength", "<f8"),
                ]
            )
            for ai, note in enumerate(("AnchorPair", "AllSeries")):
                sa = res.create_group(_gname("SeriesAnchor", ai, cfg.group_style))
                _fix(sa, "scope.note", note)
                _fix(sa, "reference.frame", "collection-start")
                _pair(sa, "distance.scale", 1.0, "m")
                npts = 2 if ai == 0 else n_series
                anchor = np.zeros(npts, dtype=anchor_dt)
                # Absolute series indices (acquisition start + offset within window)
                abs_idx = cfg.start_series_index + np.linspace(0, n_series - 1, npts)
                anchor["SeriesIndex"] = abs_idx.astype(np.int64)
                anchor["PathDistance"] = abs_idx * cfg.spatial_resolution
                anchor["SiteLength"] = abs_idx * cfg.spatial_resolution
                sa.create_dataset("SeriesPosition", data=anchor)

            # --- Metric_0 (payload sub-window of the full series range) -----------
            met = rm.create_group(_gname("Metric", 0, cfg.group_style))
            met.attrs.create("series.count", np.int64(n_series))
            # Sub-window: deliberately ≠ ResourceMetrics.start.series.index
            met.attrs.create("start.series.index", np.int64(cfg.metric_start_series_index))
            _pair(met, "output.data.rate", float(declared_hz), "Hz")
            met.attrs.create("scale.factor", np.float64(cfg.scale_factor))
            _fix(
                met,
                "scale.note",
                f"int16 full-scale encoding via scale.factor={cfg.scale_factor}",
            )
            _fix(met, "value.unit", cfg.value_unit)
            _fix(met, "metric.uuid", metric_uuid)
            _fix(met, "metric.name", "cphy.acquisition.signal")

            values = _create_values_dataset(met, "Values", (n_series, n_time), cfg.dtype, chunks)
            stripe = chunks[0] if chunks else max(1, min(n_series, 1024))
            for s0 in range(0, n_series, stripe):
                s1 = min(s0 + stripe, n_series)
                values[s0:s1, :] = synth_signal(s1 - s0, n_time, rng, cfg.dtype)
            values.attrs.create("count", np.int64(n_series) * np.int64(n_time))
            values.attrs.create("start.index", np.int64(0))
            _fix(values, "dimensions", "series,time")
            _fix(values, "part.start.time", _iso(start_ns))
            _fix(values, "part.end.time", _iso(end_ns))
            values.attrs.create("layout.contiguous", np.bool_(cfg.contiguous))

            ts_data = timestamps_array(start_ns, n_time, step_ns, cfg.time_unit)
            ts = met.create_dataset("Timestamps", data=ts_data)
            ts.attrs.create("count", np.int64(n_time))
            ts.attrs.create("start.index", np.int64(part_idx * n_time))  # multi-part stitch
            _fix(ts, "part.start.time", _iso(start_ns))
            _fix(ts, "part.end.time", _iso(end_ns))
            _fix(ts, "start.time", _iso(start_ns))
            _fix(ts, "unit", cfg.time_unit)

        size = os.path.getsize(path)
        fname = part_filename(cfg, part_idx, start_ns)
        key = hive_key(cfg, part_idx, start_ns, fname)
        fp = structural_fingerprint(cfg, collection_uuid)
        t_min_ns, t_max_ns = start_ns, end_ns - step_ns
        return {
            "dataset_uuid": collection_uuid,
            "metric_uuid": metric_uuid,
            "collection_id": collection_id,
            "fingerprint": fp,
            "part_idx": part_idx,
            "filename": fname,
            "key": key,
            "local_path": path,
            "size_bytes": size,
            "layout": layout,
            "n_series": n_series,
            "n_time": n_time,
            "dtype": cfg.dtype,
            "t_min_ns": t_min_ns,
            "t_max_ns": t_max_ns,
            "time_unit": cfg.time_unit,
            "service_name": cfg.service_name,
            "start_series_index": cfg.start_series_index,
            "metric_start_series_index": cfg.metric_start_series_index,
        }


    # ---------------------------------------------------------------------------
    # Sinks
    # ---------------------------------------------------------------------------
    def emit_kerchunk(local_path: str, out_json: str, url: str | None = None):
        """Write a kerchunk reference so datasets read as virtual Zarr ranges."""
        try:
            from kerchunk.hdf import SingleHdf5ToZarr
        except ImportError:
            print("  kerchunk not installed; skipping reference (uv run --with kerchunk ...)")
            return None
        with open(local_path, "rb") as fo:
            refs = SingleHdf5ToZarr(fo, url=url or local_path, inline_threshold=0).translate()
        with open(out_json, "w") as f:
            json.dump(refs, f)
        return out_json


    def upload_s3(
        local_path: str,
        bucket: str,
        key: str,
        endpoint: str | None,
        access_key: str | None = None,
        secret_key: str | None = None,
    ) -> str:
        import boto3
        from botocore.client import Config

        kwargs: dict[str, Any] = {
            "endpoint_url": endpoint,
            "config": Config(signature_version="s3v4", s3={"addressing_style": "path"}),
            "region_name": os.environ.get("AWS_REGION", os.environ.get("S3_REGION", "us-east-1")),
        }
        ak = access_key or os.environ.get("AWS_ACCESS_KEY_ID")
        sk = secret_key or os.environ.get("AWS_SECRET_ACCESS_KEY")
        if ak and sk:
            kwargs["aws_access_key_id"] = ak
            kwargs["aws_secret_access_key"] = sk
        boto3.client("s3", **kwargs).upload_file(local_path, bucket, key)
        return f"s3://{bucket}/{key}"


    def generate_parts(
        cfg: GenConfig,
        out: str,
        *,
        s3_endpoint: str | None = None,
        emit_kerchunk_refs: bool = False,
        dry_run: bool = False,
        progress_every: int = 1,
    ) -> list[dict[str, Any]]:
        """Generate all parts to local dir or s3://bucket[/prefix].

        For s3:// URLs the hive key is absolute under the bucket (cfg.hive_layout).
        If out is s3://bucket/some/prefix and hive_layout is True, keys still use
        the standard datasets/hdf5/... tree (prefix in URL is ignored for key root
        to keep Iceberg layout consistent). Pass hive_layout=False to place files
        directly under the URL path.
        """
        is_s3 = out.startswith("s3://")
        if is_s3:
            u = urlparse(out)
            bucket, url_prefix = u.netloc, u.path.lstrip("/")
            if url_prefix and not url_prefix.endswith("/"):
                url_prefix += "/"
            workdir = tempfile.mkdtemp(prefix="hdf5-cphy-")
        else:
            bucket, url_prefix = "", ""
            workdir = out
            os.makedirs(workdir, exist_ok=True)

        print(
            f"Profile geometry: {cfg.n_parts} parts × {cfg.n_series}×{cfg.n_time} "
            f"{cfg.dtype} ≈ {cfg.estimated_values_bytes() / 1e6:.1f} MB Values "
            f"({cfg.estimated_values_tib():.3f} TiB)  layout="
            f"{'contiguous' if cfg.contiguous else 'chunked'}  time_unit={cfg.time_unit}"
        )
        if dry_run:
            start_ns, _, _ = part_time_bounds(cfg, 0)
            fname = part_filename(cfg, 0, start_ns)
            print(f"Dry-run sample key: {hive_key(cfg, 0, start_ns, fname)}")
            print(f"Out: {out}")
            return []

        inventory: list[dict[str, Any]] = []
        for i in range(cfg.n_parts):
            rng = np.random.default_rng(cfg.seed + i)
            start_ns, _, _ = part_time_bounds(cfg, i)
            fname = part_filename(cfg, i, start_ns)
            local = os.path.join(workdir, fname)
            meta = write_part(local, i, cfg, rng)

            if is_s3:
                key = meta["key"] if cfg.hive_layout else f"{url_prefix}{fname}"
                uri = upload_s3(local, bucket, key, s3_endpoint)
                meta["uri"] = uri
                meta["key"] = key
                if emit_kerchunk_refs:
                    ref_local = local + ".kerchunk.json"
                    if emit_kerchunk(local, ref_local, url=uri):
                        ref_key = f"indexes/kerchunk/{meta['fingerprint']}.json"
                        upload_s3(ref_local, bucket, ref_key, s3_endpoint)
                        meta["ref_uri"] = f"s3://{bucket}/{ref_key}"
                try:
                    os.remove(local)
                except OSError:
                    pass
            else:
                # Local hive dirs
                if cfg.hive_layout:
                    dest = os.path.join(workdir, meta["key"])
                    os.makedirs(os.path.dirname(dest), exist_ok=True)
                    if dest != local:
                        os.replace(local, dest)
                        meta["local_path"] = dest
                meta["uri"] = f"file://{meta['local_path']}"
                if emit_kerchunk_refs:
                    ref_path = meta["local_path"] + ".kerchunk.json"
                    if emit_kerchunk(meta["local_path"], ref_path, url=meta["uri"]):
                        meta["ref_uri"] = f"file://{ref_path}"

            inventory.append(meta)
            if (i + 1) % max(1, progress_every) == 0 or i == 0:
                print(
                    f"  [{i + 1}/{cfg.n_parts}] {meta.get('filename')}  "
                    f"({meta['size_bytes'] / 1e6:.2f} MB) → {meta.get('uri', meta.get('key'))}"
                )

        print(f"Done. {len(inventory)} file(s).")
        return inventory


    def inventory_to_pointer_rows(inventory: list[dict[str, Any]]) -> list[dict[str, Any]]:
        """Shape inventory as telemetry.hdf5_datasets pointer-table rows."""
        rows = []
        for m in inventory:
            rows.append(
                {
                    "dataset_uuid": m["dataset_uuid"],
                    "fingerprint": m["fingerprint"],
                    "uri": m.get("uri", m.get("key")),
                    "size_bytes": m["size_bytes"],
                    "layout": m["layout"],
                    "n_series": m["n_series"],
                    "n_time": m["n_time"],
                    "dtype": m["dtype"],
                    "t_min_ns": m["t_min_ns"],
                    "t_max_ns": m["t_max_ns"],
                    "ref_uri": m.get("ref_uri"),
                    "service_name": m.get("service_name"),
                    "part_idx": m["part_idx"],
                }
            )
        return rows


    # ---------------------------------------------------------------------------
    # CLI
    # ---------------------------------------------------------------------------
    def main():
        p = argparse.ArgumentParser(
            description="Generate CPHY/OTel-framed HDF5 acquisition windows for Iceberg-ready layout testing."
        )
        p.add_argument(
            "--profile",
            choices=["lab", "lab_tiny", "airgap_2tb", "custom"],
            default="lab",
            help="lab (~10 GiB RAID) | lab_tiny (~6 MiB) | airgap_2tb (~2 TiB) | custom",
        )
        p.add_argument("--out", required=True, help="Output dir or s3://bucket[/prefix]")
        p.add_argument("--n-series", type=int, default=None)
        p.add_argument("--n-time", type=int, default=None)
        p.add_argument("--n-parts", type=int, default=None)
        p.add_argument("--chunk-series", type=int, default=512)
        p.add_argument("--chunk-time", type=int, default=2048)
        p.add_argument("--contiguous", action="store_true", default=None)
        p.add_argument("--chunked", action="store_true", help="Force chunked layout")
        p.add_argument("--sampling-interval-ms", type=float, default=None)
        p.add_argument("--dtype", default=None)
        p.add_argument("--service-name", default=None)
        p.add_argument("--service-namespace", default=None)
        p.add_argument("--time-unit", choices=["ns", "us"], default="ns")
        p.add_argument("--group-style", choices=["underscore", "brackets"], default="underscore")
        p.add_argument("--seed", type=int, default=0)
        p.add_argument("--emit-kerchunk", action="store_true")
        p.add_argument("--no-hive", action="store_true", help="Flat keys under --out prefix")
        p.add_argument("--dry-run", action="store_true")
        p.add_argument("--s3-endpoint", default=os.environ.get("S3_ENDPOINT") or None)
        p.add_argument("--progress-every", type=int, default=1)
        args = p.parse_args()

        overrides: dict[str, Any] = {
            "time_unit": args.time_unit,
            "group_style": args.group_style,
            "seed": args.seed,
            "chunk_series": args.chunk_series,
            "chunk_time": args.chunk_time,
            "hive_layout": not args.no_hive,
        }
        for key, attr in [
            ("n_series", "n_series"),
            ("n_time", "n_time"),
            ("n_parts", "n_parts"),
            ("sampling_interval_ms", "sampling_interval_ms"),
            ("dtype", "dtype"),
            ("service_name", "service_name"),
            ("service_namespace", "service_namespace"),
        ]:
            val = getattr(args, attr.replace("-", "_") if False else attr, None)
            # argparse uses underscores
            pass
        if args.n_series is not None:
            overrides["n_series"] = args.n_series
        if args.n_time is not None:
            overrides["n_time"] = args.n_time
        if args.n_parts is not None:
            overrides["n_parts"] = args.n_parts
        if args.sampling_interval_ms is not None:
            overrides["sampling_interval_ms"] = args.sampling_interval_ms
        if args.dtype is not None:
            overrides["dtype"] = args.dtype
        if args.service_name is not None:
            overrides["service_name"] = args.service_name
        if args.service_namespace is not None:
            overrides["service_namespace"] = args.service_namespace
        if args.chunked:
            overrides["contiguous"] = False
        elif args.contiguous:
            overrides["contiguous"] = True

        if args.profile == "custom":
            cfg = GenConfig(**{k: v for k, v in overrides.items() if v is not None})
        else:
            cfg = profile_config(args.profile, **overrides)

        if args.profile in PROFILES:
            print(f"Profile {args.profile}: {PROFILES[args.profile]['description']}")

        inv = generate_parts(
            cfg,
            args.out,
            s3_endpoint=args.s3_endpoint,
            emit_kerchunk_refs=args.emit_kerchunk,
            dry_run=args.dry_run,
            progress_every=args.progress_every,
        )
        if inv:
            rows = inventory_to_pointer_rows(inv)
            inv_path = None
            if not args.out.startswith("s3://"):
                inv_path = os.path.join(args.out, "_inventory.json")
                with open(inv_path, "w") as f:
                    json.dump(rows, f, indent=2)
                print(f"Pointer-table preview: {inv_path} ({len(rows)} rows)")


    if __name__ == "__main__":
        main()

