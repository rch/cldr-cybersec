    {"cells":[{"cell_type":"markdown","metadata":{},"source":"<cell_type>markdown</cell_type># Dask Out-of-Core S3 Validation (30 GB)\n\nThis notebook validates Dask out-of-core processing with a **30 GB dataset** stored in S3.\n\n**Key demonstration**: Processing 60 million spans (30 GB expanded) with a cluster that has\nonly 2-8 GB of memory, proving true out-of-core streaming capabilities.\n\n**Note**: This notebook is read-only from ConfigMap. To edit:\n```python\nimport shutil\nshutil.copy('/home/jovyan/sample-notebooks/Dask_S3_Validation.ipynb', '/home/jovyan/')\n```"},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Imports\n","import os\n","import uuid\n","from datetime import datetime, timezone\n","\n","# Air-gap: embed Bokeh JS (no cdn.bokeh.org). Keep kernel comms for zoom callbacks.\n","os.environ.setdefault(\"BOKEH_RESOURCES\", \"inline\")\n","\n","import numpy as np\n","import pandas as pd\n","import pyarrow as pa\n","import pyarrow.parquet as pq\n","import s3fs\n","import dask.dataframe as dd\n","from dask.distributed import Client\n","\n","import holoviews as hv\n","\n","# Holoviews 1.23 Image validation is picky when datashader supplies both\n","# coordinates *and* bounds (float edge mismatch → ValueError on DynamicMap).\n","hv.config.image_rtol = 1.0  # tolerate edge float noise; display extents still from data\n","\n","hv.extension(\"bokeh\", inline=True)\n","\n","try:\n","    import panel as pn\n","    pn.extension()\n","    _HAS_PANEL = True\n","except Exception as _e:\n","    _HAS_PANEL = False\n","    print(\"panel unavailable:\", _e, \"— interactive zoom re-agg may be limited\")\n","\n","\n","def show(obj, **kwargs):\n","    \"\"\"Prefer Panel so DynamicMap zoom callbacks reach the kernel (no jupyter_bokeh).\"\"\"\n","    if _HAS_PANEL:\n","        return pn.panel(obj, **kwargs)\n","    return obj\n","\n","\n","def image_from_agg(agg, kdims, vdim=\"count\"):\n","    \"\"\"Build hv.Image from a datashader/xarray aggregate using *coordinates only*.\n","\n","    Never pass separate ``bounds=`` — that is what triggers:\n","    ``Supplied Image bounds do not match the coordinates defined in the data``.\n","    \"\"\"\n","    import xarray as xr\n","\n","    if hasattr(agg, \"compute\"):\n","        agg = agg.compute()\n","    if isinstance(agg, xr.Dataset):\n","        # pick first data var\n","        name = list(agg.data_vars)[0]\n","        da = agg[name]\n","    else:\n","        da = agg\n","        name = getattr(da, \"name\", None) or vdim\n","    # datashader: dims are typically (y_dim, x_dim)\n","    ydim, xdim = da.dims[0], da.dims[1]\n","    ys = np.asarray(da.coords[ydim].values, dtype=np.float64)\n","    xs = np.asarray(da.coords[xdim].values, dtype=np.float64)\n","    arr = np.ascontiguousarray(np.asarray(da.values, dtype=np.float64))\n","    # Replace non-finite (empty bins) so Image ctor is happy\n","    arr = np.nan_to_num(arr, nan=0.0, posinf=0.0, neginf=0.0)\n","    if arr.shape != (ys.size, xs.size):\n","        # transpose if needed\n","        if arr.shape == (xs.size, ys.size):\n","            arr = arr.T\n","        else:\n","            raise ValueError(f\"agg shape {arr.shape} vs coords ys={ys.size} xs={xs.size}\")\n","    return hv.Image(\n","        (xs, ys, arr),\n","        kdims=list(kdims),\n","        vdims=[vdim],\n","        rtol=1.0,\n","    )\n","\n","\n","print(\"Using AWS credential chain (IAM role / env vars / credentials file)\")\n","print(f\"hv inline=True  panel={_HAS_PANEL}  image_rtol={hv.config.image_rtol}\")\n","\n","# --- Cluster config (JupyterHub extraEnv from zarf/converge — no secret hard-codes) ---\n","import os, sys\n","for _p in (\"/root/sample-notebooks\", \"/app\", \"/root\"):\n","    if _p not in sys.path:\n","        sys.path.insert(0, _p)\n","try:\n","    from cluster_env import load_cluster_config, load_active_spans_ddf\n","    CFG = load_cluster_config()\n","    print(CFG.summary())\n","except ImportError as _e:\n","    print(\"cluster_env not mounted — using os.environ fallback:\", _e)\n","    from types import SimpleNamespace\n","    _bucket = os.getenv(\"S3_BUCKET\", \"cyberphy\")\n","    _ep = os.getenv(\"S3_ENDPOINT\", \"\")\n","    _reg = os.getenv(\"AWS_REGION\", os.getenv(\"S3_REGION\", \"us-east-1\"))\n","    _path = os.getenv(\"OTEL_DATA_PATH\", f\"s3://{_bucket}/\")\n","    _pref = os.getenv(\"OTEL_PREFIX\", \"\")\n","    if not _pref and _path.startswith(\"s3://\"):\n","        _rest = _path[5:].strip(\"/\")\n","        if \"/\" in _rest:\n","            _pref = _rest.split(\"/\", 1)[1]\n","    def _storage_options():\n","        o = {\"anon\": False, \"key\": os.getenv(\"AWS_ACCESS_KEY_ID\") or None,\n","             \"secret\": os.getenv(\"AWS_SECRET_ACCESS_KEY\") or None,\n","             \"token\": os.getenv(\"AWS_SESSION_TOKEN\") or None}\n","        if _ep:\n","            o[\"client_kwargs\"] = {\"endpoint_url\": _ep, \"region_name\": _reg}\n","            o[\"config_kwargs\"] = {\"s3\": {\"addressing_style\": \"path\"}, \"signature_version\": \"s3v4\"}\n","        return o\n","    def _connect_dask():\n","        from dask.distributed import Client\n","        return Client(os.getenv(\"DASK_SCHEDULER_ADDRESS\", \"tcp://cybersec-dask-scheduler.dask.svc.cluster.local:8786\"))\n","    CFG = SimpleNamespace(\n","        s3_bucket=_bucket, s3_endpoint=_ep, s3_region=_reg, otel_data_path=_path,\n","        otel_prefix=_pref,\n","        dask_scheduler=os.getenv(\"DASK_SCHEDULER_ADDRESS\", \"tcp://cybersec-dask-scheduler.dask.svc.cluster.local:8786\"),\n","        use_dask=True, hdf5_profile=os.getenv(\"HDF5_PROFILE\", \"lab\"),\n","        storage_options=_storage_options, connect_dask=_connect_dask,\n","        dataset_root_key=f\"{_bucket}/{_pref}\".strip(\"/\"),\n","        spans_prefix_s3=f\"s3://{_bucket}/{_pref}/spans/\".replace(\"//spans\", \"/spans\") if _pref else f\"s3://{_bucket}/spans/\",\n","        summary=lambda: f\"fallback CFG bucket={_bucket} endpoint={_ep or 'AWS'} prefix={_pref}\",\n","    )\n","    def load_active_spans_ddf(cfg=None, columns=None, require_dask=True):\n","        import dask.dataframe as dd, s3fs\n","        cfg = cfg or CFG\n","        fs = s3fs.S3FileSystem(**cfg.storage_options())\n","        spans = f\"{cfg.dataset_root_key}/spans\"\n","        files = []\n","        for pat in (f\"{spans}/date=*/hour=*/*.parquet\", f\"{spans}/date=*/*.parquet\", f\"{spans}/shard=*/date=*/*.parquet\"):\n","            hits = [h for h in (fs.glob(pat) or []) if str(h).endswith(\".parquet\")]\n","            if hits:\n","                files = hits; break\n","        if not files and fs.exists(spans):\n","            files = [e for e in fs.find(spans) if str(e).endswith(\".parquet\")]\n","        if not files:\n","            raise FileNotFoundError(f\"no parquet under s3://{spans}/\")\n","        uris = [f\"s3://{f}\" if not str(f).startswith(\"s3://\") else f for f in files]\n","        return dd.read_parquet(uris, storage_options=cfg.storage_options(), columns=columns, engine=\"pyarrow\")\n","    print(CFG.summary() if callable(CFG.summary) else CFG.summary)\n"]},{"cell_type":"markdown","metadata":{},"source":["## 1. Connect to Dask Cluster"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Connect to in-cluster Dask (scheduler address from JupyterHub env / converge)\n","client = CFG.connect_dask() if hasattr(CFG, \"connect_dask\") and callable(CFG.connect_dask) else __import__(\"dask.distributed\", fromlist=[\"Client\"]).Client(CFG.dask_scheduler)\n","print(f\"Dashboard: {client.dashboard_link}\")\n","print(f\"Workers: {len(client.scheduler_info().get('workers', {}))}\")\n","client\n"]},{"cell_type":"markdown","metadata":{},"source":["## 2. Configure S3 Access"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# S3 via cluster_env / JupyterHub env (converge --creds-file → zarf → singleuser)\n","import s3fs\n","s3_opts = CFG.storage_options() if callable(getattr(CFG, \"storage_options\", None)) else CFG.storage_options\n","s3 = s3fs.S3FileSystem(**s3_opts)\n","bucket_name = CFG.s3_bucket\n","# Default prefix matches field panel OTEL_DATA_PATH (…/otel-notebook/), NOT validation-30gb\n","data_prefix = (getattr(CFG, \"otel_prefix\", None) or os.getenv(\"OTEL_PREFIX\") or \"otel-notebook\").strip(\"/\")\n","spans_uri = getattr(CFG, \"spans_prefix_s3\", None) or f\"s3://{bucket_name}/{data_prefix}/spans/\"\n","print(f\"Endpoint: {CFG.s3_endpoint or 'AWS default'}\")\n","print(f\"Bucket:   {bucket_name}\")\n","print(f\"Prefix:   {data_prefix}\")\n","print(f\"Spans:    {spans_uri}\")\n","print(\"  ⚠ Analytics default to this spans/ tree (partitioned).\")\n","print(\"  ⚠ validation-30gb / validation-dask is OPTIONAL synthetic stress only.\")\n","try:\n","    contents = s3.ls(bucket_name)\n","    print(f\"Bucket listing (top): {contents[:12]}{'…' if len(contents) > 12 else ''}\")\n","except Exception as e:\n","    print(f\"Bucket list warning: {e}\")\n"]},{"cell_type":"markdown","metadata":{},"source":"<cell_type>markdown</cell_type>## 3. Generate Large Synthetic Dataset (Idempotent)\n\nWe generate a **30 GB dataset** (expanded memory) to validate true out-of-core processing.\nEach span includes additional attributes (~500 bytes/row in memory).\n\n**Dataset Configuration:**\n- Target: 30 GB expanded memory footprint\n- Spans: ~60 million\n- Partitions: 600 (100K spans each)\n- Disk: ~6-8 GB (Parquet compressed with Snappy)\n\nThis dataset is typically **10-30× larger than cluster memory**, guaranteeing\nthat Dask must use streaming/out-of-core processing."},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Data source selection — PATH config, not schema\n","# Field failure mode: loading s3://…/validation-30gb/*.parquet (empty) → columns=[]\n","# looks like \"schema drift\" but is bucket/path drift. Real data:\n","#   s3://$S3_BUCKET/$OTEL_PREFIX/spans/date=*/hour=*/*.parquet\n","import os\n","\n","BYTES_PER_SPAN = 500\n","TOTAL_SPANS = int(os.getenv(\"VALIDATION_SPANS\", \"5000000\"))\n","SPANS_PER_PARTITION = int(os.getenv(\"VALIDATION_SPANS_PER_PART\", \"100000\"))\n","NUM_PARTITIONS = max(1, (TOTAL_SPANS + SPANS_PER_PARTITION - 1) // SPANS_PER_PARTITION)\n","NUM_SERVICES = 20\n","TARGET_MEMORY_BYTES = TOTAL_SPANS * BYTES_PER_SPAN\n","TARGET_MEMORY_GB = TARGET_MEMORY_BYTES / 1e9\n","\n","scheduler_info = client.scheduler_info()\n","total_worker_memory = sum(w[\"memory_limit\"] for w in scheduler_info[\"workers\"].values()) or 1\n","num_workers = len(scheduler_info[\"workers\"])\n","memory_ratio = TARGET_MEMORY_BYTES / total_worker_memory\n","\n","# Default: USE active dataset under otel-notebook/spans (or OTEL_DATA_PATH).\n","# Opt-in synthetic path only: GENERATE_SYNTHETIC=1 (writes validation-dask/).\n","GENERATE_SYNTHETIC = os.getenv(\"GENERATE_SYNTHETIC\", \"0\").lower() in (\"1\", \"true\", \"yes\")\n","USE_ACTIVE_SPANS = not GENERATE_SYNTHETIC  # inverted default vs old USE_ACTIVE_SPANS=0\n","# Allow explicit override\n","if os.getenv(\"USE_ACTIVE_SPANS\", \"\").lower() in (\"0\", \"false\", \"no\"):\n","    USE_ACTIVE_SPANS = False\n","if os.getenv(\"USE_ACTIVE_SPANS\", \"\").lower() in (\"1\", \"true\", \"yes\"):\n","    USE_ACTIVE_SPANS = True\n","\n","validation_path = f\"{bucket_name}/{data_prefix}/validation-dask\"  # optional synthetic only\n","active_spans_key = f\"{bucket_name}/{data_prefix}/spans\"\n","\n","print(\"=\" * 60)\n","print(\"DATASET PATH (config — not schema)\")\n","print(\"=\" * 60)\n","print(f\"  Active spans key:  s3://{active_spans_key}/\")\n","print(f\"  Synthetic path:    s3://{validation_path}/  (only if GENERATE_SYNTHETIC=1)\")\n","print(f\"  USE_ACTIVE_SPANS:  {USE_ACTIVE_SPANS}\")\n","print(f\"  GENERATE_SYNTHETIC:{GENERATE_SYNTHETIC}\")\n","print(f\"  Workers / mem:     {num_workers} / {total_worker_memory/1e9:.2f} GB\")\n","if USE_ACTIVE_SPANS:\n","    print(f\"\\n✓ Will load ACTIVE spans under s3://{active_spans_key}/ (partitioned)\")\n","    GENERATE_DATA = False\n","else:\n","    print(f\"\\n⚠ Synthetic mode — will use s3://{validation_path}/\")\n","    try:\n","        existing_files = s3.glob(f\"{validation_path}/**/*.parquet\") or s3.glob(f\"{validation_path}/*.parquet\")\n","        if existing_files and len(existing_files) >= min(NUM_PARTITIONS, 10):\n","            print(f\"  Existing synthetic files: {len(existing_files)}\")\n","            GENERATE_DATA = False\n","        else:\n","            GENERATE_DATA = True\n","    except Exception as e:\n","        print(f\"  No synthetic data yet: {e}\")\n","        GENERATE_DATA = True\n"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":"def generate_spans(n_spans=100000, n_services=20):\n    \"\"\"Generate synthetic span data with rich attributes.\"\"\"\n    services = [f\"service-{i:02d}\" for i in range(n_services)]\n    operations = [\n        'GET /api/v1/users', 'POST /api/v1/orders', 'GET /health',\n        'PUT /api/v1/users/{id}', 'DELETE /api/v1/orders/{id}',\n        'db.query.select', 'db.query.insert', 'db.query.update',\n        'cache.get', 'cache.set', 'cache.delete',\n        'queue.publish', 'queue.consume',\n        'grpc.client.call', 'grpc.server.handle',\n    ]\n    http_methods = ['GET', 'POST', 'PUT', 'DELETE', 'PATCH']\n    status_codes_http = [200, 201, 204, 400, 401, 403, 404, 500, 502, 503]\n\n    now = datetime.now(timezone.utc)\n    base_ts = int(now.timestamp() * 1e9)\n\n    # Generate random data\n    n = n_spans\n    service_idx = np.random.randint(0, n_services, n)\n\n    return pd.DataFrame({\n        # Core span fields\n        'trace_id': [uuid.uuid4().hex for _ in range(n)],\n        'span_id': [uuid.uuid4().hex[:16] for _ in range(n)],\n        'parent_span_id': np.where(\n            np.random.random(n) > 0.3,\n            [uuid.uuid4().hex[:16] for _ in range(n)],\n            ''\n        ),\n        'service_name': np.array(services)[service_idx],\n        'operation_name': np.random.choice(operations, n),\n\n        # Timing\n        'start_time_unix_nano': base_ts - np.random.randint(0, 86400 * 1e9, n).astype(np.int64),\n        'duration_ns': np.random.exponential(scale=50_000_000, size=n).astype(np.int64),\n\n        # Status\n        'status_code': np.random.choice(['OK', 'ERROR', 'UNSET'], n, p=[0.92, 0.05, 0.03]),\n        'http_status_code': np.random.choice(status_codes_http, n, p=[0.5, 0.1, 0.05, 0.1, 0.05, 0.05, 0.05, 0.05, 0.025, 0.025]),\n        'http_method': np.random.choice(http_methods, n, p=[0.5, 0.25, 0.1, 0.1, 0.05]),\n\n        # Additional attributes for richer data\n        'user_id': [f\"user-{np.random.randint(1, 10000):05d}\" for _ in range(n)],\n        'request_id': [uuid.uuid4().hex for _ in range(n)],\n        'host': np.array([f\"{services[i]}-{np.random.randint(1,10)}.cluster.local\" for i in service_idx]),\n        'db_statement': np.where(\n            np.random.random(n) > 0.7,\n            [f\"SELECT * FROM table_{np.random.randint(1,100)} WHERE id = {np.random.randint(1,1000000)}\" for _ in range(n)],\n            ''\n        ),\n        'error_message': np.where(\n            np.random.random(n) > 0.95,\n            np.random.choice(['Connection timeout', 'Rate limit exceeded', 'Internal error', 'Not found', 'Permission denied'], n),\n            ''\n        ),\n    })\n\nif GENERATE_DATA:\n    import time as time_module\n    \n    print(f\"Generating {TOTAL_SPANS:,} spans across {NUM_PARTITIONS} partitions...\")\n    print(f\"  {SPANS_PER_PARTITION:,} spans per partition\")\n    print(f\"  {NUM_SERVICES} services\")\n    print(f\"  Estimated time: {NUM_PARTITIONS * 2 / 60:.0f}-{NUM_PARTITIONS * 4 / 60:.0f} minutes\")\n    print()\n    \n    start_time = time_module.time()\n    bytes_written = 0\n\n    for partition in range(NUM_PARTITIONS):\n        df = generate_spans(n_spans=SPANS_PER_PARTITION, n_services=NUM_SERVICES)\n\n        # Convert to PyArrow table\n        table = pa.Table.from_pandas(df, preserve_index=False)\n\n        # Write to S3\n        output_path = f\"s3://{validation_path}/partition_{partition:04d}.parquet\"\n        pq.write_table(table, output_path, filesystem=s3, compression='snappy')\n        \n        # Track progress\n        file_size = s3.info(f\"{validation_path}/partition_{partition:04d}.parquet\")['size']\n        bytes_written += file_size\n        \n        # Progress update every 50 partitions\n        if (partition + 1) % 50 == 0:\n            elapsed = time_module.time() - start_time\n            rate = (partition + 1) / elapsed\n            eta = (NUM_PARTITIONS - partition - 1) / rate\n            print(f\"  [{partition + 1:4d}/{NUM_PARTITIONS}] \"\n                  f\"{bytes_written/1e9:.2f} GB written, \"\n                  f\"{rate:.1f} partitions/sec, \"\n                  f\"ETA: {eta/60:.1f} min\")\n\n    elapsed = time_module.time() - start_time\n    \n    # Print final stats\n    files = s3.glob(f\"{validation_path}/*.parquet\")\n    total_size = sum(s3.info(f)['size'] for f in files)\n    \n    print(f\"\\n{'='*60}\")\n    print(\"DATA GENERATION COMPLETE\")\n    print(f\"{'='*60}\")\n    print(f\"  Files:       {len(files)}\")\n    print(f\"  Total size:  {total_size/1024/1024/1024:.2f} GB (compressed)\")\n    print(f\"  Spans:       {TOTAL_SPANS:,}\")\n    print(f\"  Time:        {elapsed/60:.1f} minutes\")\n    print(f\"  Throughput:  {TOTAL_SPANS/elapsed:,.0f} spans/sec\")\nelse:\n    print(\"Using existing data\")"},{"cell_type":"markdown","metadata":{},"source":["## 4. Load Data with Dask (Lazy)"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Load spans from OTEL_Data_Generator layout (pyarrow notebook):\n","#   s3://$BUCKET/$PREFIX/spans/date=YYYY-MM-DD/*.parquet\n","# (date= only — NO hour=). Not validation-30gb; not date=*/**/*.\n","\n","from cluster_env import load_active_spans_ddf, list_span_parquet_keys\n","\n","spans_key = f\"{bucket_name}/{data_prefix}/spans\"\n","print(f\"Listing parquet under s3://{spans_key}/ …\")\n","print(\"  expected layout: date=YYYY-MM-DD/batch_*.parquet  (OTEL generator)\")\n","keys = list_span_parquet_keys(CFG)\n","print(f\"  found {len(keys)} files\")\n","if keys:\n","    print(f\"  sample: {keys[:5]}\")\n","if not keys:\n","    raise FileNotFoundError(\n","        f\"No parquet under s3://{spans_key}/.\\n\"\n","        f\"Generator writes: s3://{spans_key}/date=YYYY-MM-DD/*.parquet\"\n","    )\n","\n","ddf = load_active_spans_ddf(CFG)\n","print(f\"Partitions: {ddf.npartitions}\")\n","print(f\"Columns ({len(ddf.columns)}): {list(ddf.columns)}\")\n","assert list(ddf.columns), \"columns=[] — path/credentials problem, not schema drift\"\n","print(\"⚡ LAZY — compute only aggregates on the cluster\")\n","ddf\n"]},{"cell_type":"markdown","source":["## 4. Load data with Dask (lazy)\n","\n","**OTEL_Data_Generator layout** (this is what the arrow notebook writes):\n","\n","```text\n","s3://$S3_BUCKET/$PREFIX/spans/date=YYYY-MM-DD/batch_*.parquet\n","```\n","\n","`date=` only — **no `hour=`**. Production 1TB trees may add `hour=`; discovery handles both.\n","\n","Do **not** use `validation-30gb` or globs with `**`.\n"],"metadata":{},"outputs":[],"execution_count":null},{"cell_type":"code","source":["# Re-load (safe re-run) — same rules as above\n","from cluster_env import load_active_spans_ddf\n","\n","if USE_ACTIVE_SPANS:\n","    data_uri = f\"s3://{bucket_name}/{data_prefix}/spans/\"\n","    ddf = load_active_spans_ddf(CFG)\n","else:\n","    data_uri = f\"s3://{validation_path}/\"\n","    print(f\"SYNTHETIC mode: {data_uri}\")\n","    ddf = dd.read_parquet(\n","        f\"{data_uri}*.parquet\",\n","        storage_options=s3_opts,\n","        engine=\"pyarrow\",\n","    )\n","\n","print(f\"URI:        {data_uri if USE_ACTIVE_SPANS else data_uri}\")\n","print(f\"Partitions: {ddf.npartitions}\")\n","print(f\"Columns:    {list(ddf.columns)}\")\n","if not list(ddf.columns):\n","    raise RuntimeError(\n","        \"columns=[] — wrong path or bad credentials. \"\n","        f\"Expected s3://{bucket_name}/{data_prefix}/spans/date=*/hour=*/*.parquet. \"\n","        \"Do not use date=*/**/*.parquet globs.\"\n","    )\n","ddf\n"],"metadata":{},"execution_count":null,"outputs":[]},{"cell_type":"code","source":["%%time\n","# Predicate + projection via Dask/Arrow engine on workers (not kernel to_table)\n","print(\"=\" * 60)\n","print(\"DASK FILTER + AGG (distributed)\")\n","print(\"=\" * 60)\n","\n","cols = [c for c in (\n","    \"trace_id\", \"service_name\", \"operation_name\", \"duration_ns\",\n","    \"error_message\", \"status_code\", \"span_id\",\n",") if c in ddf.columns]\n","ddf_err = ddf[cols] if cols else ddf\n","\n","if \"status_code\" in ddf_err.columns:\n","    # status may be string OK/ERROR or int\n","    sc = ddf_err[\"status_code\"]\n","    try:\n","        mask = (sc == \"ERROR\") | (sc == 2) | (sc.astype(str) == \"ERROR\")\n","    except Exception:\n","        mask = sc == \"ERROR\"\n","    ddf_err = ddf_err[mask]\n","\n","if \"service_name\" in ddf_err.columns:\n","    agg_map = {}\n","    if \"trace_id\" in ddf_err.columns:\n","        agg_map[\"trace_id\"] = \"count\"\n","    elif \"span_id\" in ddf_err.columns:\n","        agg_map[\"span_id\"] = \"count\"\n","    if \"duration_ns\" in ddf_err.columns:\n","        agg_map[\"duration_ns\"] = [\"mean\", \"max\"]\n","    if agg_map:\n","        error_by_service = ddf_err.groupby(\"service_name\").agg(agg_map).compute()\n","        print(error_by_service.head(20))\n","    else:\n","        print(ddf_err.groupby(\"service_name\").size().compute().head(20))\n","else:\n","    print(\"No service_name column — partition count only:\", ddf.npartitions)\n","    print(\"Row estimate (expensive on huge data — optional): skip\")\n"],"metadata":{},"execution_count":null,"outputs":[]},{"cell_type":"code","source":["%%time\n","# Dask filters on the ALREADY-BOUND ddf (same path as load cell)\n","print(\"=\" * 60)\n","print(\"DASK FILTER + AGG on loaded path\")\n","print(\"=\" * 60)\n","if not list(ddf.columns):\n","    raise RuntimeError(\"ddf has no columns — fix path load first (not schema)\")\n","\n","want = [\"trace_id\", \"service_name\", \"operation_name\", \"duration_ns\", \"status_code\", \"span_id\"]\n","cols = [c for c in want if c in ddf.columns]\n","ddf_f = ddf[cols] if cols else ddf\n","\n","if \"status_code\" in ddf_f.columns:\n","    sc = ddf_f[\"status_code\"]\n","    try:\n","        ddf_f = ddf_f[(sc == \"ERROR\") | (sc.astype(str) == \"ERROR\") | (sc == 2)]\n","    except Exception:\n","        pass\n","\n","if \"service_name\" in ddf_f.columns:\n","    if \"duration_ns\" in ddf_f.columns:\n","        out = ddf_f.groupby(\"service_name\").agg({\"duration_ns\": [\"count\", \"mean\", \"max\"]}).compute()\n","    else:\n","        out = ddf_f.groupby(\"service_name\").size().compute()\n","    print(out.head(15) if hasattr(out, \"head\") else out)\n","else:\n","    print(\"Available columns:\", list(ddf.columns))\n","    print(\"(service_name missing — check you loaded span parquet, not an empty prefix)\")\n"],"metadata":{},"execution_count":null,"outputs":[]},{"cell_type":"code","source":"# SCANNER API: Fine-grained batch iteration for streaming processing\n# This is the most memory-efficient way to process large datasets\n\nprint(\"=\"*60)\nprint(\"ARROW SCANNER: Streaming Batch Processing\")\nprint(\"=\"*60)\n\n# Create scanner with batch size control\nscanner = dataset.scanner(\n    columns=['service_name', 'duration_ns', 'status_code'],\n    filter=(ds.field('http_status_code') >= 500),  # Server errors only\n    batch_size=100_000,  # 100K rows per batch\n)\n\n# Process in batches - never loads full dataset\nbatch_count = 0\ntotal_rows = 0\nduration_sum = 0\n\nfor batch in scanner.to_batches():\n    batch_count += 1\n    total_rows += len(batch)\n    # Aggregate within batch (zero-copy access to Arrow arrays)\n    duration_sum += batch.column('duration_ns').to_numpy().sum()\n\navg_duration_ms = (duration_sum / total_rows / 1e6) if total_rows > 0 else 0\n\nprint(f\"\\nProcessed {batch_count} batches ({total_rows:,} rows)\")\nprint(f\"Average latency for HTTP 5xx errors: {avg_duration_ms:.2f} ms\")\nprint(f\"\\n✓ Memory-efficient: only one batch in memory at a time\")\nprint(f\"  Each batch: ~{100_000 * 50 / 1024 / 1024:.1f} MB\")\nprint(f\"  Full dataset: {TARGET_MEMORY_GB} GB\")\nprint(f\"  Memory savings: {TARGET_MEMORY_GB * 1000 / (100_000 * 50 / 1024 / 1024):.0f}×\")","metadata":{},"execution_count":null,"outputs":[]},{"cell_type":"markdown","metadata":{},"source":["## 5. Compute Aggregations (Distributed)"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":"%%time\n# This triggers distributed computation across all workers\n# Watch the Dask dashboard to see tasks being distributed!\ntotal_spans = len(ddf)\nprint(f\"✓ Total spans: {total_spans:,}\")\nprint(f\"  Processing {total_spans:,} rows across {ddf.npartitions} partitions\")"},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["%%time\n","# Multi-dimensional aggregation on the loaded ddf (correct path already bound)\n","# If this KeyErrors service_name with columns=[], the load path was wrong\n","# (e.g. validation-30gb empty) — not a schema change.\n","print(\"Columns:\", list(ddf.columns))\n","if \"service_name\" not in ddf.columns:\n","    raise RuntimeError(\n","        f\"service_name not in columns={list(ddf.columns)}. \"\n","        f\"Path config drift: re-run the load cell against \"\n","        f\"s3://{bucket_name}/{data_prefix}/spans/ (not validation-30gb).\"\n","    )\n","\n","# Prefer span_id (OTEL) or fall back\n","count_col = \"span_id\" if \"span_id\" in ddf.columns else (\n","    \"trace_id\" if \"trace_id\" in ddf.columns else None\n",")\n","agg = {}\n","if count_col:\n","    agg[count_col] = \"count\"\n","if \"duration_ns\" in ddf.columns:\n","    agg[\"duration_ns\"] = [\"mean\", \"max\", \"min\", \"std\"]\n","if \"http_status_code\" in ddf.columns:\n","    agg[\"http_status_code\"] = [\"mean\"]\n","\n","service_stats = ddf.groupby(\"service_name\").agg(agg).compute()\n","# Flatten multiindex columns if needed\n","if isinstance(service_stats.columns, pd.MultiIndex):\n","    service_stats.columns = [\n","        \"_\".join(str(x) for x in col if x != \"\").strip(\"_\")\n","        for col in service_stats.columns.values\n","    ]\n","# Normalize names\n","rename = {}\n","for c in list(service_stats.columns):\n","    if c.endswith(\"_count\") or c == count_col:\n","        rename[c] = \"count\"\n","    if \"mean\" in c and \"duration\" in c:\n","        rename[c] = \"mean_duration_ns\"\n","    if \"max\" in c and \"duration\" in c:\n","        rename[c] = \"max_duration_ns\"\n","    if \"min\" in c and \"duration\" in c:\n","        rename[c] = \"min_duration_ns\"\n","    if \"std\" in c and \"duration\" in c:\n","        rename[c] = \"std_duration_ns\"\n","service_stats = service_stats.rename(columns=rename)\n","if \"mean_duration_ns\" in service_stats.columns:\n","    service_stats[\"mean_duration_ms\"] = service_stats[\"mean_duration_ns\"] / 1e6\n","if \"max_duration_ns\" in service_stats.columns:\n","    service_stats[\"max_duration_ms\"] = service_stats[\"max_duration_ns\"] / 1e6\n","if \"count\" in service_stats.columns:\n","    service_stats = service_stats.sort_values(\"count\", ascending=False)\n","print(f\"✓ Aggregated into {len(service_stats)} service groups\")\n","cols_show = [c for c in (\"count\", \"mean_duration_ms\", \"max_duration_ms\", \"std_duration_ns\") if c in service_stats.columns]\n","service_stats[cols_show] if cols_show else service_stats\n"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":"%%time\n# Error rate by service - OPTIMIZED (no apply/lambda)\n# Count errors and total per service, then compute ratio\nimport dask\n\nerror_counts = ddf[ddf['status_code'] == 'ERROR'].groupby('service_name').size()\ntotal_counts = ddf.groupby('service_name').size()\n\n# Compute both in parallel\nerror_counts, total_counts = dask.compute(error_counts, total_counts)\n\n# Calculate error rate\nerror_rate = (error_counts / total_counts * 100).fillna(0).sort_values(ascending=False)\n\nprint(\"Error rate by service (%)\")\nerror_rate"},{"cell_type":"markdown","metadata":{},"source":["## 6. Visualizations with HoloViews"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Sample for visualization (compute a subset)\n","sample_df = ddf.sample(frac=0.1).compute()\n","print(f\"Sample size: {len(sample_df):,} spans\")"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Duration distribution by service\n","sample_df['duration_ms'] = sample_df['duration_ns'] / 1e6\n","\n","hv.BoxWhisker(sample_df, kdims='service_name', vdims='duration_ms').opts(\n","    width=800, height=400,\n","    title='Latency Distribution by Service',\n","    ylabel='Duration (ms)',\n","    box_fill_color=hv.dim('service_name').categorize(dict(zip(\n","        sample_df['service_name'].unique(),\n","        hv.Cycle('Category10').values\n","    )))\n",")"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Span count by service (bar chart)\n","counts = sample_df.groupby('service_name').size().reset_index(name='count')\n","\n","hv.Bars(counts, kdims='service_name', vdims='count').opts(\n","    width=600, height=400,\n","    title='Span Count by Service',\n","    color='service_name',\n","    cmap='Category10',\n","    xrotation=45,\n",")"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Status distribution\n","status_counts = sample_df.groupby(['service_name', 'status_code']).size().reset_index(name='count')\n","\n","hv.Bars(status_counts, kdims=['service_name', 'status_code'], vdims='count').opts(\n","    width=800, height=400,\n","    title='Status Code Distribution by Service',\n","    xrotation=45,\n","    color='status_code',\n","    cmap={'OK': 'green', 'ERROR': 'red', 'UNSET': 'gray'},\n",")"]},{"cell_type":"markdown","source":"## 6b. Hierarchical Drill-Down + Dask Density\n\n**Air-gap display:** `hv.extension('bokeh', inline=True)` embeds Bokeh JS (no CDN).\nInteractive zoom callbacks use **Panel** (ipywidgets comms) because `jupyter_bokeh`\nis not in the image.\n\n| View | Data path | Zoom behavior |\n|------|-----------|---------------|\n| Service latency heatmap + hist | pandas `drill_df` sample | Client-side; hist filters on pan/zoom |\n| Overview + detail | pandas `drill_df` | Detail re-aggregates hierarchy by range |\n| **Dask density** | persisted Dask frame + `datashader.Canvas` | **Re-aggregates on workers** each zoom |\n\nThe density plot intentionally avoids `hv.operation.datashader.rasterize` DynamicMaps,\nwhich raise `ValueError: Supplied Image bounds do not match the coordinates…` on\nHoloviews 1.23. Images are rebuilt from coordinate arrays only.\n","metadata":{}},{"cell_type":"code","source":"# Import drill-down visualization utilities\nfrom holoviews.operation.datashader import rasterize, datashade\nfrom holoviews.streams import RangeXY, RangeX\n\n# Prepare data with proper datetime column\ndrill_df = sample_df.copy()\ndrill_df['timestamp'] = pd.to_datetime(drill_df['start_time_unix_nano'], unit='ns')\ndrill_df['duration_ms'] = drill_df['duration_ns'] / 1e6\n\nprint(f\"Prepared {len(drill_df):,} spans for drill-down visualization\")\nprint(f\"Time range: {drill_df['timestamp'].min()} to {drill_df['timestamp'].max()}\")","metadata":{},"execution_count":null,"outputs":[]},{"cell_type":"code","source":"# Service Latency Heatmap + linked histogram (client-side sample)\n# Built as hv.Image from a dense pivot (coords only) to avoid HeatMap/Image\n# bounds-validation errors on Holoviews 1.23 DynamicMap layouts.\n\nfrom holoviews.streams import RangeXY\n\ndef create_latency_heatmap(df):\n    df = df.copy()\n    df[\"time_bucket\"] = df[\"timestamp\"].dt.floor(\"1min\")\n    pivot = df.pivot_table(\n        index=\"service_name\",\n        columns=\"time_bucket\",\n        values=\"duration_ms\",\n        aggfunc=\"mean\",\n    ).sort_index()\n    # Dense float grid; axes are integer indices (always regularly sampled)\n    arr = np.nan_to_num(pivot.to_numpy(dtype=np.float64), nan=0.0)\n    n_s, n_t = arr.shape\n    if n_s == 0 or n_t == 0:\n        return hv.Image((np.array([0.0]), np.array([0.0]), np.zeros((1, 1)))).opts(\n            title=\"Service Latency Heatmap (empty)\"\n        )\n    xs = np.arange(n_t, dtype=np.float64)          # time bucket index\n    ys = np.arange(n_s, dtype=np.float64)          # service index\n    # stash labels for hover/title\n    create_latency_heatmap._tlabels = list(pivot.columns.astype(str))\n    create_latency_heatmap._slabels = list(pivot.index.astype(str))\n    create_latency_heatmap._tvals = list(pivot.columns)\n    img = hv.Image(\n        (xs, ys, arr),\n        kdims=[\"time_idx\", \"service_idx\"],\n        vdims=[\"mean_latency\"],\n        rtol=1.0,\n    )\n    return img.opts(\n        title=\"Service Latency Heatmap (zoom/pan → filters histogram)\",\n        colorbar=True,\n        cmap=\"RdYlGn_r\",\n        default_tools=[\"pan\", \"wheel_zoom\", \"box_zoom\", \"reset\", \"hover\"],\n        active_tools=[\"wheel_zoom\"],\n        width=700,\n        height=400,\n        xlabel=\"time bucket index\",\n        ylabel=\"service index\",\n    )\n\n\nheatmap = create_latency_heatmap(drill_df)\nprint(\n    f\"Heatmap grid services×buckets = \"\n    f\"{len(getattr(create_latency_heatmap, '_slabels', []))}\"\n    f\"×{len(getattr(create_latency_heatmap, '_tlabels', []))}\"\n)\n\nrange_stream = RangeXY(source=heatmap)\n\n\ndef update_histogram(x_range, y_range):\n    \"\"\"Filter drill_df by selected time-bucket indices on the Image x-axis.\"\"\"\n    filtered = drill_df\n    tvals = getattr(create_latency_heatmap, \"_tvals\", None)\n    if x_range and x_range[0] is not None and tvals:\n        i0 = max(0, int(np.floor(x_range[0])))\n        i1 = min(len(tvals) - 1, int(np.ceil(x_range[1])))\n        if i1 < i0:\n            i0, i1 = i1, i0\n        t0, t1 = tvals[i0], tvals[i1]\n        mask = (drill_df[\"timestamp\"] >= t0) & (drill_df[\"timestamp\"] <= t1 + pd.Timedelta(\"1min\"))\n        filtered = drill_df[mask]\n    if filtered.empty:\n        return hv.Histogram((np.array([0.0, 1.0]), np.array([0.0]))).opts(\n            title=\"Latency Distribution (No data)\", width=350, height=350\n        )\n    frequencies, edges = np.histogram(filtered[\"duration_ms\"].to_numpy(), bins=50)\n    return hv.Histogram((edges, frequencies)).opts(\n        title=f\"Latency Distribution (n={len(filtered):,})\",\n        xlabel=\"Latency (ms)\",\n        ylabel=\"Count\",\n        width=350,\n        height=350,\n        fill_color=\"#3182bd\",\n    )\n\n\nhistogram = hv.DynamicMap(update_histogram, streams=[range_stream])\nlinked = (heatmap + histogram).opts(shared_axes=False)\nshow(linked)\n","metadata":{},"execution_count":null,"outputs":[]},{"cell_type":"code","source":"# Overview + Detail View with Hierarchy-Aware Aggregation\n# The detail view changes aggregation level based on zoom\n\ndef determine_agg_level(time_range_seconds):\n    \"\"\"Determine aggregation level from visible time range.\"\"\"\n    if time_range_seconds > 3600:    # > 1 hour\n        return 'service_group', '10min'   # Group services, 10-min buckets\n    elif time_range_seconds > 300:   # > 5 minutes\n        return 'service', '1min'          # Individual services, 1-min buckets\n    else:                            # < 5 minutes\n        return 'host', '10s'              # Host level, 10-sec buckets\n\ndef create_overview(df):\n    \"\"\"Create overview area chart showing total request volume.\"\"\"\n    hourly = df.groupby(df['timestamp'].dt.floor('10min')).agg({\n        'duration_ms': ['mean', 'count']\n    }).reset_index()\n    hourly.columns = ['time', 'mean_latency', 'count']\n    \n    area = hv.Area(hourly, kdims=['time'], vdims=['count'])\n    return area.opts(\n        height=120, width=900,\n        alpha=0.7, color='#1f77b4',\n        title='Overview: Request Volume (drag to zoom detail view)',\n        tools=['xbox_select'],\n    )\n\ndef create_detail(df, x_range):\n    \"\"\"Create detail view with hierarchy-aware aggregation.\"\"\"\n    if x_range is None or x_range[0] is None:\n        # Default view\n        time_range_sec = 3600\n        filtered = df\n    else:\n        start, end = pd.Timestamp(x_range[0]), pd.Timestamp(x_range[1])\n        time_range_sec = (end - start).total_seconds()\n        filtered = df[(df['timestamp'] >= start) & (df['timestamp'] <= end)]\n    \n    if filtered.empty:\n        return hv.Scatter([]).opts(title='Detail (No data in range)')\n    \n    # Determine aggregation level\n    group_col, time_bucket = determine_agg_level(time_range_sec)\n    \n    if group_col == 'service_group':\n        # Group services into clusters (e.g., service-0X -> group-0)\n        filtered = filtered.copy()\n        filtered['_group'] = filtered['service_name'].str.extract(r'service-(\\d)')[0].apply(\n            lambda x: f'group-{x}' if pd.notna(x) else 'other'\n        )\n        group_by = '_group'\n    elif group_col == 'host':\n        group_by = 'host'\n    else:\n        group_by = 'service_name'\n    \n    # Aggregate\n    filtered = filtered.copy()\n    filtered['_bucket'] = filtered['timestamp'].dt.floor(time_bucket)\n    \n    agg = filtered.groupby([group_by, '_bucket']).agg({\n        'duration_ms': 'mean',\n    }).reset_index()\n    agg.columns = ['group', 'time', 'latency']\n    \n    # Create scatter plot\n    scatter = hv.Scatter(agg, kdims=['time'], vdims=['latency', 'group'])\n    \n    return scatter.opts(\n        title=f'Detail: {group_col} level, {time_bucket} buckets (n={len(agg):,})',\n        color='group',\n        cmap='Category20',\n        width=900, height=350,\n        tools=['hover'],\n        size=8,\n        alpha=0.7,\n    )\n\n# Create the linked overview + detail\noverview = create_overview(drill_df)\nrange_x = RangeX(source=overview)\n\ndetail = hv.DynamicMap(\n    lambda x_range: create_detail(drill_df, x_range),\n    streams=[range_x]\n)\n\n# Stack vertically\n(overview + detail).cols(1).opts(shared_axes=False)","metadata":{},"execution_count":null,"outputs":[]},{"cell_type":"code","source":"# Dask-backed density heatmap: zoom/pan re-aggregates on the *cluster*\n# ---------------------------------------------------------------------------\n# Avoid holoviews.operation.datashader.rasterize DynamicMap → Image bounds bug\n# (ValueError: Supplied Image bounds do not match the coordinates...).\n# Instead: datashader.Canvas on a persisted Dask frame → hv.Image(coords only).\n\nimport datashader as ds\nfrom holoviews.streams import RangeXY, PlotSize\n\nDASK_VIZ_FRAC = float(os.getenv(\"DASK_VIZ_FRAC\", \"0.1\"))\n\nprint(\"Building lazy Dask view columns (no full client .compute of all rows)…\")\nddf_pts = ddf.assign(\n    timestamp_numeric=ddf[\"start_time_unix_nano\"] / 1e9,\n    duration_ms=ddf[\"duration_ns\"] / 1e6,\n)[[\"timestamp_numeric\", \"duration_ms\"]]\nif 0 < DASK_VIZ_FRAC < 1.0:\n    ddf_pts = ddf_pts.sample(frac=DASK_VIZ_FRAC, random_state=0)\n\nprint(\"Persisting partitions on Dask workers (watch dashboard)…\")\nddf_pts = ddf_pts.persist()\ntry:\n    from dask.distributed import wait as dask_wait\n    dask_wait(ddf_pts)\nexcept Exception:\n    pass\n\n# Global extents (two small scalar tasks)\n_x0, _x1, _y0, _y1 = dd.compute(\n    ddf_pts[\"timestamp_numeric\"].min(),\n    ddf_pts[\"timestamp_numeric\"].max(),\n    ddf_pts[\"duration_ms\"].min(),\n    ddf_pts[\"duration_ms\"].max(),\n)\n# pad zero-width ranges\nif not np.isfinite(_x0) or not np.isfinite(_x1) or _x1 <= _x0:\n    _x0, _x1 = 0.0, 1.0\nif not np.isfinite(_y0) or not np.isfinite(_y1) or _y1 <= _y0:\n    _y0, _y1 = 0.0, 1.0\n_dx = (_x1 - _x0) * 0.01 or 1.0\n_dy = (_y1 - _y0) * 0.01 or 1.0\n_x0, _x1 = float(_x0 - _dx), float(_x1 + _dx)\n_y0, _y1 = float(_y0 - _dy), float(_y1 + _dy)\n\nn_est = int(ddf_pts.shape[0].compute())\nprint(f\"Dask points ready: ~{n_est} rows  partitions={ddf_pts.npartitions}\")\nprint(f\"extents x=[{_x0:.3g},{_x1:.3g}]  y=[{_y0:.3g},{_y1:.3g}]\")\n\n\ndef dask_density_image(x_range, y_range, width=900, height=400, scale=1.0):\n    \"\"\"Canvas.points on Dask → hv.Image with coordinates only (no bounds=).\"\"\"\n    w = max(int(width or 900), 2)\n    h = max(int(height or 400), 2)\n    xr = x_range if x_range and x_range[0] is not None else (_x0, _x1)\n    yr = y_range if y_range and y_range[0] is not None else (_y0, _y1)\n    # guard inverted / zero ranges\n    x0, x1 = float(min(xr[0], xr[1])), float(max(xr[0], xr[1]))\n    y0, y1 = float(min(yr[0], yr[1])), float(max(yr[0], yr[1]))\n    if x1 <= x0:\n        x1 = x0 + 1.0\n    if y1 <= y0:\n        y1 = y0 + 1.0\n\n    cvs = ds.Canvas(plot_width=w, plot_height=h, x_range=(x0, x1), y_range=(y0, y1))\n    # This is the Dask compute: workers aggregate only the visible bins\n    agg = cvs.points(ddf_pts, \"timestamp_numeric\", \"duration_ms\", ds.count())\n    img = image_from_agg(\n        agg,\n        kdims=[\"timestamp_numeric\", \"duration_ms\"],\n        vdim=\"count\",\n    )\n    return img.opts(\n        cmap=\"fire\",\n        colorbar=True,\n        width=w,\n        height=h,\n        xlabel=\"Time (Unix seconds)\",\n        ylabel=\"Latency (ms)\",\n        title=f\"Dask density (~{n_est} pts, frac={DASK_VIZ_FRAC}) — zoom re-aggs on workers\",\n        default_tools=[\"pan\", \"wheel_zoom\", \"box_zoom\", \"reset\", \"hover\"],\n        active_tools=[\"wheel_zoom\"],\n        framewise=True,   # allow axis ranges to follow stream\n        # keep data ranges free so RangeXY can update\n    )\n\n\n# Streams: RangeXY + PlotSize. Seed ranges so first paint is valid.\n_range = RangeXY(x_range=(_x0, _x1), y_range=(_y0, _y1))\n_size = PlotSize(width=900, height=400)\ndensity = hv.DynamicMap(dask_density_image, streams=[_range, _size])\n\n# Attach RangeXY to the DynamicMap itself so wheel-zoom updates the stream\n_range.source = density\n\nprint(\n    \"Zoom/pan and watch the Dask dashboard for new tasks. \"\n    \"If the dashboard is idle, callbacks are not reaching the kernel.\"\n)\nshow(density, width=920, height=440)\n","metadata":{},"execution_count":null,"outputs":[]},{"cell_type":"markdown","metadata":{},"source":"<cell_type>markdown</cell_type>## 7. Out-of-Core Stress Test (30 GB)\n\nThis section demonstrates that Dask processes data **much larger than worker memory** using streaming aggregation.\nWith a 30 GB dataset and typical 2-8 GB cluster memory, this is a 4-15× memory challenge.\n\nEach worker processes partitions sequentially, computing partial results and releasing memory."},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":"import time\n\ndef show_worker_memory(label=\"\"):\n    \"\"\"Display worker memory utilization.\"\"\"\n    info = client.scheduler_info()\n    print(f\"\\n{'='*60}\")\n    print(f\"Worker Memory Utilization {label}\")\n    print(f\"{'='*60}\")\n    \n    total_used = 0\n    total_limit = 0\n    \n    for worker_id, worker in sorted(info['workers'].items()):\n        mem_used = worker.get('metrics', {}).get('memory', 0)\n        mem_limit = worker['memory_limit']\n        pct = (mem_used / mem_limit * 100) if mem_limit else 0\n        worker_short = worker_id.split('/')[-1][:25]\n        bar = '█' * int(pct/5) + '░' * (20 - int(pct/5))\n        print(f\"  {worker_short:25} [{bar}] {mem_used/1e9:.2f}GB / {mem_limit/1e9:.2f}GB ({pct:5.1f}%)\")\n        total_used += mem_used\n        total_limit += mem_limit\n    \n    print(f\"\\n  TOTAL: {total_used/1e9:.2f}GB / {total_limit/1e9:.2f}GB ({total_used/total_limit*100:.1f}%)\")\n    return total_used, total_limit\n\n# Show baseline memory and dataset ratio\nbaseline_used, baseline_limit = show_worker_memory(\"(baseline)\")\n\nprint(f\"\\n{'='*60}\")\nprint(\"OUT-OF-CORE CHALLENGE: 30 GB DATASET\")\nprint(f\"{'='*60}\")\nprint(f\"\\n  Dataset expanded size:   {TARGET_MEMORY_GB} GB\")\nprint(f\"  Total worker memory:     {baseline_limit/1e9:.2f} GB\")\nprint(f\"  Ratio (dataset/workers): {TARGET_MEMORY_BYTES/baseline_limit:.1f}×\")\nprint(f\"\\n  ⚡ Dataset is {TARGET_MEMORY_BYTES/baseline_limit:.1f}× larger than cluster memory!\")\nprint(f\"     Dask MUST use out-of-core streaming to process this.\")"},{"cell_type":"code","source":["%%time\n","# Complex multi-key aggregation — only columns that exist on the loaded path\n","print(f\"Columns available: {list(ddf.columns)}\")\n","need = {\"service_name\"}\n","missing = need - set(ddf.columns)\n","if missing:\n","    raise RuntimeError(\n","        f\"Missing {missing} — empty/wrong load path (columns={list(ddf.columns)}). \"\n","        f\"Use s3://…/{data_prefix}/spans/ not validation-30gb.\"\n","    )\n","\n","work = ddf\n","if \"http_status_code\" in ddf.columns:\n","    work = ddf.assign(is_http_error=(ddf[\"http_status_code\"] >= 400).astype(int))\n","    err_col = \"is_http_error\"\n","else:\n","    err_col = None\n","\n","group_cols = [c for c in (\"service_name\", \"operation_name\", \"http_method\", \"name\") if c in work.columns]\n","if len(group_cols) < 1:\n","    group_cols = [\"service_name\"]\n","\n","agg = {}\n","if \"span_id\" in work.columns:\n","    agg[\"span_id\"] = \"count\"\n","elif \"trace_id\" in work.columns:\n","    agg[\"trace_id\"] = \"count\"\n","if \"duration_ns\" in work.columns:\n","    agg[\"duration_ns\"] = [\"mean\", \"max\", \"std\"]\n","if err_col:\n","    agg[err_col] = \"sum\"\n","\n","print(f\"groupby={group_cols} agg={list(agg)}\")\n","complex_stats = work.groupby(group_cols).agg(agg).compute()\n","if isinstance(complex_stats.columns, pd.MultiIndex):\n","    complex_stats.columns = [\n","        \"_\".join(str(x) for x in col if x != \"\").strip(\"_\")\n","        for col in complex_stats.columns.values\n","    ]\n","print(complex_stats.head(15))\n","complex_stats.head(15)\n"],"metadata":{},"execution_count":null,"outputs":[]},{"cell_type":"code","source":"# Check memory AFTER complex aggregation\n# Key insight: memory should still be bounded even after processing 30 GB dataset\npost_used, post_limit = show_worker_memory(\"(after complex aggregation)\")\n\nprint(\"\\n\" + \"=\"*60)\nprint(\"OUT-OF-CORE VERIFICATION: 30 GB DATASET\")\nprint(\"=\"*60)\n\n# Calculate memory headroom\nmax_worker_pct = max(\n    w.get('metrics', {}).get('memory', 0) / w['memory_limit'] * 100\n    for w in client.scheduler_info()['workers'].values()\n)\n\nprint(f\"\"\"\nDataset size:          {TARGET_MEMORY_GB} GB ({TOTAL_SPANS:,} spans)\nCluster memory:        {post_limit/1e9:.1f} GB\nDataset/Memory ratio:  {TARGET_MEMORY_BYTES/post_limit:.1f}×\nPeak worker memory:    {max_worker_pct:.1f}%\nMemory stayed bounded: {'✓ YES' if max_worker_pct < 90 else '✗ NO'}\n\nHow out-of-core processing works:\n  1. Dask reads partitions lazily from S3 (one at a time per task)\n  2. Each partition ({SPANS_PER_PARTITION:,} spans, ~50 MB) is processed\n  3. Partial aggregation results accumulated, raw data released\n  4. Only final aggregated results stay in memory\n\nResult: Processed {TARGET_MEMORY_GB} GB dataset using {post_limit/1e9:.1f} GB cluster!\n        That's {TARGET_MEMORY_BYTES/post_limit:.0f}× more data than available RAM.\n\"\"\")","metadata":{},"execution_count":null,"outputs":[]},{"cell_type":"markdown","metadata":{},"source":["## 8. Cleanup"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Optionally delete test data\n","# Uncomment to clean up:\n","# s3.rm(validation_path, recursive=True)\n","# print(f\"Deleted: {validation_path}\")"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Close client\n","# client.close()"]},{"cell_type":"markdown","metadata":{},"source":["<cell_type>markdown</cell_type>---\n","\n","## Validation Summary\n","\n","This notebook validated **Dask out-of-core processing** with a **30 GB dataset**:\n","\n","| Metric | Value |\n","|--------|-------|\n","| Dataset Size | **30 GB** (expanded memory) |\n","| Total Spans | 60,000,000 |\n","| Partitions | 600 |\n","| Disk Size | ~6-8 GB (Parquet/Snappy) |\n","| Services | 20 |\n","\n","### Key Validation: 30 GB Out-of-Core Processing\n","\n","The 30 GB dataset is typically **10-30× larger** than cluster memory:\n","- With 2 workers × 2 GB = 4 GB cluster → **7.5× ratio**\n","- With 4 workers × 2 GB = 8 GB cluster → **3.75× ratio**\n","- With 2 workers × 1 GB = 2 GB cluster → **15× ratio**\n","\n","This **guarantees** Dask must use streaming/out-of-core processing - the data\n","simply cannot fit in memory.\n","\n","### Capabilities Demonstrated\n","\n","1. **Dask Cluster Connection** - Connected to distributed scheduler with multiple workers\n","2. **S3 Access via IAM** - Read/write to S3 using AWS IAM role credentials\n","3. **30 GB Dataset Generation** - 60M spans across 600 partitions\n","4. **Idempotent Data Generation** - Skips regeneration if data already exists\n","5. **Lazy Loading** - 60M rows loaded only when `.compute()` is called\n","6. **Distributed Aggregations** - GroupBy operations computed in parallel across workers\n","7. **Out-of-Core Processing** - Memory stays bounded processing 30 GB with ~2-8 GB cluster\n","8. **HoloViews Visualizations** - Interactive plots render correctly in JupyterLab\n","9. **Hierarchical Drill-Down** - Zoom-triggered aggregation (service group → service → host)\n","10. **Datashader Integration** - Millions of points rendered efficiently with zoom/pan\n","\n","### Loading rules (air-gap)\n","\n","- **Always** use `dd.read_parquet` / `load_active_spans_ddf` for analytics.\n","- **Never** `pyarrow.dataset.to_table()` on multi‑GB span sets (kernel OOM).\n","- PyArrow is fine for **chunked writes** and **row-group filters inside Dask workers**.\n","\n","### PyArrow Dataset Capabilities\n","\n","| Feature | Description | Benefit |\n","|---------|-------------|---------|\n","| **Schema Inspection** | Read schema without loading data | Fast exploration of unknown datasets |\n","| **Predicate Pushdown** | Filters applied at Parquet row-group level | Only matching data read from S3 |\n","| **Column Projection** | Only requested columns deserialized | Reduced I/O and memory |\n","| **Scanner API** | Batch-by-batch iteration | Constant memory for any dataset size |\n","| **Dask Integration** | Filters passed to Arrow engine | Distributed + pushdown combined |\n","\n","### Data Loading Approaches Compared\n","\n","| Approach | Use Case | Memory Model |\n","|----------|----------|--------------|\n","| `dd.read_parquet()` | Distributed aggregations | Partitioned across workers |\n","| `ds.dataset().to_table()` | **Avoid on large data** | Pulls result into kernel → OOM |\n","| `ds.dataset().scanner()` | Streaming processing | Constant memory (batch-at-a-time) |\n","| `dd.read_parquet(filters=)` | Distributed + filtered | Best of both worlds |\n","\n","### Drill-Down Visualization Pattern\n","\n","The notebook demonstrates **zoom-triggered hierarchy** for exploring large OTel datasets:\n","\n","| Zoom Level | Aggregation | Time Bucket | Use Case |\n","|------------|-------------|-------------|----------|\n","| Zoomed out (>1h) | Service groups | 10 min | Cluster-wide overview |\n","| Medium (5m-1h) | Individual services | 1 min | Service comparison |\n","| Zoomed in (<5m) | Hosts/pods | 10 sec | Incident investigation |\n","\n","This pattern enables exploring from region/AZ-level down to individual spans without\n","loading the entire dataset into memory.\n","\n","### Key Insight\n","\n","**No bottlenecks** in the data path:\n","\n","1. **S3 → Arrow**: Predicate pushdown means only relevant row groups are read\n","2. **Arrow → Dask**: Zero-copy handoff, data stays in Arrow format\n","3. **Dask Workers**: Stream partitions, compute partial aggregations, release memory\n","4. **Final Result**: Only aggregated summaries returned to client\n","\n","This architecture processes datasets **orders of magnitude larger than cluster memory**.\n"],"outputs":[]}],"metadata":{"kernelspec":{"display_name":"Python 3","language":"python","name":"python3"},"language_info":{"name":"python","version":"3.10.0"}},"nbformat":4,"nbformat_minor":5}
  HDF5_CPHY_Acquisition_Generator.ipynb: |
    {"nbformat":4,"nbformat_minor":5,"metadata":{"kernelspec":{"display_name":"Python 3","language":"python","name":"python3"},"language_info":{"name":"python","version":"3.10.0"}},"cells":[{"cell_type":"markdown","metadata":{},"source":"# CPHY HDF5 Acquisition Generator + Dask Explorer\n\nGenerate many **OpenTelemetry-framed** dense acquisition windows as HDF5 for CPHY\ntelemetry, land them on RustFS (`s3://cyberphy/…`), and explore with **Dask**\n(multi-file `dask.array` over object-store parts) + **Holoviews** out-of-core.\n\n| Layer | Content |\n|-------|---------|\n| **A — Dataset plane** | Many contiguous `.h5` files under a product prefix (Iceberg data-file keys) |\n| **B — Metadata plane** | Pointer-table *preview* only (no Iceberg write yet) |\n| **C — Compute** | One Dask task per part (S3 GET + hyperslab); reductions on workers |\n\n**Idempotent by default:** **Run All** reuses existing full-size parts under the product\nprefix (no re-write). Set `FORCE_REGENERATE = True` only when you want a fresh run.\n\n**Dask contract:** the notebook client never holds the full Values plane. Workers\nfetch part objects from S3 and return only reduced blocks / tiny viz slabs. Watch\nthe Dask dashboard while running the compute cells.\n\n**Profiles**\n\n| Profile | Geometry | Approx Values size |\n|---------|----------|--------------------|\n| `lab` (default) | 5001 × 10000 × 108 parts | **~10 GiB** (RAID) |\n| `lab_tiny` | 256 × 500 × 24 parts | ~6 MiB smoke |\n| `airgap_2tb` | 5001 × 10000 × 21500 parts | **~2 TiB** |\n\nCopy this notebook to your home before editing:\n```python\nimport shutil; shutil.copy('/root/sample-notebooks/HDF5_CPHY_Acquisition_Generator.ipynb', '/root/')\n```\n"},{"cell_type":"code","metadata":{},"execution_count":null,"outputs":[],"source":["# --- User Configuration ---\n","import os\n","# Prefer converge/JupyterHub env via cluster_env\n","import sys\n","for _p in (\"/root/sample-notebooks\", \"/app\", \"/root\"):\n","    if _p not in sys.path:\n","        sys.path.insert(0, _p)\n","try:\n","    from cluster_env import load_cluster_config\n","    _CFG = load_cluster_config()\n","    print(_CFG.summary())\n","    # Align legacy names used below\n","    os.environ.setdefault(\"S3_BUCKET\", _CFG.s3_bucket)\n","    if _CFG.s3_endpoint:\n","        os.environ.setdefault(\"S3_ENDPOINT\", _CFG.s3_endpoint)\n","    os.environ.setdefault(\"AWS_REGION\", _CFG.s3_region)\n","    os.environ.setdefault(\"DASK_SCHEDULER_ADDRESS\", _CFG.dask_scheduler)\n","except Exception as _e:\n","    print(\"cluster_env optional:\", _e)\n","\n","from datetime import datetime, timezone\n","\n","# Profile: \"lab\" | \"lab_tiny\" | \"airgap_2tb\"\n","PROFILE = os.getenv(\"HDF5_PROFILE\", \"lab\")\n","\n","# Time unit for Timestamps dataset: \"ns\" (OTel default) or \"us\" (microseconds)\n","TIME_UNIT = os.getenv(\"HDF5_TIME_UNIT\", \"ns\")\n","\n","# Contiguous storage (Iceberg/kerchunk-friendly). Set False only for chunk experiments.\n","CONTIGUOUS = True\n","\n","# Idempotency: reuse existing full-size parts under the product object prefix (default).\n","FORCE_REGENERATE = os.getenv(\"HDF5_FORCE_REGENERATE\", \"0\") in (\"1\", \"true\", \"True\", \"yes\")\n","\n","# Optional overrides (None = use profile defaults)\n","N_PARTS = None          # e.g. 8 for a quicker lab run\n","N_SERIES = None\n","N_TIME = None\n","\n","# S3 (JupyterHub injects these for zarf:local)\n","BUCKET = os.getenv(\"S3_BUCKET\", \"cyberphy\")\n","S3_ENDPOINT = os.getenv(\"S3_ENDPOINT\", \"http://127.0.0.1:9010\")\n","S3_REGION = os.getenv(\"AWS_REGION\", os.getenv(\"S3_REGION\", \"us-east-1\"))\n","OUT = f\"s3://{BUCKET}/\"\n","\n","# Dask\n","DASK_SCHEDULER = os.getenv(\n","    \"DASK_SCHEDULER_ADDRESS\",\n","    os.getenv(\"DASK_SCHEDULER\", \"tcp://cybersec-dask-scheduler.dask.svc.cluster.local:8786\"),\n",")\n","USE_DASK = os.getenv(\"USE_DASK\", \"1\") not in (\"0\", \"false\", \"False\")\n","# Desired worker count (0 = do not scale; only report). Multi-core lab: 8; 2 TiB: 16–32.\n","TARGET_WORKERS = int(os.getenv(\"DASK_TARGET_WORKERS\", \"8\"))\n","# Wait up to this many seconds for TARGET_WORKERS to join\n","WORKER_WAIT_S = int(os.getenv(\"DASK_WORKER_WAIT_S\", \"120\"))\n","\n","# Worker-side read strides (applied inside each part task — less bytes off S3/HDF5)\n","# 1 = full resolution. Increase for faster first-pass analytics on lab/airgap.\n","SERIES_STRIDE = int(os.getenv(\"HDF5_SERIES_STRIDE\", \"1\"))\n","TIME_STRIDE = int(os.getenv(\"HDF5_TIME_STRIDE\", \"1\"))\n","# Cap how many parts enter the Dask array (None = all inventory parts)\n","MAX_PARTS = None  # e.g. 16 for a quicker dashboard demo\n","\n","# Visualization (client only receives the final small slab)\n","HEATMAP_SERIES_STRIDE = 1\n","VIZ_MAX_SERIES = 256\n","VIZ_MAX_TIME = 2000\n","VIZ_MAX_POINTS = 2_000_000\n","\n","print(f\"PROFILE={PROFILE}  TIME_UNIT={TIME_UNIT}  BUCKET={BUCKET}\")\n","print(f\"FORCE_REGENERATE={FORCE_REGENERATE}  (False → reuse existing parts on Run All)\")\n","print(f\"S3_ENDPOINT={S3_ENDPOINT or '(AWS default)'}\")\n","print(f\"DASK={DASK_SCHEDULER if USE_DASK else 'disabled'}\")\n","print(f\"READ strides series={SERIES_STRIDE} time={TIME_STRIDE}  MAX_PARTS={MAX_PARTS}\")\n","print(f\"TARGET_WORKERS={TARGET_WORKERS}  (set DASK_TARGET_WORKERS=0 to skip scale wait)\")\n"]},{"cell_type":"code","metadata":{},"execution_count":null,"outputs":[],"source":"# Imports + path to generate_hdf5\nimport json\nimport sys\nimport tempfile\nfrom pathlib import Path\n\nimport numpy as np\nimport pandas as pd\n\n# Resolve generate_hdf5.py.\n# Prefer ConfigMap/home copies (live-updatable) over image-baked /app so ensure_parts\n# and other fixes land without a Jupyter image rebuild. expanduser() required for ~/.\n_CANDIDATES = [\n    Path(\"~/sample-notebooks/generate_hdf5.py\").expanduser(),  # ConfigMap mount\n    Path(\"/root/sample-notebooks/generate_hdf5.py\"),\n    Path.cwd() / \"generate_hdf5.py\",\n    Path.cwd() / \"zarf\" / \"scripts\" / \"generate_hdf5.py\",\n    Path(\"/app/generate_hdf5.py\"),              # image-baked air-gap fallback\n    Path(\"/app/lib/generate_hdf5.py\"),\n    Path(\"/app/zarf/scripts/generate_hdf5.py\"),\n    Path(\"/root/generate_hdf5.py\"),\n]\n_SCRIPT = next((p for p in _CANDIDATES if p.is_file()), None)\nif _SCRIPT is None:\n    for parent in [Path.cwd(), *Path.cwd().parents]:\n        cand = parent / \"zarf\" / \"scripts\" / \"generate_hdf5.py\"\n        if cand.is_file():\n            _SCRIPT = cand\n            break\nif _SCRIPT is None:\n    raise FileNotFoundError(\"generate_hdf5.py not found — mount repo or copy script into image\")\n\nsys.path.insert(0, str(_SCRIPT.parent))\nimport generate_hdf5 as gh\n\nprint(f\"Using generator: {_SCRIPT}\")\nprint(f\"Profiles: {list(gh.PROFILES)}\")\nfor name, p in gh.PROFILES.items():\n    print(f\"  {name}: {p['description']}\")\nassert hasattr(gh, \"ensure_parts\"), (\n    \"generate_hdf5 is too old (no ensure_parts). \"\n    \"Refresh the sample-notebooks ConfigMap or image copy of generate_hdf5.py.\"\n)\n"},{"cell_type":"code","metadata":{},"execution_count":null,"outputs":[],"source":"# Build GenConfig\noverrides = {\n    \"time_unit\": TIME_UNIT,\n    \"contiguous\": CONTIGUOUS,\n    \"group_style\": \"underscore\",\n    \"product_prefix\": True,\n    \"service_name\": \"cphy-collector\",\n    \"service_namespace\": \"cyberphy.otel\",\n    \"base_time\": datetime.now(timezone.utc).replace(microsecond=0),\n}\nif N_PARTS is not None:\n    overrides[\"n_parts\"] = int(N_PARTS)\nif N_SERIES is not None:\n    overrides[\"n_series\"] = int(N_SERIES)\nif N_TIME is not None:\n    overrides[\"n_time\"] = int(N_TIME)\n\nif PROFILE == \"custom\":\n    cfg = gh.GenConfig(**overrides)\nelse:\n    cfg = gh.profile_config(PROFILE, **overrides)\n\nprint(\"=\" * 60)\nprint(f\"Active profile: {PROFILE}\")\nprint(f\"  series × time × parts = {cfg.n_series} × {cfg.n_time} × {cfg.n_parts}\")\nprint(f\"  Values payload ≈ {cfg.estimated_values_bytes()/1e6:.2f} MB \"\n      f\"({cfg.estimated_values_tib():.4f} TiB)\")\nprint(f\"  layout={('contiguous' if cfg.contiguous else 'chunked')}  time_unit={cfg.time_unit}\")\nprint(f\"  object keys under s3://{BUCKET}/datasets/hdf5/{cfg.product}/…\")\nprint(\"=\" * 60)\nif PROFILE == \"lab\":\n    print(\"ℹ lab profile is ~10 GiB Values — ensure RUSTFS_DATA_DIR is on /raid.\")\nif PROFILE == \"airgap_2tb\":\n    print(\"⚠ airgap_2tb is ~2 TiB — only run on a large air-gap cluster with ample S3.\")\n    print(\"  For this notebook session, consider N_PARTS=2 smoke test first.\")\n"},{"cell_type":"markdown","metadata":{},"source":"## Iceberg / Arrow-oriented layout (dataset plane)\n\n```\ns3://cyberphy/\n  datasets/hdf5/cphy/                 # Layer A — conserved RO data files\n    cphy_<YYYYMMDDTHHMMSS>_<part>Z.h5\n  cyberphy-md/iceberg/warehouse/          # Layer B — metadata only (hdf5_iceberg SDK)\n    telemetry/hdf5_datasets/parts.parquet # Arrow pointer table\n    semantic/catalog.ttl                  # DCAT TTL (not JSON-LD)\n```\n\n**Path partitions are not used.** Time bounds and soft tags live in file attrs and the\nmetadata plane (Arrow / Iceberg). Object keys are flat under the product prefix so\narbitrary customer layouts map through layout adapters without a directory contract.\n\n**Why many small files?** Each file is one fixed-duration acquisition window — a natural\nIceberg *data file* under a future HDF5 `FormatModel`, and a pointer-table row today.\n\n**Contiguous Values:** one byte range per dataset → kerchunk refs degenerate to a single\n`(offset, length)`; series hyperslabs are arithmetic strides (`n_time * itemsize` per row).\n"},{"cell_type":"code","metadata":{},"execution_count":null,"outputs":[],"source":"# Ensure parts on RustFS — IDEMPOTENT by default (should be seconds, not minutes)\n# Look for: \"Idempotent reuse: found N … in X.XXs\"\n# If you see \"[1/108] … → s3://…\" progress lines, it is GENERATING (slow).\nimport time as _time\n\nprint(f\"FORCE_REGENERATE={FORCE_REGENERATE}  OUT={OUT}  endpoint={S3_ENDPOINT or '(default)'}\")\nif FORCE_REGENERATE:\n    print(\"⚠ FORCE_REGENERATE=True → will WRITE new ~10 GiB lab parts. Set False for reuse.\")\n\n_t0 = _time.time()\ninventory = gh.ensure_parts(\n    cfg,\n    OUT,\n    s3_endpoint=S3_ENDPOINT or None,\n    emit_kerchunk_refs=False,\n    dry_run=False,\n    progress_every=max(1, cfg.n_parts // 8),\n    reuse_existing=not FORCE_REGENERATE,\n    force=FORCE_REGENERATE,\n)\n_elapsed = _time.time() - _t0\n\npointer_rows = gh.inventory_to_pointer_rows(inventory)\ninv_df = pd.DataFrame(pointer_rows)\nreused = sum(1 for m in inventory if m.get(\"reused\"))\nprint(inv_df.head())\nprint(\n    f\"\\nTotal files: {len(inv_df)}  total size: {inv_df['size_bytes'].sum()/1e6:.1f} MB\"\n    f\"  reused={reused}/{len(inventory)}  wall={_elapsed:.2f}s\"\n)\nif reused == len(inventory) and _elapsed < 5:\n    print(\"✓ Fast path OK — no data rewrite.\")\nelif reused == 0 and len(inventory):\n    print(\"✗ Generated new parts (not a reuse). Check FORCE_REGENERATE and S3_ENDPOINT.\")\n"},{"cell_type":"code","metadata":{},"execution_count":null,"outputs":[],"source":"# Pointer-table preview on S3 (small parquet — not the multi-GiB parts)\nimport pyarrow as pa\nimport pyarrow.parquet as pq\nimport pyarrow.fs as pafs\n\ndef s3_filesystem():\n    kw = dict(\n        access_key=os.environ.get(\"AWS_ACCESS_KEY_ID\", \"admin\"),\n        secret_key=os.environ.get(\"AWS_SECRET_ACCESS_KEY\", \"admin\"),\n        region=S3_REGION,\n    )\n    token = os.environ.get(\"AWS_SESSION_TOKEN\") or \"\"\n    if token:\n        kw[\"session_token\"] = token\n    if S3_ENDPOINT:\n        kw[\"endpoint_override\"] = S3_ENDPOINT\n        kw[\"scheme\"] = \"https\" if S3_ENDPOINT.startswith(\"https\") else \"http\"\n    return pafs.S3FileSystem(**kw)\n\ns3fs_pa = s3_filesystem()\ninv_key = f\"{BUCKET}/datasets/hdf5/{cfg.product}/_inventory/parts.parquet\"\n\n# Always refresh the small inventory pointer file (cheap); parts themselves are untouched on reuse\ntable = pa.Table.from_pandas(inv_df)\npq.write_table(table, inv_key, filesystem=s3fs_pa)\nprint(f\"Wrote pointer-table preview → s3://{inv_key}  ({len(inv_df)} rows)\")\n\nimport s3fs\ns3 = s3fs.S3FileSystem(\n    key=os.environ.get(\"AWS_ACCESS_KEY_ID\", \"admin\"),\n    secret=os.environ.get(\"AWS_SECRET_ACCESS_KEY\", \"admin\"),\n    client_kwargs={\"endpoint_url\": S3_ENDPOINT} if S3_ENDPOINT else {},\n    config_kwargs={\"s3\": {\"addressing_style\": \"path\"}, \"signature_version\": \"s3v4\"},\n)\nprefix = f\"{BUCKET}/datasets/hdf5/{cfg.product}\"\nprint(\"Sample listing (first 8 .h5):\")\nfor p in sorted(s3.glob(prefix + \"/**/*.h5\"))[:8]:\n    print(\" \", p)\n"},{"cell_type":"markdown","metadata":{},"source":"## Structural audit (one file)\n\nOpen a single acquisition and verify: contiguous Values, uuid chain, time triple agreement,\nand Metric sub-window vs acquisition start index.\n"},{"cell_type":"code","metadata":{},"execution_count":null,"outputs":[],"source":"import h5py\nimport tempfile\n\n# Download one part for audit (h5py needs a seekable path for full attr walk)\nsample_uri = inventory[0][\"uri\"]\nsample_key = inventory[0][\"key\"]\nprint(\"Auditing\", sample_uri)\n\nwith tempfile.NamedTemporaryFile(suffix=\".h5\") as tmp:\n    s3.get(f\"{BUCKET}/{sample_key}\", tmp.name)\n    with h5py.File(tmp.name, \"r\") as f:\n        def walk(name, obj):\n            kind = \"G\" if isinstance(obj, h5py.Group) else \"D\"\n            nattr = len(obj.attrs)\n            extra = \"\"\n            if isinstance(obj, h5py.Dataset):\n                extra = f\" shape={obj.shape} dtype={obj.dtype} contiguous={obj.chunks is None}\"\n            print(f\"  {kind} /{name}  attrs={nattr}{extra}\")\n        print(\"Tree:\")\n        f.visititems(walk)\n        print(\"\\nRoot uuid:\", f.attrs.get(\"collection.uuid\"))\n        rm = f[\"ResourceMetrics\"]\n        print(\"Acquisition start.series.index:\", int(rm.attrs[\"start.series.index\"]))\n        met_name = \"Metric_0\" if \"Metric_0\" in rm else \"Metric[0]\"\n        met = rm[met_name]\n        print(\"Metric start.series.index:\", int(met.attrs[\"start.series.index\"]))\n        print(\"  (sub-window ≠ acquisition — expected)\")\n        vals = met[\"Values\"]\n        ts = met[\"Timestamps\"]\n        print(f\"Values: {vals.shape} chunks={vals.chunks} scale.factor={float(met.attrs.get('scale.factor', 0))}\")\n        print(f\"Timestamps: unit={ts.attrs.get('unit')} start.index={int(ts.attrs['start.index'])}\")\n        print(f\"part.start.time Values:\", vals.attrs.get(\"part.start.time\"))\n        print(f\"part.start.time RM:    \", rm.attrs.get(\"start.time\"))\n"},{"cell_type":"markdown","metadata":{},"source":"## Dask client + multi-file Values plane\n\nEach object-store part is one acquisition window → one Dask task:\n\n```\nS3 part_i.h5  →  worker: h5py Values[::s, ::t]  →  block (n_series', n_time')\n                                                      │\n                 da.concatenate(..., axis=1)  ─────────┘\n                      values_da  shape (series', time' × n_parts)\n```\n\n- **No full plane on the client** — only metadata + tiny reductions/viz slabs.\n- Workers need S3 reachability (DaskCluster env: `AWS_*`, `S3_ENDPOINT`).\n- **Multi-core / multi-node:** scale workers so part tasks run in parallel\n  (lab: 4–8, fat node: 8–16, air-gap 2 TiB: 16–32). One worker under-utilizes a\n  multi-core box and serializes S3+HDF5 I/O.\n\nScale via the **DaskCluster CR** (operator source of truth), not a one-off Deployment:\n\n```bash\nkubectl -n dask patch daskcluster cybersec-dask --type merge \\\n  -p '{\"spec\":{\"worker\":{\"replicas\":8}}}'\n```\n\nOr at package deploy: `--set DASK_WORKER_REPLICAS=8 --set DASK_WORKER_NTHREADS=2 --set DASK_WORKER_CPU=2`.\n"},{"cell_type":"code","metadata":{},"execution_count":null,"outputs":[],"source":"from dask.distributed import Client, get_client, wait\nimport dask\nimport dask.array as da\nfrom dask import delayed\nimport subprocess\nimport shutil\n\nclient = None\nif USE_DASK:\n    try:\n        client = Client(DASK_SCHEDULER, timeout=\"10s\")\n        print(\"Connected:\", client)\n        print(\"Dashboard:\", client.dashboard_link)\n    except Exception as e:\n        print(f\"Cluster unavailable ({e}); local threaded client\")\n        client = Client(processes=False, threads_per_worker=2, n_workers=2)\n        print(client)\nelse:\n    print(\"USE_DASK=0 — pure local threads via default scheduler\")\n\n\ndef _n_workers(c):\n    try:\n        return len(c.scheduler_info().get(\"workers\", {}))\n    except Exception:\n        return 0\n\n\ndef _scale_daskcluster(replicas: int) -> bool:\n    \"\"\"Best-effort scale via kubectl patch of DaskCluster (needs RBAC from notebook).\"\"\"\n    if not shutil.which(\"kubectl\"):\n        return False\n    patch = f'{{\"spec\":{{\"worker\":{{\"replicas\":{int(replicas)}}}}}}}'\n    cmd = [\n        \"kubectl\", \"-n\", \"dask\", \"patch\", \"daskcluster\", \"cybersec-dask\",\n        \"--type\", \"merge\", \"-p\", patch,\n    ]\n    try:\n        r = subprocess.run(cmd, capture_output=True, text=True, timeout=30)\n        if r.returncode == 0:\n            print(f\"Patched DaskCluster worker.replicas → {replicas}\")\n            return True\n        print(f\"kubectl patch failed ({r.returncode}): {(r.stderr or r.stdout).strip()[:200]}\")\n    except Exception as e:\n        print(f\"kubectl scale skipped: {e}\")\n    return False\n\n\nif client is not None and not str(client).startswith(\"<Client: inproc\"):\n    n = _n_workers(client)\n    print(f\"Workers currently connected: {n}\")\n    if TARGET_WORKERS and n < TARGET_WORKERS:\n        print(\n            f\"Want ≥{TARGET_WORKERS} workers for multi-core HDF5 (one task/part). \"\n            f\"Attempting scale…\"\n        )\n        scaled = _scale_daskcluster(TARGET_WORKERS)\n        if not scaled:\n            print(\n                \"Scale manually (from a host with cluster admin):\\n\"\n                f\"  kubectl -n dask patch daskcluster cybersec-dask --type merge \"\n                f\"-p '{{\\\"spec\\\":{{\\\"worker\\\":{{\\\"replicas\\\":{TARGET_WORKERS}}}}}}}'\\n\"\n                \"Then re-run this cell.\"\n            )\n        try:\n            print(f\"Waiting up to {WORKER_WAIT_S}s for {TARGET_WORKERS} workers…\")\n            client.wait_for_workers(n_workers=TARGET_WORKERS, timeout=WORKER_WAIT_S)\n        except Exception as e:\n            print(f\"wait_for_workers: {e} (continuing with {_n_workers(client)} workers)\")\n    workers = client.scheduler_info().get(\"workers\", {})\n    print(f\"Workers ready: {len(workers)}\")\n    total_threads = 0\n    for addr, info in list(workers.items())[:12]:\n        nt = info.get(\"nthreads\") or info.get(\"ncores\") or 0\n        total_threads += int(nt)\n        print(\n            f\"  {addr}  threads={nt}  \"\n            f\"mem_limit={info.get('memory_limit', 0)/1e9:.1f} GiB\"\n        )\n    if len(workers) > 12:\n        print(f\"  … +{len(workers)-12} more\")\n    print(f\"Aggregate threads: {total_threads}  (parallel part capacity)\")\n    if len(workers) < 2:\n        print(\n            \"⚠ Only one worker — multi-core box is under-used. \"\n            \"Raise DaskCluster.spec.worker.replicas (see markdown above).\"\n        )\nelse:\n    if client is not None:\n        print(\"Local client — workers = threads in this process\")\n\n\ndef _worker_env_probe():\n    import os, socket\n    return {\n        \"host\": socket.gethostname(),\n        \"S3_ENDPOINT\": os.environ.get(\"S3_ENDPOINT\") or os.environ.get(\"AWS_ENDPOINT_URL\") or \"\",\n        \"AWS_ACCESS_KEY_ID\": (os.environ.get(\"AWS_ACCESS_KEY_ID\") or \"\")[:4] + \"…\",\n        \"has_h5py\": __import__(\"importlib\").util.find_spec(\"h5py\") is not None,\n        \"has_s3fs\": __import__(\"importlib\").util.find_spec(\"s3fs\") is not None,\n    }\n\n\nif client is not None and _n_workers(client) > 0:\n    probe = client.run(_worker_env_probe)\n    print(\"Worker env probe (first 4):\")\n    for k, v in list(probe.items())[:4]:\n        print(f\"  {k}: {v}\")\n"},{"cell_type":"code","metadata":{},"execution_count":null,"outputs":[],"source":"# --- Multi-file Dask array over HDF5 Values (one task per part) ---\n# Geometry comes from inventory/cfg — do NOT download a sample on the client.\n\nAK = os.environ.get(\"AWS_ACCESS_KEY_ID\", \"admin\")\nSK = os.environ.get(\"AWS_SECRET_ACCESS_KEY\", \"admin\")\n\n# Prefer inventory order; cap parts for demos\n_meta = inventory[: int(MAX_PARTS)] if MAX_PARTS else list(inventory)\nkeys = [m[\"key\"] for m in _meta]\nn_parts_use = len(keys)\nif n_parts_use == 0:\n    raise RuntimeError(\"inventory is empty — run ensure_parts first\")\n\n# Declared geometry (reused inventory may only know cfg defaults)\nn_series_full = int(_meta[0].get(\"n_series\") or cfg.n_series)\nn_time_full = int(_meta[0].get(\"n_time\") or cfg.n_time)\ns_stride = max(1, int(SERIES_STRIDE))\nt_stride = max(1, int(TIME_STRIDE))\nn_series_r = (n_series_full + s_stride - 1) // s_stride\nn_time_r = (n_time_full + t_stride - 1) // t_stride\nblock_shape = (n_series_r, n_time_r)\n\nprint(f\"Parts in Dask graph: {n_parts_use}\")\nprint(f\"Full geometry: {n_series_full} × {n_time_full}  strides: {s_stride}×{t_stride}\")\nprint(f\"Block shape per part: {block_shape}  dtype=float32\")\nprint(f\"Logical values_da: ({n_series_r}, {n_time_r * n_parts_use})\")\n\n\ndef read_values_hyperslab(\n    bucket,\n    key,\n    endpoint,\n    access_key,\n    secret_key,\n    series_stride=1,\n    time_stride=1,\n):\n    \"\"\"Worker task: fetch one .h5 from S3 and return Values[::ss, ::ts] / scale.\n\n    Runs entirely on a Dask worker (or local scheduler). Returns float32 only —\n    never ships the full int16 plane to the notebook unless you .compute() it.\n    \"\"\"\n    import tempfile\n    import h5py\n    import numpy as np\n    import s3fs\n\n    s3 = s3fs.S3FileSystem(\n        key=access_key,\n        secret=secret_key,\n        client_kwargs={\"endpoint_url\": endpoint} if endpoint else {},\n        config_kwargs={\n            \"s3\": {\"addressing_style\": \"path\"},\n            \"signature_version\": \"s3v4\",\n        },\n    )\n    with tempfile.NamedTemporaryFile(suffix=\".h5\") as tmp:\n        s3.get(f\"{bucket}/{key}\", tmp.name)\n        with h5py.File(tmp.name, \"r\") as f:\n            rm = f[\"ResourceMetrics\"]\n            met = rm[\"Metric_0\"] if \"Metric_0\" in rm else rm[\"Metric[0]\"]\n            ds = met[\"Values\"]\n            arr = np.asarray(\n                ds[:: max(1, series_stride), :: max(1, time_stride)],\n                dtype=np.float32,\n            )\n            scale = float(met.attrs.get(\"scale.factor\", 1.0)) or 1.0\n            return arr / scale\n\n\n# Build delayed graph — tasks stay lazy until compute/persist\ndelayed_reads = [\n    delayed(read_values_hyperslab)(\n        BUCKET, k, S3_ENDPOINT, AK, SK, s_stride, t_stride\n    )\n    for k in keys\n]\nblocks = [\n    da.from_delayed(d, shape=block_shape, dtype=np.float32) for d in delayed_reads\n]\n# Concatenate along time: (series, time_total)\nvalues_da = da.concatenate(blocks, axis=1)\nvalues_da = values_da.rechunk({0: -1, 1: n_time_r})  # one chunk per part on time axis\n\nprint(\"Dask array:\", values_da)\nprint(\"chunks:\", values_da.chunks)\nprint(\"npartitions (time blocks):\", values_da.npartitions)\nprint(\n    \"Approx graph bytes if fully realized: \"\n    f\"{values_da.nbytes / 1e9:.3f} GiB  (stays on workers until reduced)\"\n)\n\n# Optional: show the task graph size (cheap)\nprint(\"Delayed layers:\", len(values_da.dask))\n"},{"cell_type":"markdown","metadata":{},"source":"## Distributed reductions (prove Dask is doing the work)\n\nThese cells call `.compute()` on **reductions**, not the full array. Each part is\nfetched and reduced on a worker; the client receives scalars / small vectors only.\n\nOpen the Dask dashboard while running — you should see tasks proportional to part count.\n"},{"cell_type":"code","metadata":{},"outputs":[],"execution_count":null,"source":"# --- Worker-side reductions over all parts ---\nimport time\n\n# Global mean / std / min / max — tree-reduced across part chunks (workers only)\nt0 = time.time()\nglob_mean, glob_std, glob_min, glob_max = dask.compute(\n    values_da.mean(),\n    values_da.std(),\n    values_da.min(),\n    values_da.max(),\n)\nprint(\n    f\"global mean={float(glob_mean):.6g}  std={float(glob_std):.6g}  \"\n    f\"min={float(glob_min):.6g}  max={float(glob_max):.6g}  \"\n    f\"({time.time() - t0:.1f}s)\"\n)\n\n# Per-part mean: each time-chunk is one part (see rechunk above)\ndef _chunk_mean(block):\n    import numpy as np\n    return np.asarray([np.nanmean(block)], dtype=np.float64)\n\n# values_da.mean(axis=0) → (time_total,) with n_parts_use chunks\nseries_mean_t = values_da.mean(axis=0)\npart_means = series_mean_t.map_blocks(\n    _chunk_mean,\n    dtype=np.float64,\n    chunks=((1,) * n_parts_use,),\n)\nt1 = time.time()\npart_means_np = np.asarray(part_means.compute(), dtype=np.float64).ravel()\nprint(\n    f\"per-part means ({part_means_np.size}): \"\n    f\"{part_means_np[:8]}{'…' if part_means_np.size > 8 else ''}\"\n)\nprint(f\"per-part reduction wall time: {time.time() - t1:.1f}s\")\n\n# Per-series RMS across all time → only n_series_r floats return to client\nt2 = time.time()\nseries_rms = da.sqrt((values_da.astype(np.float64) ** 2).mean(axis=1))\nseries_rms_np = np.asarray(series_rms.compute(), dtype=np.float64)\nprint(\n    f\"series RMS shape={series_rms_np.shape}  \"\n    f\"mean_rms={float(series_rms_np.mean()):.6g}  ({time.time() - t2:.1f}s)\"\n)\nprint(\"↑ Check the Dask dashboard — tasks should scale with part count / graph depth.\")\n"},{"cell_type":"markdown","metadata":{},"source":"## Interactive heatmap — viewport-driven Dask (lab ≈ multi-TB design)\n\nStatic Bokeh zoom on a pre-computed image does **not** touch Dask. For multi-TB that\nwould be wrong: the client must never hold the plane, and pan/zoom must re-query.\n\n**Design (same code path for lab ~10 GiB and `airgap_2tb`):**\n\n```\nvisible (series × time) window + screen size\n        │\n        ▼\n  stride so ≈ width × height samples\n        │\n        ▼\n  values_da[s0:s1:ss, t0:t1:ts].compute()   ← only overlapping part-chunks\n        │\n        ▼\n  hv.Image (coords only)  →  dashboard shows new tasks each pan/zoom\n```\n\n- One Dask chunk = one object-store part (time axis). Slicing drops non-overlapping parts.\n- Series/time strides shrink worker I/O before any bytes hit the notebook.\n- Lab dataset is small enough to feel interactive; multi-TB uses the **identical**\n  viewport contract (just more parts outside the window).\n"},{"cell_type":"code","metadata":{},"outputs":[],"execution_count":null,"source":"# --- Viewport-driven Holoviews: every pan/zoom re-aggregates on Dask ---\nimport os\nimport time\nimport io\nimport base64\n\nos.environ.setdefault(\"BOKEH_RESOURCES\", \"inline\")\n\nimport holoviews as hv\nfrom holoviews.streams import RangeXY, PlotSize\nfrom bokeh.resources import INLINE\nfrom bokeh.embed import file_html\nfrom IPython.display import display, IFrame, Image as IPImage\n\nhv.config.image_rtol = 1.0\nhv.extension(\"bokeh\", inline=True)\n\ntry:\n    import panel as pn\n    pn.extension()\n    _HAS_PANEL = True\nexcept Exception as _e:\n    _HAS_PANEL = False\n    print(\"panel unavailable:\", _e)\n\n# Full logical extents of the multi-file array (already strided at read if SERIES/TIME_STRIDE>1)\n_N_SERIES, _N_TIME = int(values_da.shape[0]), int(values_da.shape[1])\n_PART_T = int(n_time_r)  # samples per part-chunk on the time axis\nprint(f\"values_da shape (series, time) = ({_N_SERIES}, {_N_TIME})  part_chunk_time={_PART_T}\")\nprint(f\"parts in graph: {n_parts_use}  — zoom should schedule only overlapping parts\")\n\n# Telemetry for the notebook user (also watch the dashboard)\n_viewport_stats = {\"calls\": 0, \"last_s\": 0.0, \"last_shape\": None, \"last_parts\": 0}\n\n\ndef _array_to_png_bytes(a, width=900, height=420):\n    from PIL import Image as PILImage\n    a = np.asarray(a, dtype=np.float64)\n    finite = np.isfinite(a)\n    if finite.any():\n        lo, hi = float(a[finite].min()), float(a[finite].max())\n        if hi <= lo:\n            hi = lo + 1.0\n        a = (a - lo) / (hi - lo)\n    else:\n        a = np.zeros_like(a)\n    a = np.clip(a, 0.0, 1.0)\n    rgb = (\n        np.stack(\n            [\n                np.clip(1.5 * a, 0, 1),\n                np.clip(1.5 * a - 0.5, 0, 1),\n                np.clip(1.5 * a - 1.0, 0, 1),\n            ],\n            axis=-1,\n        )\n        * 255\n    ).astype(np.uint8)\n    im = PILImage.fromarray(rgb, mode=\"RGB\").resize((int(width), int(height)), PILImage.NEAREST)\n    buf = io.BytesIO()\n    im.save(buf, format=\"PNG\")\n    return buf.getvalue()\n\n\ndef viewport_to_image(x_range, y_range, width=900, height=420, scale=1.0):\n    \"\"\"Map the visible axes → Dask slice → small Image. Runs on every pan/zoom.\n\n    x_range → time samples, y_range → series indices (matches hv.Image kdims).\n    \"\"\"\n    w = max(int(width or 900), 2)\n    h = max(int(height or 420), 2)\n\n    if x_range is None or x_range[0] is None:\n        t0, t1 = 0, _N_TIME\n    else:\n        t0 = int(np.floor(min(float(x_range[0]), float(x_range[1]))))\n        t1 = int(np.ceil(max(float(x_range[0]), float(x_range[1])))) + 1\n    if y_range is None or y_range[0] is None:\n        s0, s1 = 0, _N_SERIES\n    else:\n        s0 = int(np.floor(min(float(y_range[0]), float(y_range[1]))))\n        s1 = int(np.ceil(max(float(y_range[0]), float(y_range[1])))) + 1\n\n    t0 = max(0, min(t0, _N_TIME - 1))\n    t1 = max(t0 + 1, min(t1, _N_TIME))\n    s0 = max(0, min(s0, _N_SERIES - 1))\n    s1 = max(s0 + 1, min(s1, _N_SERIES))\n\n    t_span, s_span = t1 - t0, s1 - s0\n    # Target ~1 sample per screen pixel (cap work on huge zooms-out)\n    t_stride = max(1, int(np.ceil(t_span / w)))\n    s_stride = max(1, int(np.ceil(s_span / h)))\n\n    slab = values_da[s0:s1:s_stride, t0:t1:t_stride]\n    part0 = t0 // max(_PART_T, 1)\n    part1 = (t1 - 1) // max(_PART_T, 1)\n    n_parts_touch = int(part1 - part0 + 1)\n\n    t_wall = time.time()\n    # *** This is the Dask engagement point for interactive viz ***\n    arr = np.asarray(slab.compute(), dtype=np.float32)\n    dt = time.time() - t_wall\n\n    ss, tt = arr.shape\n    xs = np.arange(t0, t1, t_stride, dtype=np.float64)[:tt]\n    ys = np.arange(s0, s1, s_stride, dtype=np.float64)[:ss]\n    if arr.shape != (ys.size, xs.size):\n        # defensive: align coords to actual array\n        ys = ys[: arr.shape[0]]\n        xs = xs[: arr.shape[1]]\n        arr = arr[: ys.size, : xs.size]\n\n    _viewport_stats[\"calls\"] += 1\n    _viewport_stats[\"last_s\"] = dt\n    _viewport_stats[\"last_shape\"] = tuple(arr.shape)\n    _viewport_stats[\"last_parts\"] = n_parts_touch\n    print(\n        f\"[Dask viewport #{_viewport_stats['calls']}] \"\n        f\"series[{s0}:{s1}:{s_stride}] time[{t0}:{t1}:{t_stride}] \"\n        f\"→ {arr.shape}  parts≈{n_parts_touch}/{n_parts_use}  {dt:.2f}s\"\n    )\n\n    return hv.Image(\n        (xs, ys, arr),\n        kdims=[\"time_sample\", \"series\"],\n        vdims=[\"value\"],\n        rtol=1.0,\n    ).opts(\n        cmap=\"fire\",\n        colorbar=True,\n        width=w,\n        height=h,\n        xlabel=\"time sample (concatenated parts)\",\n        ylabel=\"series index\",\n        title=(\n            f\"CPHY Values — Dask viewport  parts≈{n_parts_touch}/{n_parts_use}  \"\n            f\"{dt:.2f}s  (#{_viewport_stats['calls']})\"\n        ),\n        default_tools=[\"pan\", \"wheel_zoom\", \"box_zoom\", \"reset\", \"hover\"],\n        active_tools=[\"wheel_zoom\"],\n        framewise=True,\n        axiswise=True,\n    )\n\n\n# Seed full-extent ranges so first paint is a complete overview (still via Dask)\n_range = RangeXY(x_range=(0.0, float(_N_TIME)), y_range=(0.0, float(_N_SERIES)))\n_size = PlotSize(width=900, height=420)\nheatmap_dmap = hv.DynamicMap(viewport_to_image, streams=[_range, _size])\n_range.source = heatmap_dmap\n\nprint(\n    \"Pan/zoom the plot below and watch:\\n\"\n    \"  • Dask dashboard for new tasks\\n\"\n    \"  • stdout lines `[Dask viewport #N] … parts≈k/N`\\n\"\n    \"Full multi-TB uses this same windowed contract — only parts under the brush run.\"\n)\n\nif _HAS_PANEL:\n    # Panel/ipywidgets comms so DynamicMap callbacks hit the kernel (air-gap, no jupyter_bokeh)\n    display(pn.panel(heatmap_dmap, width=940, height=460))\nelse:\n    display(heatmap_dmap)\n\n# Optional: one-shot PNG of the current full overview (no interaction) for export\n# overview = viewport_to_image((0, _N_TIME), (0, _N_SERIES), 900, 420)\n"},{"cell_type":"code","metadata":{},"outputs":[],"execution_count":null,"source":"# --- Series profile + hist for the *last* Dask viewport (or a fresh mid-series pull) ---\n# Re-run after zooming to sample the current window; or pull one series across all time.\n\ndef dask_series_profile(series_idx=None, x_range=None):\n    \"\"\"Worker-side 1D profile — only the selected series (and optional time window).\"\"\"\n    n_s, n_t = int(values_da.shape[0]), int(values_da.shape[1])\n    if series_idx is None:\n        series_idx = n_s // 2\n    series_idx = int(np.clip(series_idx, 0, n_s - 1))\n    if x_range is None or x_range[0] is None:\n        t0, t1 = 0, n_t\n    else:\n        t0 = max(0, int(np.floor(min(x_range))))\n        t1 = min(n_t, int(np.ceil(max(x_range))) + 1)\n    t_span = max(1, t1 - t0)\n    t_stride = max(1, t_span // 4000)\n    curve_da = values_da[series_idx, t0:t1:t_stride]\n    t_wall = time.time()\n    y = np.asarray(curve_da.compute(), dtype=np.float32)\n    print(\n        f\"[Dask profile] series={series_idx} time[{t0}:{t1}:{t_stride}] \"\n        f\"→ {y.shape}  {time.time() - t_wall:.2f}s\"\n    )\n    x = np.arange(t0, t1, t_stride, dtype=np.float64)[: y.size]\n    return x, y\n\n\n_s_mid = _N_SERIES // 2\nif _viewport_stats.get(\"calls\"):\n    print(f\"Last viewport: {_viewport_stats}\")\n\nx_prof, y_prof = dask_series_profile(\n    _s_mid, x_range=_range.x_range if _range.x_range else None\n)\nprofile = hv.Curve((x_prof, y_prof), kdims=\"time_sample\", vdims=\"value\").opts(\n    width=900,\n    height=200,\n    title=f\"Series {_s_mid} profile (Dask-fetched)\",\n    color=\"#4fc3f7\",\n)\nhist = hv.Histogram(\n    np.histogram(y_prof[:: max(1, y_prof.size // 50_000)], bins=80)\n).opts(\n    width=900,\n    height=200,\n    title=\"Value distribution (profile samples)\",\n    xlabel=\"normalized phase\",\n)\nlayout = (profile + hist).cols(1)\n\n# Prefer Panel (no iframe warning). Fall back to IFrame + INLINE Bokeh for air-gap.\nif \"_HAS_PANEL\" in dir() and _HAS_PANEL:\n    display(pn.panel(layout, width=940, height=440))\nelse:\n    try:\n        from IPython.display import IFrame\n\n        renderer = hv.renderer(\"bokeh\")\n        plot = renderer.get_plot(layout).state\n        html_doc = file_html(plot, INLINE, \"profile\")\n        if \"cdn.bokeh.org\" in html_doc:\n            raise RuntimeError(\"CDN still present in HTML\")\n        b64 = base64.b64encode(html_doc.encode(\"utf-8\")).decode(\"ascii\")\n        display(\n            IFrame(\n                src=f\"data:text/html;base64,{b64}\",\n                width=940,\n                height=480,\n            )\n        )\n    except Exception as e:\n        print(\"profile display fallback:\", e)\n        display(layout)\n\nif \"series_rms_np\" in globals():\n    top = np.argsort(series_rms_np)[-8:][::-1]\n    print(\"Top series by RMS (from reductions cell):\", list(map(int, top)))\n"},{"cell_type":"markdown","metadata":{},"source":"## Parallel timestamp continuity (Dask `client.map`)\n\nEach part’s Timestamps bounds are read on workers in parallel — same S3 fetch pattern\nas Values, but only returns 4 scalars per file.\n"},{"cell_type":"code","metadata":{},"outputs":[],"execution_count":null,"source":"def read_ts_bounds(bucket, key, endpoint, access_key, secret_key):\n    import tempfile, h5py, s3fs\n    s3 = s3fs.S3FileSystem(\n        key=access_key,\n        secret=secret_key,\n        client_kwargs={\"endpoint_url\": endpoint} if endpoint else {},\n        config_kwargs={\"s3\": {\"addressing_style\": \"path\"}, \"signature_version\": \"s3v4\"},\n    )\n    with tempfile.NamedTemporaryFile(suffix=\".h5\") as tmp:\n        s3.get(f\"{bucket}/{key}\", tmp.name)\n        with h5py.File(tmp.name, \"r\") as f:\n            rm = f[\"ResourceMetrics\"]\n            met = rm[\"Metric_0\"] if \"Metric_0\" in rm else rm[\"Metric[0]\"]\n            ts = met[\"Timestamps\"]\n            unit = ts.attrs.get(\"unit\", b\"ns\")\n            if isinstance(unit, bytes):\n                unit = unit.decode()\n            return {\n                \"key\": key,\n                \"t0\": int(ts[0]),\n                \"t1\": int(ts[-1]),\n                \"start.index\": int(ts.attrs[\"start.index\"]),\n                \"unit\": str(unit),\n            }\n\n\n# Parallel map over parts (cap for very large inventories)\n_ts_keys = keys[: min(len(keys), 64)]\nif client is not None:\n    futures = client.map(\n        read_ts_bounds,\n        [BUCKET] * len(_ts_keys),\n        _ts_keys,\n        [S3_ENDPOINT] * len(_ts_keys),\n        [AK] * len(_ts_keys),\n        [SK] * len(_ts_keys),\n        pure=False,\n    )\n    ts_rows = client.gather(futures)\nelse:\n    ts_rows = [\n        read_ts_bounds(BUCKET, k, S3_ENDPOINT, AK, SK) for k in _ts_keys\n    ]\n\nbdf = pd.DataFrame(ts_rows)\nbdf.insert(0, \"part\", range(len(bdf)))\nprint(bdf.head(12))\nif len(bdf) > 1:\n    gaps = bdf[\"t0\"].to_numpy()[1:] - bdf[\"t1\"].to_numpy()[:-1]\n    print(\"inter-part Δ t0[i+1]-t1[i] (first 8):\", gaps[:8])\n"},{"cell_type":"markdown","metadata":{},"source":"## Next steps (metadata plane)\n\n1. **Registration pipeline** — scan product prefixes / layout adapters → `telemetry.hdf5_datasets` + chunk stats.\n2. **Kerchunk** — ranged GETs without full object download (next efficiency win for Dask).\n3. **Overviews** — Iceberg parquet pyramids for first-paint datashader.\n4. **File Format API** — HDF5 as first-class Iceberg data files.\n\n### Dask workers (multi-core / 2 TiB)\n\n| Environment | Suggested replicas | nthreads | notes |\n|-------------|-------------------|----------|--------|\n| Laptop / smoke | 1–2 | 2 | `DASK_WORKER_REPLICAS=1` |\n| Multi-core lab node (this class) | **8–16** | 2–4 | pack workers; CPU limit ≥ nthreads |\n| Air-gap multi-node | **16–32** | 2–4 | ~2–4× node count; spill on fast disk |\n| Full `airgap_2tb` (~21.5k parts) | **32+** | 2 | one task/part → want wide pool |\n\n```bash\n# Package deploy\nzarf package deploy … --set DASK_WORKER_REPLICAS=8 \\\n  --set DASK_WORKER_NTHREADS=2 --set DASK_WORKER_CPU=2 --set DASK_WORKER_MEMORY=6Gi\n\n# Live scale (operator CR)\nkubectl -n dask patch daskcluster cybersec-dask --type merge \\\n  -p '{\"spec\":{\"worker\":{\"replicas\":8}}}'\n```\n\n### Viewport viz (multi-TB contract)\n\nPan/zoom on the heatmap calls ``values_da[window].compute()`` so **only parts under\nthe brush** run. Lab ~10 GiB proves the pattern; ``airgap_2tb`` uses the same cell.\n\n### Read knobs\n\n```python\nSERIES_STRIDE = 4      # worker-side series decimation\nTIME_STRIDE = 2\nMAX_PARTS = 16         # limit graph width for demos\nTARGET_WORKERS = 8     # notebook waits / tries to scale\n```\n\n### Re-runs\n\n```python\nFORCE_REGENERATE = False   # default: Run All reuses parts\n```\n"},{"cell_type":"code","metadata":{},"outputs":[],"execution_count":null,"source":"# Optional cleanup\n# if client is not None:\n#     client.close()\nprint(\"Notebook complete.\")\nprint(f\"Parts in inventory: {len(inventory)}  used in Dask graph: {n_parts_use}\")\nprint(f\"values_da: {values_da}\")\nprint(f\"FORCE_REGENERATE was {FORCE_REGENERATE}\")\nif client is not None:\n    print(\"Dashboard:\", getattr(client, \"dashboard_link\", \"\"))\n"}]}
