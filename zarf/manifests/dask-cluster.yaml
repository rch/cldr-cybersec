# DaskCluster for Cybersec air-gap deployment
# Uses the custom cybersec-dask image with pre-baked Python dependencies
#
# Zarf template variables:
#   ###ZARF_VAR_DASK_WORKER_REPLICAS### - Number of worker replicas
#   ###ZARF_VAR_DASK_SPILL_DIR### - Host path for worker spill-to-disk
#   ###ZARF_REGISTRY### - Zarf-injected registry URL (for image rewriting)
---
apiVersion: kubernetes.dask.org/v1
kind: DaskCluster
metadata:
  name: cybersec-dask
  namespace: dask
  labels:
    app.kubernetes.io/name: cybersec-dask
    app.kubernetes.io/component: cluster
    app.kubernetes.io/managed-by: zarf
    app.kubernetes.io/part-of: cybersec
spec:
  scheduler:
    service:
      type: NodePort
      selector:
        dask.org/cluster-name: cybersec-dask
        dask.org/component: scheduler
      ports:
        - name: tcp-comm
          port: 8786
          targetPort: tcp-comm
          nodePort: 30086
        - name: tcp-dashboard
          port: 8787
          targetPort: tcp-dashboard
          nodePort: 30087
    spec:
      restartPolicy: Always
      containers:
        - name: scheduler
          # Image will be rewritten by Zarf to use internal registry
          image: localhost:5555/cybersec-dask:2025.2.0
          imagePullPolicy: IfNotPresent
          args:
            - dask-scheduler
          ports:
            - containerPort: 8786
              name: tcp-comm
            - containerPort: 8787
              name: tcp-dashboard
          # AWS credentials are intentionally NOT set here. On AWS deploys,
          # the worker nodes' EC2 instance role (cybersec-dask-rke2-node has
          # s3:GetObject/PutObject on cybersec-dask-*) covers S3 access via
          # IMDS, and boto3/s3fs default credential chain finds them with
          # zero env-var configuration. STS temp credentials baked into
          # env vars at deploy-time (the previous default behaviour) expire
          # in ~1 hour, after which every Dask worker fails with
          # "InvalidAccessKeyId" — see docs/scratch/2026-05-28/. For non-AWS
          # S3 (MinIO local, or a different AWS account's bucket), set
          # ZARF_VAR_S3_ACCESS_KEY / ZARF_VAR_S3_SECRET_KEY / ZARF_VAR_S3_SESSION_TOKEN
          # explicitly when running `zarf package deploy`; the Helm chart in
          # the cybersec-dask component will then add the corresponding env
          # vars at render time.
          env:
            - name: S3_ENDPOINT
              value: "###ZARF_VAR_S3_ENDPOINT###"
            - name: AWS_REGION
              value: "###ZARF_VAR_S3_REGION###"
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: tcp-dashboard
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: tcp-dashboard
            initialDelaySeconds: 15
            periodSeconds: 30
  worker:
    replicas: ###ZARF_VAR_DASK_WORKER_REPLICAS###
    spec:
      restartPolicy: Always
      containers:
        - name: worker
          # Image will be rewritten by Zarf to use internal registry
          image: localhost:5555/cybersec-dask:2025.2.0
          imagePullPolicy: IfNotPresent
          args:
            - dask-worker
            - --nthreads
            - "2"
            - --memory-limit
            - 6Gi
            - --local-directory
            - /dask-spill
          # See scheduler comment above — AWS creds come from the EC2
          # instance role via IMDS on AWS deploys; only set ZARF_VAR_S3_*
          # for non-AWS S3 (MinIO local, foreign-account bucket).
          env:
            - name: DASK_DASHBOARD_ADDRESS
              value: ":8787"
            - name: S3_ENDPOINT
              value: "###ZARF_VAR_S3_ENDPOINT###"
            - name: AWS_REGION
              value: "###ZARF_VAR_S3_REGION###"
          volumeMounts:
            - name: dask-spill
              mountPath: /dask-spill
          resources:
            requests:
              cpu: "250m"
              memory: 4Gi
            limits:
              cpu: "1"
              memory: 6Gi
      volumes:
        - name: dask-spill
          hostPath:
            path: "###ZARF_VAR_DASK_SPILL_DIR###"
            type: DirectoryOrCreate
