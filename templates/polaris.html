<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polaris Insights - Iceberg Browser</title>
    <!-- Google Fonts: Orbitron for titles, Inter for UI, JetBrains Mono for data -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           Tyrell Keiretsu Design System
           Blade Runner + Event Horizon Aesthetic
           ============================================ */
        :root {
            /* Primary - Tyrell Amber */
            --color-amber: #D4A84B;
            --color-gold: #FFD700;
            --color-bronze: #CD853F;

            /* Backgrounds - Event Horizon Void */
            --color-void: #0A0A0F;
            --color-charcoal: #12121A;
            --color-containment: #1A1A24;
            --color-grid: #252532;

            /* Status - Gravity Drive Spectrum */
            --color-success: #00FF88;
            --color-info: #00FFFF;
            --color-warning: #FFB347;
            --color-error: #FF4444;

            /* Text */
            --text-primary: #E8E8F0;
            --text-secondary: #A0A0B0;
            --text-muted: #606070;
            --text-terminal: #00FF88;

            /* Typography */
            --font-display: 'Orbitron', system-ui, sans-serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;

            /* Effects */
            --glow-amber: 0 0 20px rgba(212, 168, 75, 0.3);
            --glow-success: 0 0 10px rgba(0, 255, 136, 0.4);
            --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: var(--color-void);
            color: var(--text-primary);
            line-height: 1.6;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: linear-gradient(180deg, var(--color-void) 0%, var(--color-charcoal) 100%);
            color: var(--text-primary);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--color-amber);
            box-shadow: 0 1px 0 rgba(212, 168, 75, 0.3), 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-title h1 {
            font-family: var(--font-display);
            font-size: 1.5em;
            font-weight: 700;
            color: var(--color-amber);
            text-shadow: 0 0 20px rgba(212, 168, 75, 0.4);
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9em;
            padding: 6px 12px;
            border: 1px solid var(--color-grid);
            border-radius: 2px;
            transition: all 0.2s;
        }

        .back-link:hover {
            color: var(--color-amber);
            border-color: var(--color-amber);
        }

        #catalog-status {
            font-family: var(--font-mono);
            font-size: 0.85em;
            color: var(--text-secondary);
        }

        /* Main Layout */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar - Tree View */
        .sidebar {
            width: 300px;
            background: var(--color-charcoal);
            border-radius: 4px;
            border: 1px solid var(--color-grid);
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--color-grid);
            font-weight: 600;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--color-amber);
            background: var(--color-containment);
        }

        .tree-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .tree-item {
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 2px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            transition: all 0.2s;
            font-size: 0.9em;
        }

        .tree-item:hover {
            background: rgba(212, 168, 75, 0.1);
            color: var(--color-amber);
        }

        .tree-item.active {
            background: rgba(212, 168, 75, 0.15);
            color: var(--color-amber);
            font-weight: 500;
            border-left: 2px solid var(--color-amber);
        }

        .icon {
            width: 16px;
            text-align: center;
            color: var(--color-amber);
        }

        .icon svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        /* Main Content - Details Panel */
        .details-panel {
            flex: 1;
            background: var(--color-charcoal);
            border-radius: 4px;
            border: 1px solid var(--color-grid);
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            font-size: 1em;
        }

        .empty-state .icon-large {
            width: 48px;
            height: 48px;
            margin-bottom: 15px;
            fill: var(--color-amber);
            opacity: 0.5;
        }

        .panel-header {
            padding: 20px;
            border-bottom: 1px solid var(--color-grid);
        }

        .panel-title {
            font-size: 1.3em;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-subtitle {
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 0.85em;
        }

        .status-badge {
            padding: 3px 10px;
            border-radius: 2px;
            font-family: var(--font-mono);
            font-size: 0.7em;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            vertical-align: middle;
        }

        .status-up {
            background: rgba(0, 255, 136, 0.15);
            color: var(--color-success);
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .status-down {
            background: rgba(255, 68, 68, 0.15);
            color: var(--color-error);
            border: 1px solid rgba(255, 68, 68, 0.3);
        }

        /* Tabs */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--color-grid);
            padding: 0 20px;
            background: var(--color-containment);
        }

        .tab {
            padding: 12px 20px;
            cursor: pointer;
            color: var(--text-muted);
            border-bottom: 2px solid transparent;
            font-weight: 500;
            font-size: 0.9em;
            transition: all 0.2s;
        }

        .tab:hover {
            color: var(--color-amber);
        }

        .tab.active {
            color: var(--color-amber);
            border-bottom-color: var(--color-amber);
        }

        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Info Grids */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .info-card {
            border: 1px solid var(--color-grid);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        /* Containment brackets */
        .info-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 12px;
            height: 12px;
            border-top: 2px solid var(--color-amber);
            border-left: 2px solid var(--color-amber);
        }

        .info-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 12px;
            height: 12px;
            border-bottom: 2px solid var(--color-amber);
            border-right: 2px solid var(--color-amber);
        }

        .info-card-header {
            background: var(--color-containment);
            padding: 10px 15px;
            font-weight: 600;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--color-amber);
            border-bottom: 1px solid var(--color-grid);
        }

        .info-list {
            padding: 10px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 5px;
            border-bottom: 1px solid var(--color-grid);
            font-size: 0.85em;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .label {
            color: var(--text-secondary);
        }

        .value {
            color: var(--text-primary);
            font-family: var(--font-mono);
            word-break: break-all;
            text-align: right;
            margin-left: 10px;
        }

        /* Tables and JSON */
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: var(--font-mono);
            font-size: 0.85em;
        }

        th {
            text-align: left;
            padding: 10px;
            background: var(--color-containment);
            border-bottom: 1px solid var(--color-amber);
            color: var(--color-amber);
            font-family: var(--font-body);
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid var(--color-grid);
            color: var(--text-secondary);
        }

        tr:hover {
            background: rgba(212, 168, 75, 0.05);
        }

        pre {
            background: var(--color-void);
            padding: 15px;
            border-radius: 2px;
            border: 1px solid var(--color-grid);
            overflow-x: auto;
            font-family: var(--font-mono);
            font-size: 0.8em;
            color: var(--color-success);
        }
    </style>
</head>

<body>
    <header>
        <div class="header-title">
            <a href="/" class="back-link">← Back</a>
            <h1>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71L12 2z"/></svg>
                Polaris Insights
            </h1>
        </div>
        <div id="catalog-status">Initializing...</div>
    </header>

    <div class="workspace">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">Catalog Explorer</div>
            <div id="tree-view" class="tree-container">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- Details Panel -->
        <div class="details-panel" id="details-view">
            <div class="empty-state">
                <svg class="icon-large" viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="11" cy="11" r="8" fill="none" stroke="currentColor" stroke-width="2"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2"></line>
                </svg>
                <p>Select an item from the explorer to view details</p>
            </div>
        </div>
    </div>

    <script>
        // Store catalog structure
        let catalogData = null;

        // Theme loader - load and apply user's theme preference
        async function loadTheme() {
            try {
                const response = await fetch('/api/ui/theme');
                const { theme } = await response.json();
                await applyTheme(theme);
            } catch (err) {
                console.warn('Failed to load theme preference:', err);
            }
        }

        async function applyTheme(themeId) {
            try {
                const response = await fetch(`/api/themes/${themeId}`);
                const theme = await response.json();

                // Apply CSS variables to document root
                Object.entries(theme.variables || {}).forEach(([key, value]) => {
                    document.documentElement.style.setProperty(key, value);
                });
            } catch (err) {
                console.warn('Failed to apply theme:', err);
            }
        }

        document.addEventListener('DOMContentLoaded', async function() {
            await loadTheme();
            initialize();
        });

        async function initialize() {
            try {
                const response = await fetch('/api/catalog-info');
                catalogData = await response.json();

                updateStatus(catalogData.status);
                renderTree(catalogData.structure);

                // Show root details by default
                showRootDetails();
            } catch (err) {
                console.error("Failed to load catalog info", err);
            }
        }

        function updateStatus(status) {
            const statusEl = document.getElementById('catalog-status');
            const color = status === 'UP' ? '#2ecc71' : '#e74c3c';
            statusEl.innerHTML = `<span style="color: ${color}">●</span> Polaris ${status}`;
        }

        // SVG icons for tree view
        const TREE_ICONS = {
            root: '<svg viewBox="0 0 24 24"><path d="M12 3L4 9v12h16V9l-8-6zm0 2.5L18 10v9H6v-9l6-4.5z"/></svg>',
            namespace: '<svg viewBox="0 0 24 24"><path d="M21 16.5c0 .38-.21.71-.53.88l-7.9 4.44c-.36.2-.8.2-1.14 0l-7.9-4.44A.991.991 0 013 16.5v-9c0-.38.21-.71.53-.88l7.9-4.44c.36-.2.8-.2 1.14 0l7.9 4.44c.32.17.53.5.53.88v9zM12 4.15L5 8.09v7.82l7 3.94 7-3.94V8.09l-7-3.94z"/></svg>',
            table: '<svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11z"/></svg>'
        };

        function renderTree(structure) {
            const container = document.getElementById('tree-view');
            container.innerHTML = '';

            // Root Item
            const rootItem = createTreeItem('Rest Catalog (Default)', 'root', TREE_ICONS.root, () => showRootDetails());
            rootItem.classList.add('active');
            container.appendChild(rootItem);

            for (const [namespace, tables] of Object.entries(structure)) {
                // Namespace Item
                const nsItem = createTreeItem(namespace, 'namespace', TREE_ICONS.namespace, () => showNamespaceDetails(namespace));
                container.appendChild(nsItem);

                // Table Items
                tables.forEach(table => {
                    const fullName = `${namespace}.${table}`;
                    const tableItem = createTreeItem(table, 'table', TREE_ICONS.table, () => showTableDetails(fullName));
                    tableItem.style.paddingLeft = '32px'; // Indent
                    container.appendChild(tableItem);
                });
            }
        }

        function createTreeItem(label, type, icon, onClick) {
            const div = document.createElement('div');
            div.className = 'tree-item';
            div.dataset.type = type;
            div.innerHTML = `<span class="icon">${icon}</span> ${label}`;
            div.onclick = () => {
                // Handle Active State
                document.querySelectorAll('.tree-item').forEach(el => el.classList.remove('active'));
                div.classList.add('active');
                onClick();
            };
            return div;
        }

        function showRootDetails() {
            const panel = document.getElementById('details-view');
            panel.innerHTML = `
                <div class="panel-header">
                    <div class="panel-title">REST Catalog <span class="status-badge status-${catalogData.status.toLowerCase()}">${catalogData.status}</span></div>
                    <div class="panel-subtitle">Polaris Managed Catalog</div>
                </div>
                <div class="tab-content active" style="padding: 20px;">
                    <div class="info-grid">
                        <div class="info-card">
                            <div class="info-card-header">Configuration</div>
                            <div class="info-list">
                                ${renderPropRows(catalogData.config)}
                            </div>
                        </div>
                        <div class="info-card">
                            <div class="info-card-header">Statistics</div>
                            <div class="info-list">
                                <div class="info-row"><span class="label">Total Tables</span><span class="value">${catalogData.total_tables}</span></div>
                                <div class="info-row"><span class="label">Namespaces</span><span class="value">${Object.keys(catalogData.structure).length}</span></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function showNamespaceDetails(namespace) {
            const panel = document.getElementById('details-view');
            panel.innerHTML = '<div class="empty-state">Loading Namespace...</div>';

            try {
                const response = await fetch(`/api/catalog/namespace/${namespace}`);
                const data = await response.json();

                panel.innerHTML = `
                    <div class="panel-header">
                        <div class="panel-title"><span class="icon">${TREE_ICONS.namespace}</span> ${namespace}</div>
                        <div class="panel-subtitle">Namespace Details</div>
                    </div>
                    <div class="tab-content active" style="padding: 20px;">
                        <div class="info-card">
                            <div class="info-card-header">Properties</div>
                            <div class="info-list">
                                ${Object.keys(data.properties).length ? renderPropRows(data.properties) : '<div style="padding:15px; color:#95a5a6; text-align:center;">No properties set</div>'}
                            </div>
                        </div>
                    </div>
                `;
            } catch (err) {
                panel.innerHTML = `<div class="empty-state" style="color:var(--color-error)">Error fetching namespace details</div>`;
            }
        }

        async function showTableDetails(fullTableName) {
            const panel = document.getElementById('details-view');
            panel.innerHTML = '<div class="empty-state">Loading Table Metadata...</div>';

            try {
                const response = await fetch(`/api/catalog/table/${fullTableName}`);
                const data = await response.json();

                if (data.error) throw new Error(data.error);

                // Render Template
                panel.innerHTML = `
                    <div class="panel-header">
                        <div class="panel-title"><span class="icon">${TREE_ICONS.table}</span> ${data.identifier}</div>
                        <div class="panel-subtitle">${data.location}</div>
                    </div>
                    <div class="tabs">
                        <div class="tab active" onclick="switchTab(this, 'overview')">Overview</div>
                        <div class="tab" onclick="switchTab(this, 'schema')">Schema</div>
                        <div class="tab" onclick="switchTab(this, 'partitions')">Partitions</div>
                        <div class="tab" onclick="switchTab(this, 'snapshots')">Snapshots</div>
                    </div>

                    <!-- Overview Tab -->
                    <div id="overview" class="tab-content active">
                        <div class="info-grid">
                            <div class="info-card">
                                <div class="info-card-header">Table Properties</div>
                                <div class="info-list" style="max-height: 300px; overflow-y: auto;">
                                    ${renderPropRows(data.properties)}
                                </div>
                            </div>
                            <div class="info-card">
                                <div class="info-card-header">Metadata Status</div>
                                <div class="info-list">
                                    <div class="info-row"><span class="label">Format Version</span><span class="value">v${data.format_version}</span></div>
                                    <div class="info-row"><span class="label">Current Snapshot</span><span class="value">${data.current_snapshot_id || 'None'}</span></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Schema Tab -->
                    <div id="schema" class="tab-content">
                        <table>
                            <thead><tr><th>ID</th><th>Name</th><th>Type</th><th>Required</th><th>Doc</th></tr></thead>
                            <tbody>
                                ${data.schema.map(f => `
                                    <tr>
                                        <td>${f.id}</td>
                                        <td style="font-weight:500">${f.name}</td>
                                        <td><span style="background:rgba(0,255,255,0.1); color:var(--color-info); padding:2px 6px; border-radius:2px; font-size:0.85em; border: 1px solid rgba(0,255,255,0.2)">${f.type}</span></td>
                                        <td style="color: ${f.required ? 'var(--color-success)' : 'var(--color-error)'}">${f.required ? 'YES' : 'NO'}</td>
                                        <td><small>${f.doc || '-'}</small></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>

                    <!-- Partitions Tab -->
                    <div id="partitions" class="tab-content">
                        ${data.partitions.length ? `
                            <table>
                                <thead><tr><th>Field ID</th><th>Source ID</th><th>Name</th><th>Transform</th></tr></thead>
                                <tbody>
                                    ${data.partitions.map(p => `
                                        <tr>
                                            <td>${p.field_id}</td>
                                            <td>${p.source_id}</td>
                                            <td>${p.name}</td>
                                            <td><code>${p.transform}</code></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        ` : '<div class="empty-state" style="height:200px">No partitions defined (Unpartitioned)</div>'}
                    </div>

                    <!-- Snapshots Tab -->
                    <div id="snapshots" class="tab-content">
                        <div style="overflow-x: auto;">
                            <table>
                                <thead><tr><th>ID</th><th>Timestamp</th><th>Operation</th><th>Manifest</th></tr></thead>
                                <tbody>
                                    ${data.snapshots.map(s => `
                                        <tr>
                                            <td><code>${s.snapshot_id}</code></td>
                                            <td>${s.timestamp.replace('T', ' ')}</td>
                                            <td><span class="status-badge" style="background:#95a5a6">${s.summary.operation || 'unknown'}</span></td>
                                            <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${s.manifest_list}"><a href="#">${s.manifest_list.split('/').pop()}</a></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;

            } catch (err) {
                panel.innerHTML = `<div class="empty-state" style="color:#e74c3c">Error fetching table details: ${err.message}</div>`;
            }
        }

        // Helper: Switch Tabs
        window.switchTab = function (el, tabId) {
            // Update Tab UI
            el.parentElement.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');

            // Show Content
            const panel = el.closest('.details-panel');
            panel.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            panel.querySelector(`#${tabId}`).classList.add('active');
        };

        // Helper: Render Dictionary as Rows
        function renderPropRows(obj) {
            if (!obj) return '';
            return Object.entries(obj).map(([k, v]) => {
                if (typeof v === 'object') v = JSON.stringify(v);
                return `<div class="info-row"><span class="label">${k}</span><span class="value">${v}</span></div>`;
            }).join('');
        }
    </script>
</body>

</html>
