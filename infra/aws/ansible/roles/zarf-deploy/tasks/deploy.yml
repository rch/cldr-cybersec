---
# Deploy the cybersec-dask Zarf package
# Zarf deploy is idempotent — re-running updates components in place.
# The --confirm flag skips interactive prompts for air-gap automation.

- name: Deploy Zarf package
  command: >
    {{ zarf_remote_dir }}/zarf package deploy
    {{ zarf_remote_dir }}/{{ zarf_app_package }}
    --confirm
    --set DASK_WORKER_REPLICAS={{ zarf_dask_worker_replicas }}
    --set DASK_SPILL_DIR={{ zarf_dask_spill_dir }}
    {% if zarf_s3_endpoint != "" %}--set S3_ENDPOINT={{ zarf_s3_endpoint }}{% endif %}
    {% if zarf_s3_bucket != "" %}--set S3_BUCKET={{ zarf_s3_bucket }}{% endif %}
    {% if zarf_s3_region != "us-east-1" %}--set S3_REGION={{ zarf_s3_region }}{% endif %}
    {% if zarf_s3_access_key != "" %}--set S3_ACCESS_KEY={{ zarf_s3_access_key }}{% endif %}
    {% if zarf_s3_secret_key != "" %}--set S3_SECRET_KEY={{ zarf_s3_secret_key }}{% endif %}
    {% if zarf_s3_session_token != "" %}--set S3_SESSION_TOKEN={{ zarf_s3_session_token }}{% endif %}
  environment:
    KUBECONFIG: "{{ zarf_kubeconfig }}"
  register: zarf_deploy_result
  timeout: 900

- name: Display deploy result
  debug:
    msg: "{{ zarf_deploy_result.stdout_lines | default([]) }}"

# --- Disk-light: patch spill volume to emptyDir ---
- name: "Disk-light: patch Dask spill volume to emptyDir"
  command: >
    {{ zarf_kubectl }} --kubeconfig {{ zarf_kubeconfig }}
    patch daskcluster cybersec-dask -n dask --type=json
    -p '[{"op":"replace","path":"/spec/worker/spec/volumes/0","value":{"name":"dask-spill","emptyDir":{"sizeLimit":"512Mi"}}}]'
  register: spill_patch
  changed_when: "'patched' in spill_patch.stdout"
  ignore_errors: true
  when: zarf_disk_light | bool

- name: "Disk-light: restart workers for volume change"
  command: >
    {{ zarf_kubectl }} --kubeconfig {{ zarf_kubeconfig }}
    delete pods -n dask -l dask.org/component=worker
  changed_when: true
  when:
    - zarf_disk_light | bool
    - spill_patch is defined
    - spill_patch.rc == 0

# --- Deploy K8s Dashboard (if package was staged) ---
- name: Check if dashboard package exists on remote
  stat:
    path: "{{ zarf_remote_dir }}/{{ zarf_dashboard_package }}"
  register: dashboard_staged

- name: Deploy K8s Dashboard package
  command: >
    {{ zarf_remote_dir }}/zarf package deploy
    {{ zarf_remote_dir }}/{{ zarf_dashboard_package }}
    --confirm
  environment:
    KUBECONFIG: "{{ zarf_kubeconfig }}"
  register: dashboard_deploy_result
  timeout: 300
  when: dashboard_staged.stat.exists

- name: Display dashboard deploy result
  debug:
    msg: "{{ dashboard_deploy_result.stdout_lines | default(['Dashboard package not staged — skipped']) }}"
