---
# Deploy the cybersec-dask Zarf package
# Zarf deploy is idempotent — re-running updates components in place.
# The --confirm flag skips interactive prompts for air-gap automation.

- name: Deploy Zarf package
  command: >
    {{ zarf_remote_dir }}/zarf package deploy
    {{ zarf_remote_dir }}/{{ zarf_app_package }}
    --confirm
    --set DASK_WORKER_REPLICAS={{ zarf_dask_worker_replicas }}
    --set DASK_SPILL_DIR={{ zarf_dask_spill_dir }}
    {% if zarf_s3_endpoint != "" %}--set S3_ENDPOINT={{ zarf_s3_endpoint }}{% endif %}
    {% if zarf_s3_access_key != "" %}--set S3_ACCESS_KEY={{ zarf_s3_access_key }}{% endif %}
    {% if zarf_s3_secret_key != "" %}--set S3_SECRET_KEY={{ zarf_s3_secret_key }}{% endif %}
  environment:
    KUBECONFIG: "{{ zarf_kubeconfig }}"
  register: zarf_deploy_result
  timeout: 900

- name: Display deploy result
  debug:
    msg: "{{ zarf_deploy_result.stdout_lines | default([]) }}"
