---
# Datagen role defaults - two-phase dataset generation

# Namespace for datagen jobs
datagen_namespace: datagen

# S3 bucket for data storage (uses s3_bucket_name from aws:deploy task, falls back to env/default)
datagen_s3_bucket: "{{ s3_bucket_name | default(lookup('env', 'OTEL_S3_BUCKET') | default('cybersec-dask-data', true), true) }}"

# -------------------------------------------------------------------------
# Minimal Dataset (Phase 1) - runs quickly, provides immediate data
# -------------------------------------------------------------------------

datagen_minimal_span_count: 100000
datagen_minimal_services: 5
datagen_minimal_duration_hours: 24
datagen_minimal_s3_prefix: "otel-minimal"

# Resource limits for minimal job (completes in ~1 minute)
datagen_minimal_memory_limit: "4Gi"
datagen_minimal_cpu_limit: "2"

# -------------------------------------------------------------------------
# Large Dataset (Phase 2) - runs asynchronously for hours
# -------------------------------------------------------------------------

# Sub-batch streaming: generates CHUNK_SIZE spans at a time, writes immediately, frees memory
# Memory profile: 500K spans peaks ~1.5Gi (numpy arrays + PyArrow table + write)
# Never OOMs regardless of SPANS_PER_BATCH — only CHUNK_SIZE matters for peak memory
# For smaller validation (fits on limited clusters): batches=10, spans=2000000
datagen_large_batches: 3000
datagen_large_spans_per_batch: 5000000  # 5M per batch = 15B total (~1.5 TiB)
datagen_large_s3_prefix: "otel-1t"
datagen_large_duration_days: 7

# Sub-batch chunk size (number of spans generated per iteration)
# 2M spans peaks at ~2Gi with numpy arrays + PyArrow table (8Gi limit = 4x headroom)
datagen_large_chunk_size: 2000000

# Parquet write tuning for read-side predicate pushdown
datagen_large_row_group_size: 100000         # Smaller row groups = finer time-range skipping
datagen_large_compression: "ZSTD"            # ~30% smaller than Snappy for string-heavy OTEL data
datagen_large_compression_level: 3           # ZSTD level (1=fast, 22=max; 3 = good balance)

# Resource limits for large job
# Streaming sub-batches keep peak memory well under limit
datagen_large_memory_limit: "8Gi"
datagen_large_memory_request: "4Gi"
datagen_large_cpu_limit: "2"

# Parallelism for large job (number of pods running simultaneously)
# Uses K8s Indexed Job completions - each pod generates its shard of batches
# 8 pods (1 per node) coexist with 32 Dask workers (4 per node) on r6i.xlarge (32Gi)
datagen_large_parallelism: 8

# Maximum runtime for large job (36 hours)
datagen_large_deadline_seconds: 129600

# -------------------------------------------------------------------------
# Common Configuration
# -------------------------------------------------------------------------

# AWS credentials (from environment or AWS CLI config)
datagen_aws_access_key_id: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') | default(lookup('ini', 'aws_access_key_id', section='default', file='~/.aws/credentials', errors='ignore'), true) }}"
datagen_aws_secret_access_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') | default(lookup('ini', 'aws_secret_access_key', section='default', file='~/.aws/credentials', errors='ignore'), true) }}"
datagen_aws_region: "{{ aws_region | default(lookup('env', 'AWS_REGION') | default('us-east-1', true), true) }}"

# Container image for datagen jobs
datagen_image: "ghcr.io/dask/dask:latest"

# Control which datasets to generate
datagen_minimal_enabled: true
datagen_large_enabled: true

# Wait for minimal dataset before continuing (recommended for viz deployment)
datagen_wait_for_minimal: true
