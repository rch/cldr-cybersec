---
# JupyterHub defaults

# Ingress provider: 'cloudflare' (default) or 'ngrok' (deprecated)
# Set via -e ingress_provider=cloudflare when running ansible-playbook
ingress_provider: "cloudflare"

# JupyterHub Helm chart version
jupyterhub_chart_version: "4.0.0"

# Namespace for JupyterHub
jupyterhub_namespace: jupyterhub

# Existing Dask scheduler address (from dask role)
# Uses variables from dask role defaults
jupyterhub_dask_scheduler: "{{ dask_cluster_name | default('simple') }}-scheduler.{{ dask_namespace | default('dask') }}.svc.cluster.local:8786"

# Authentication type: dummy (dev), google, or github
jupyterhub_auth_type: "dummy"

# For Google OAuth (when jupyterhub_auth_type: google)
jupyterhub_google_client_id: "{{ lookup('env', 'JUPYTERHUB_GOOGLE_CLIENT_ID') }}"
jupyterhub_google_client_secret: "{{ lookup('env', 'JUPYTERHUB_GOOGLE_CLIENT_SECRET') }}"
jupyterhub_google_allowed_email: "{{ ngrok_allowed_email | default('') }}"

# ============================================================================
# DEPRECATED: ngrok ingress is deprecated in favor of Cloudflare Tunnel.
# Use ingress_provider=cloudflare (the default) instead.
# ngrok support will be removed in a future release.
# ============================================================================
# ngrok integration (deprecated - use ingress_provider instead)
jupyterhub_ngrok_enabled: "{{ ingress_provider | default('cloudflare') == 'ngrok' }}"
jupyterhub_ngrok_domain: "jupyter.zndx.org"

# Cloudflare DNS (used when ngrok is enabled - deprecated)
cloudflare_api_token: "{{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"
cloudflare_zone_id: "{{ lookup('env', 'CLOUDFLARE_ZONE_ID') }}"

# ngrok operator namespace (from ngrok role - deprecated)
ngrok_namespace: ngrok-system
ngrok_oauth_policy_name: google-oauth-policy

# Single-user server configuration
# IMPORTANT: Use the EXACT SAME image as Dask workers for perfect version compatibility
# The JupyterHub cmd override installs jupyterhub at startup
jupyterhub_singleuser_image: "ghcr.io/dask/dask:latest"
jupyterhub_singleuser_memory_limit: "4G"
jupyterhub_singleuser_memory_guarantee: "2G"
jupyterhub_singleuser_cpu_limit: 2
jupyterhub_singleuser_cpu_guarantee: 0.5

# Storage for user notebooks
jupyterhub_storage_capacity: "10Gi"

# Extra Python packages to install at startup
# Matches Dask worker requirements for compatibility
jupyterhub_extra_packages:
  - holoviews
  - datashader
  - mpire
  - bokeh
  - "dask[distributed]"
  - pandas
  - numpy
  - pyarrow
  - s3fs
  - networkx
  - param

# S3 bucket for OTel data storage
# Pattern: {project}-data (must match Tofu s3.tf and IAM policy)
jupyterhub_s3_bucket: "{{ project }}-data"
jupyterhub_aws_region: "{{ aws_region | default('us-east-1') }}"

# AWS credentials for S3 access in singleuser pods
# These are required for notebooks to access S3 data
jupyterhub_aws_access_key_id: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') | default('') }}"
jupyterhub_aws_secret_access_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') | default('') }}"
jupyterhub_aws_session_token: "{{ lookup('env', 'AWS_SESSION_TOKEN') | default('') }}"

# Hub configuration
jupyterhub_admin_users: []
jupyterhub_allowed_users: []  # Empty = allow all (with dummy auth)

# Deploy sample notebooks to users
# Set JUPYTERHUB_DEPLOY_NOTEBOOKS=false to disable
jupyterhub_deploy_notebooks: "{{ lookup('env', 'JUPYTERHUB_DEPLOY_NOTEBOOKS') | default('true', true) | bool }}"
# Directory containing .ipynb files (relative to project root or absolute)
# Set JUPYTERHUB_NOTEBOOKS_DIR to override
jupyterhub_notebooks_dir: "{{ lookup('env', 'JUPYTERHUB_NOTEBOOKS_DIR') | default(lookup('env', 'PROJECT_ROOT') + '/build/notebooks', true) }}"

# Requirements ConfigMap (created by dask role, shared between both)
jupyterhub_requirements_configmap: "dask-requirements"
