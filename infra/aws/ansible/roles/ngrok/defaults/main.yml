---
# ngrok operator defaults

# ngrok operator Helm chart version
ngrok_operator_version: "0.21.1"

# Namespace for ngrok operator
ngrok_namespace: ngrok-system

# Access control mode: 'oauth' or 'ip'
# - oauth: Requires GitHub/Google OAuth login
# - ip: Restricts access to specified IP addresses/CIDRs
ngrok_access_mode: "{{ lookup('env', 'NGROK_ACCESS_MODE') | default('oauth') }}"

# IP restriction configuration (when ngrok_access_mode == 'ip')
# List of allowed IPs or CIDRs
ngrok_allowed_ips: "{{ (lookup('env', 'NGROK_ALLOWED_IPS') | default('')).split(',') | select | list }}"

# OAuth configuration (when ngrok_access_mode == 'oauth')
ngrok_oauth_enabled: "{{ ngrok_access_mode == 'oauth' }}"
ngrok_oauth_provider: github  # Options: github, google
ngrok_allowed_email: "{{ lookup('env', 'NGROK_ALLOWED_EMAIL') | default('') }}"
ngrok_github_orgs: []  # List of allowed GitHub orgs, e.g., ['myorg']
ngrok_github_users: "{{ lookup('env', 'NGROK_ALLOWED_GITHUB_USERS') | default('') }}"  # Comma-separated usernames
ngrok_session_duration: 86400  # 24 hours in seconds
ngrok_idle_timeout: 3600       # 1 hour in seconds

# ngrok credentials (should be set via environment or vault)
ngrok_authtoken: "{{ lookup('env', 'NGROK_AUTH_TOKEN') | default(lookup('env', 'NGROK_AUTHTOKEN'), true) }}"
ngrok_api_key: "{{ lookup('env', 'NGROK_API_KEY') }}"

# Cloudflare DNS configuration
cloudflare_api_token: "{{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"
cloudflare_zone_id: "{{ lookup('env', 'CLOUDFLARE_ZONE_ID') }}"

# Custom domains (set to empty string to use ngrok-generated URLs)
ngrok_dask_domain: "dask.zndx.org"
ngrok_jupyterhub_domain: "jupyter.zndx.org"
ngrok_k8s_dashboard_domain: "k8s.zndx.org"
ngrok_panel_viz_domain: "viz.zndx.org"

# Service references
# K8s Dashboard service (kubernetes-dashboard namespace)
k8s_dashboard_service_name: kubernetes-dashboard
k8s_dashboard_service_namespace: kubernetes-dashboard
k8s_dashboard_service_port: 443

# Dask Dashboard service
dask_dashboard_service_name: "{{ dask_cluster_name | default('simple') }}-scheduler"
dask_dashboard_service_namespace: "{{ dask_namespace | default('dask') }}"
dask_dashboard_service_port: 8787

# JupyterHub service
jupyterhub_service_name: proxy-public
jupyterhub_service_namespace: jupyterhub
jupyterhub_service_port: 80

# Traffic policy name
ngrok_oauth_policy_name: oauth-policy
