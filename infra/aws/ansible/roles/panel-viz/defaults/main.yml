---
# Panel visualization service defaults

# Namespace for Panel deployment
panel_namespace: panel-viz

# Container image configuration
panel_image: "ghcr.io/dask/dask:latest"
panel_image_pull_policy: "IfNotPresent"

# Replica configuration
panel_replicas: 1
panel_min_replicas: 1
panel_max_replicas: 4

# Resource limits for Panel pods
# Reduced for validation; increase for production with larger datasets
panel_memory_limit: "8Gi"
panel_memory_request: "4Gi"
panel_cpu_limit: "2"
panel_cpu_request: "500m"

# Dask cluster connection
# Default target is the cybersec-dask DaskCluster deployed by the zarf
# package (cybersec-dask-amd64-*.tar.zst) — that cluster uses the
# cybersec-dask:2025.2.0 image with HoloViews/Datashader/Panel/Bokeh
# pre-installed. The legacy `simple` cluster from the dask role can be
# torn down once cybersec-dask is healthy to free node memory.
panel_dask_scheduler: "cybersec-dask-scheduler.dask.svc.cluster.local:8786"

# S3/MinIO configuration for data access
# Empty endpoint = use real AWS S3 (not MinIO)
panel_s3_endpoint: ""
# S3 bucket for OTEL data - uses s3_bucket_name from aws:deploy, OTEL_S3_BUCKET env var, or defaults
panel_s3_bucket: "{{ s3_bucket_name | default(lookup('env', 'OTEL_S3_BUCKET') | default('cybersec-dask-data', true), true) }}"
panel_otel_data_path: "s3://{{ panel_s3_bucket }}/otel-minimal/"

# AWS credentials (from environment, AWS CLI config, or vault)
# Priority: 1. Environment vars, 2. AWS CLI credentials file, 3. MinIO fallback
# Defaults to empty so the pod falls through to the EC2 instance role
# (cybersec-dask-rke2-node has s3:GetObject/PutObject on cybersec-dask-*).
# Previously these defaulted to ~/.aws/credentials [default] / MinIO env
# vars, which on developer machines often pointed to keys in a DIFFERENT
# AWS account and caused S3 reads to fail with "Access Key Id does not
# exist". Override only when targeting a non-AWS S3 (e.g. MinIO local).
panel_aws_access_key_id: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') | default(lookup('env', 'MINIO_ACCESS_KEY'), true) }}"
panel_aws_secret_access_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') | default(lookup('env', 'MINIO_SECRET_KEY'), true) }}"
# Session token required when AWS_ACCESS_KEY_ID is an STS temporary credential
# (ASIA... prefix). Empty when using long-lived IAM user keys (AKIA... prefix)
# or the EC2 instance role.
panel_aws_session_token: "{{ lookup('env', 'AWS_SESSION_TOKEN') | default('', true) }}"
# Note: Uses aws_region from deploy task, PANEL_AWS_REGION env var, or defaults
panel_aws_region: "{{ aws_region | default(lookup('env', 'PANEL_AWS_REGION') | default(lookup('env', 'AWS_REGION'), true) | default('us-east-1', true), true) }}"

# Rendering configuration
panel_canvas_width: 800
panel_canvas_height: 400
panel_cache_size: 100
panel_debounce_ms: 250

# ============================================================================
# DEPRECATED: ngrok ingress is deprecated in favor of Cloudflare Tunnel.
# Use ingress_provider=cloudflare (the default) instead.
# ============================================================================
# ngrok ingress configuration (disabled when using Cloudflare)
panel_ngrok_enabled: "{{ ingress_provider | default('cloudflare') == 'ngrok' }}"
panel_ngrok_domain: "viz.zndx.org"
ngrok_oauth_policy_name: "oauth-policy"
ngrok_access_mode: "{{ lookup('env', 'NGROK_ACCESS_MODE') | default('oauth') }}"
ngrok_allowed_ips: "{{ (lookup('env', 'NGROK_ALLOWED_IPS') | default('')).split(',') | select | list }}"
ngrok_oauth_provider: github

# Pod affinity with Dask workers for data locality
panel_dask_affinity_enabled: true
panel_dask_worker_namespace: "{{ dask_namespace | default('dask') }}"

# HPA configuration
panel_hpa_enabled: true
panel_hpa_cpu_threshold: 70
panel_hpa_memory_threshold: 70

# Health check configuration
# Note: pip install can take 60-90s, especially for numba compilation
panel_health_path: "/healthz"
panel_readiness_initial_delay: 180
panel_liveness_initial_delay: 240
panel_health_period: 15

# Requirements installation
panel_install_requirements: true
panel_requirements_configmap: "panel-requirements"
