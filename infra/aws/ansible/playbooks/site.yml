---
# Main playbook for RKE2 cluster with Dask
# Usage: ansible-playbook playbooks/site.yml

- name: Prepare all nodes
  hosts: rke2
  become: true
  roles:
    - common

- name: Install RKE2 server (first control plane)
  hosts: control_plane[0]
  become: true
  vars:
    rke2_role: server
    rke2_is_first_server: true
  roles:
    - rke2-server

- name: Install RKE2 server (additional control planes)
  hosts: control_plane[1:]
  become: true
  serial: 1
  vars:
    rke2_role: server
    rke2_is_first_server: false
  roles:
    - rke2-server

- name: Install RKE2 agent (workers)
  hosts: workers
  become: true
  vars:
    rke2_role: agent
  roles:
    - rke2-agent

- name: Setup S3 data bucket
  hosts: bastion
  become: false
  vars_files:
    - ../group_vars/all.yml
  roles:
    - role: s3-data
      tags: [s3, storage]

- name: Deploy Dask operator
  hosts: control_plane[0]
  become: true
  roles:
    - dask

- name: Generate OTEL datasets
  hosts: control_plane[0]
  become: true
  vars_files:
    - ../group_vars/all.yml
  roles:
    - role: datagen
      tags: [datagen]
      when: datagen_enabled | default(true)

- name: Deploy Panel visualization
  hosts: control_plane[0]
  become: true
  vars_files:
    - ../group_vars/all.yml
  roles:
    - role: panel-viz
      tags: [panel-viz, viz]

- name: Deploy JupyterHub
  hosts: control_plane[0]
  become: true
  vars_files:
    - ../group_vars/all.yml
  roles:
    - role: jupyterhub
      tags: [jupyterhub]

- name: Configure ingress tunnels
  hosts: control_plane[0]
  become: true
  vars_files:
    - ../group_vars/all.yml
  vars:
    # Default to ngrok for backwards compatibility
    ingress_provider: "{{ lookup('env', 'INGRESS_PROVIDER') | default('ngrok') }}"
  roles:
    - role: ngrok
      when: ingress_provider == 'ngrok'
      tags: [ngrok, ingress]
    - role: cloudflare-tunnel
      when: ingress_provider == 'cloudflare'
      tags: [cloudflare, ingress]
