---
# Group variables for all hosts

# Project identification (must match Tofu var.project)
project: "cybersec"

# AWS region - this is a fallback default. The actual region is set by:
# 1. aws:inventory task writes it to the inventory [all:vars] section
# 2. aws:deploy* tasks pass it via -e "aws_region=..." from tofu state
aws_region: "us-east-1"

# RKE2 version
# RKE2 version - latest stable is used by installer when channel=stable
rke2_version: "v1.34.3+rke2r1"

# Dask configuration
# 16 workers across 8x t3.xlarge nodes (2 workers per node @ 4Gi each)
dask_worker_replicas: 16
dask_worker_memory_limit: "6Gi"
dask_worker_memory_request: "4Gi"
dask_image: "ghcr.io/dask/dask:latest"
