[book]
authors = ["Weathership"]
language = "en"
src = "src"
title = "Cyberphy"

# Layout mirrors Ægir (docs/current): sources in src/, theme next to book.toml,
# generated HTML in book/ (gitignored). Scratch notes live under docs/scratch/
# and are not part of the published book.

[preprocessor.d2]
path = "d2"
layout = "elk"
inline = false
output-dir = "d2"

# Disabled: mdbook-mermaid has parsing issues with mdbook 0.5.x in CI
# [preprocessor.mermaid]
# command = "mdbook-mermaid"

[output.html]
default-theme = "light"
additional-css = ["theme/custom.css"]
additional-js = ["theme/diagrams.js"]
git-repository-url = "https://github.com/weathership/cyberphy"
edit-url-template = "https://github.com/weathership/cyberphy/edit/trunk/docs/current/{path}"
# site-url: set to "/cyberphy/" if using project Pages at weathership.github.io/cyberphy/

[output.html.print]
enable = true
