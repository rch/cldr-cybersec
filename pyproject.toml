[project]
name = "cybersec"
version = "0.1.0"
description = "Cybersec toolkit with Flink processing and Iceberg storage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=15.0.0",
    "pandas>=2.2.0",
    "psycopg2-binary>=2.9.9",
    "boto3>=1.34.0",
    "pyiceberg[s3fs,sql-postgres,pyiceberg-core]>=0.10.0",
    "apache-flink>=2.2.0",
    "kafka-python>=2.0.2",
    "flask>=3.0.0",
    # Bootstrap CLI dependencies
    "typer>=0.12.0",
    "rich>=13.7.0",
    # Bootstrap MCP server dependencies
    "fastmcp>=0.1.0",
    # HTTP client for health checks
    "httpx>=0.27.0",
    # Process monitoring for health checks
    "psutil>=5.9.0",
    # TOML writing
    "tomli-w>=1.0.0",
    "ty>=0.0.13",
    "ortools>=9.12.4544",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.2.0",
]

[project.scripts]
cybersec = "cybersec.cli.main:run"
cybersec-mcp = "cybersec.mcp.server:run_server"

[tool.setuptools.packages.find]
include = ["cybersec*"]
