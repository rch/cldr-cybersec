# Polaris configuration for PostgreSQL metadata store and MinIO storage
server:
  applicationConnectors:
    - type: http
      port: 8181
  adminConnectors:
    - type: http
      port: 8182

metaStoreManager:
  type: eclipse-link
  persistence-unit: polaris
  conf:
    # PostgreSQL connection
    jakarta.persistence.jdbc.driver: org.postgresql.Driver
    jakarta.persistence.jdbc.url: jdbc:postgresql://localhost:5438/iceberg
    jakarta.persistence.jdbc.user: cybersec
    jakarta.persistence.jdbc.password: cybersec

# AWS SDK configuration for MinIO access
callContext:
  resolverClassName: org.apache.polaris.service.context.CallContextResolverImpl

# Set default catalog to avoid needing warehouse parameter
featureConfiguration:
  ENFORCE_PRINCIPAL_CREDENTIAL_ROTATION_REQUIRED_CHECKING: false
  DEFAULT_CATALOG: cybersec

# Default storage config for MinIO
defaultRealms:
  - realmName: default-realm
    serviceAdmin:
      type: password
      clientId: admin
      clientSecret: admin
    catalogs:
      - name: cybersec
        type: INTERNAL
        storageType: S3
        properties:
          s3.endpoint: http://localhost:9010
          s3.access-key-id: minioadmin
          s3.secret-access-key: minioadmin
          s3.path-style-access: "true"
          s3.region: us-east-1
        baseLocation: s3://cybersec/iceberg/warehouse
        storageConfigInfo:
          storageType: S3
          allowedLocations:
            - s3://cybersec
